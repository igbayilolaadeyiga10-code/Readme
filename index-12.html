function login(){
  try{
    const userEl=document.getElementById("loginUser");
    const passEl=document.getElementById("loginPass");
    if(!userEl||!passEl)return toast("Login form is unavailable. Please reload.");
    const key=String(userEl.value||"").trim().toLowerCase();

    if(!key||!pass)return toast("Enter your username/email and password");

    users=load("palazo_users",users).map(ensureUser);
    const u=users.find(x=>{
      const username=String(x.username||"").trim().toLowerCase();
      const email=String(x.email||"").trim().toLowerCase();
      return username===key || email===key;
    });

    if(!u)return toast("Account not found. Check your username/email.");
    if(String(u.password||"")!==pass)return toast("Incorrect password");
    if(u.banned)return toast("Your account has been banned");

    session={username:u.username};
    saveSession(session);
    render();

  }catch(err){

function accrueInvestments(u){

 for(const inv of u.investments){if(inv.status!=='active')continue;let last=inv.lastReturnDate||inv.startDate||today;let d=new Date(last+'T00:00:00');const end=new Date(today+'T00:00:00');let days=Math.floor((end-d)/86400000);if(days>0){const earned=days*Number(inv.daily||0);u.assetBalance=Number(u.assetBalance||0)+earned;inv.totalReturned=Number(inv.totalReturned||0)+earned;inv.lastReturnDate=today;u.transactions.unshift({type:'Investment daily return',amount:earned,balance:'Asset Balance',status:'approved',date:now()});changed=true}}

function adminPanel(){

 const screen=document.getElementById("adminScreen");

  if(page==="users")content=usersAdmin();

  if(page==="ads")content=adsAdmin();
  if(page==="settings")content=settingsAdmin();
  screen.innerHTML=`<div class="admin-shell"><div class="admin-top"><div><h2>Palazzo Admin Panel</h2><small>Control Center</small></div><button class="admin-close" aria-label="Exit admin panel" onclick="closeAdminPanel()">×</button></div><div class="admin-body"><div class="admin-tabs">${tabs.map(x=>`<button class="admin-tab ${page===x?"active":""}" onclick="adminPage('${x}')">${x}</button>`).join("")}</div>${content}</div></div>`;
 };
 window.adminPage=(p)=>{page=p;renderAdmin()};
 window.adminRefresh=renderAdmin;
 renderAdmin();
}

function manageUser(username){const u=users.find(x=>x.username===username);if(!u)return;openModal(`<div class="modal-head"><div><div class="section">User Management</div><h2 style="margin:0">@${esc(u.username)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">Task: ${money(u.earning||0)} • Affiliate: ${money(u.affiliate||0)} • Deposit: ${money(u.deposit||0)} • Asset: ${money(u.assetBalance||0)}</div><div class="fieldlabel" style="margin-top:12px">Wallet</div><select id="balType" class="select"><option value="earning">Task Balance</option><option value="affiliate">Affiliate Balance</option><option value="deposit">Legacy Deposit Balance</option><option value="assetBalance">Asset Balance</option><option value="adBalance">Ads Balance</option></select><div class="fieldlabel">Amount</div><input id="balAmt" class="input" type="number" placeholder="Amount"><div class="grid2"><button class="btn green-btn" onclick="adjustUserBalance('${esc(u.username)}',1)">Add Balance</button><button class="btn danger" onclick="adjustUserBalance('${esc(u.username)}',-1)">Deduct Balance</button></div>`)}
function adjustUserBalance(username,sign){const u=users.find(x=>x.username===username),field=document.getElementById('balType').value,n=Number(document.getElementById('balAmt').value||0);if(!u||n<=0)return toast('Enter a valid amount');if(sign<0&&Number(u[field]||0)<n)return toast('Insufficient balance');u[field]=Number(u[field]||0)+(sign*n);u.transactions=u.transactions||[];u.transactions.unshift({type:sign>0?'Admin balance credit':'Admin balance deduction',amount:sign*n,balance:field,status:'approved',date:now()});save('palazo_users',users);toast(sign>0?'Balance added':'Balance deducted');closeModal();adminPanel()}

 const rows=users.flatMap(u=>(u.deposits||[]).map(d=>({u,d}))).sort((a,b)=>new Date(b.d.date||0)-new Date(a.d.date||0));

 const history=rows.slice(0,40).map(({u,d})=>`<div class="admin-order"><div><b>@${esc(u.username)} • ${money(d.amount)}</b><div class="muted">${esc(d.date||'')} • ${esc(d.accountName||'')}</div></div><span class="pill ${esc(d.status||'pending')}">${esc((d.status||'pending').toUpperCase())}</span></div>`).join('')||'<div class="empty">No deposit history.</div>';
 return `<div class="card"><div class="section">Pending Deposits</div><p class="muted">Review user deposits before crediting Deposit Balance.</p>${html}</div><div class="card"><div class="section">Deposit History</div>${history}</div>`;

function viewDepositProof(username,id){
 const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id); if(!d?.proof)return toast('Screenshot unavailable');
 openModal(`<div class="modal-head"><div><div class="section">Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${d.proof}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px" alt="Deposit screenshot">`);

function approveDeposit(username,id){
 const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id); if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');
 d.status='approved';d.approvedDate=now();const amount=Number(d.amount||0);const kind=d.kind||'ads';if(kind==='ads'){u.adBalance=Number(u.adBalance||0)+amount;}else{u.deposit=Number(u.deposit||0)+amount;}u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',money(amount)+' was added to '+(kind==='ads'?'Ads Balance':'Deposit Balance')+'.','approved');
 const parent=u.referrerUsername?users.find(x=>x.username===u.referrerUsername):null;
 if(parent&&!d.referralCommissionPaid){const pct=Number(cfg.depositReferralCommission||25);const bonus=Number(d.amount||0)*pct/100;parent.affiliate=Number(parent.affiliate||0)+bonus;parent.totalReferralDeposits=Number(parent.totalReferralDeposits||0)+Number(d.amount||0);parent.transactions=parent.transactions||[];parent.transactions.unshift({type:'Referral deposit commission',amount:bonus,balance:'Affiliate Balance',status:'approved',date:now(),from:u.username});d.referralCommissionPaid=true;}
 save('palazo_users',users);toast('Deposit approved and credited');adminPanel();
}
function rejectDeposit(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');d.status='rejected';d.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+money(d.amount||0)+' deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Deposit rejected — status updated immediately');adminPanel();}

function viewAssetDepositProof(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!d?.proof)return toast('Screenshot unavailable');openModal(`<div class="modal-head"><div><div class="section">Asset Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${d.proof}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px" alt="Asset deposit screenshot">`);}
function approveAssetDeposit(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');d.status='approved';d.approvedDate=now();const amount=Number(d.amount||0);u.assetBalance=Number(u.assetBalance||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,'Asset Deposit Approved');addNotification(u,'Asset Deposit Approved',money(amount)+' was added to Asset Balance.','approved');save('palazo_users',users);toast('Asset deposit approved — balance and status updated immediately');adminPanel();}

function tasksAdmin(){
 refreshTasksFromStorage();
 const taskList=cfg.tasks.map(t=>{const m=PLATFORM_META[t.app]||PLATFORM_META.Other;const left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));return `<div class="price-chip"><div style="display:flex;gap:9px;align-items:center"><div class="platform-logo ${m.cls}">${esc(m.icon)}</div><div><b>${esc(t.app)} • ${esc(t.category)}</b><div class="muted">Reward ${money(t.reward)} • ${Number(t.completed||0)} completed • ${left} slots left</div></div></div><div style="display:flex;gap:5px"><button class="btn secondary" style="width:auto;padding:8px" onclick="editTask('${esc(t.id)}')">Edit</button><button class="btn danger" style="width:auto;padding:8px" onclick="deleteTask('${esc(t.id)}')">Delete</button></div></div>`}).join('')||'<p class="muted">No tasks.</p>';
 const first=Object.keys(TASK_TYPES)[0];
 return `<div class="card"><div class="section">Task Management</div><p class="muted">Create platform-specific tasks with logos, instructions, reward, slots and links. Admin can edit or delete them anytime.</p>${taskList}</div>
 <div class="card"><div class="section">Add Task</div><div class="fieldlabel">Platform</div><input type="hidden" id="taskPlatform" value="${first}">${platformChoices(first,'task')}<div class="fieldlabel">Task Type</div><select id="taskType" class="select">${TASK_TYPES[first].map(x=>`<option>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="ntDesc" class="textarea" placeholder="Tell users exactly what to do and what proof to submit"></textarea><div class="grid2"><div><div class="fieldlabel">Reward (₦)</div><input id="ntReward" class="input" type="number" min="0.01" step="0.01" placeholder="0.50"></div><div><div class="fieldlabel">Total Slots</div><input id="ntSlots" class="input" type="number" min="1" placeholder="1000"></div></div><div class="fieldlabel">Task Link</div><input id="ntLink" class="input" placeholder="https://..."><button class="btn" onclick="addTask()">Add Task</button></div>
 <div class="card"><div class="section">Pending User Submissions</div>${users.flatMap(u=>(u.taskSubmissions||[]).filter(s=>s.status==='pending').map(s=>({u,s}))).map(({u,s})=>`<div class="row"><div><b>@${esc(u.username)} • ${esc(s.category)}</b><div class="muted">Reward ${money(s.reward)} • ${esc(s.fileName)}<br>${esc(s.date)}</div>${s.proof?`<button class="btn secondary" style="width:auto;margin-top:7px;padding:7px 10px" onclick="viewProof('${esc(u.username)}','${esc(s.id)}')">View Screenshot</button>`:''}</div><div style="display:flex;gap:5px"><button class="btn green-btn" style="width:auto;padding:8px" onclick="approveTask('${esc(u.username)}','${esc(s.id)}')">Approve</button><button class="btn danger" style="width:auto;padding:8px" onclick="rejectTask('${esc(u.username)}','${esc(s.id)}')">Reject</button></div></div>`).join('')||'<p class="muted">No pending task submissions.</p>'}</div>`;
}
function saveTasks(){cfg.tasks=Array.isArray(cfg.tasks)?cfg.tasks:[];save("palazo_config",cfg);saveTasksToDB(cfg.tasks).catch(e=>console.error("Task DB save failed",e));return true}
function refreshTasksFromStorage(){try{const saved=JSON.parse(localStorage.getItem("palazo_config")||"null");if(saved&&Array.isArray(saved.tasks))cfg.tasks=saved.tasks}catch(e){}if(!Array.isArray(cfg.tasks))cfg.tasks=[];return cfg.tasks}
async function addTask(){
 refreshTasksFromStorage();
 const app=document.getElementById('taskPlatform')?.value,cat=document.getElementById('taskType')?.value,desc=document.getElementById('ntDesc')?.value.trim(),reward=Number(document.getElementById('ntReward')?.value),slots=Math.floor(Number(document.getElementById('ntSlots')?.value)||0),link=document.getElementById('ntLink')?.value.trim();
 if(!app||!cat||reward<=0||slots<1||!link||!desc)return toast('Complete all task fields');
 cfg.tasks.push({id:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),app,category:cat,description:desc,reward,slots,completed:0,boosted:false,link,icon:(PLATFORM_META[app]||PLATFORM_META.Other).icon});
 try{ await saveTasks(); toast('Task added successfully'); adminPanel(); }catch(e){ console.error(e); toast('Task could not be saved to Supabase. Please try again.'); }
}
function editTask(id){
 const t=cfg.tasks.find(x=>x.id===id);if(!t)return;const app=t.app||'Telegram';
 openModal(`<div class="modal-head"><div><div class="section">Task Management</div><h2 style="margin:0">Edit Task</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="fieldlabel">Platform</div><input type="hidden" id="etApp" value="${esc(app)}">${platformChoices(app,'editTask')}<div class="fieldlabel">Task Type</div><select id="etCat" class="select">${(TASK_TYPES[app]||[t.category]).map(x=>`<option ${x===t.category?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="etDesc" class="textarea">${esc(t.description||'')}</textarea><div class="grid2"><div><div class="fieldlabel">Reward</div><input id="etReward" class="input" type="number" step="0.01" value="${Number(t.reward||0)}"></div><div><div class="fieldlabel">Total Slots</div><input id="etSlots" class="input" type="number" value="${Number(t.slots||0)}"></div></div><div class="fieldlabel">Task Link</div><input id="etLink" class="input" value="${esc(t.link||'')}"><button class="btn" onclick="saveTaskEdit('${esc(id)}')">Save Task</button>`);
}
async function saveTaskEdit(id){const t=cfg.tasks.find(x=>x.id===id);if(!t)return;t.app=document.getElementById('etApp').value;t.category=document.getElementById('etCat').value;t.description=document.getElementById('etDesc').value.trim();t.reward=Number(document.getElementById('etReward').value)||0;t.slots=Math.floor(Number(document.getElementById('etSlots').value)||0);t.link=document.getElementById('etLink').value.trim();t.icon=(PLATFORM_META[t.app]||PLATFORM_META.Other).icon;if(!t.app||!t.category||t.reward<=0||t.slots<1||!t.link||!t.description)return toast('Complete all task fields');try{await saveTasks();closeModal();toast('Task updated successfully');adminPanel()}catch(e){console.error(e);toast('Task could not be saved to Supabase.')}}
async function deleteTask(id){refreshTasksFromStorage();if(!id)return;if(!confirm('Delete this task?'))return;const before=cfg.tasks.length;cfg.tasks=cfg.tasks.filter(x=>String(x.id)!==String(id));if(cfg.tasks.length===before)return toast('Task not found');try{await saveTasks();toast('Task deleted successfully');adminPanel()}catch(e){console.error(e);toast('Task could not be deleted from Supabase.')}}
async function deleteAllTasks(){refreshTasksFromStorage();if(!cfg.tasks.length)return toast('There are no tasks to delete');if(!confirm('Delete ALL available tasks? This cannot be undone.'))return;cfg.tasks=[];try{await saveTasks();toast('All tasks deleted successfully');adminPanel()}catch(e){console.error(e);toast('Tasks could not be deleted from Supabase.')}}
function viewProof(username,id){
 const u=users.find(x=>x.username===username),sub=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!sub?.proof)return toast('Screenshot unavailable');
 openModal(`<div class="modal-head"><div><div class="section">Task Proof</div><h2 style="margin:0">Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${sub.proof}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px;border:1px solid #e5eaf2" alt="Task screenshot">`);
}
function approveTask(username,id){
 const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id),t=cfg.tasks.find(x=>x.id===s?.taskId);
 if(!u||!s||s.status!=="pending")return toast("This submission is no longer pending");
 if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast("This task has no slots left");
 const reward=Number(s.reward||0);s.status="approved";s.approvedDate=now();u.earning=Number(u.earning||0)+reward;
 if(!updateRequestTransaction(u,s.id,'approved',reward,'Task Approved'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Approved',amount:reward,balance:'Task Balance',status:'approved',date:now()});
 addNotification(u,'Task Approved','Your '+s.category+' task was approved and '+money(reward)+' was added to Task Balance.','approved');
 if(t)t.completed=Number(t.completed||0)+1;

function renderAuth(mode){

 document.getElementById('app').innerHTML=`<div class="auth-page" style="min-height:100vh;display:grid;place-items:center;padding:16px 12px;position:relative;z-index:1"><div style="width:min(400px,100%)"><div class="center" style="margin-bottom:18px"><div class="brand-logo" style="margin:auto;width:76px;height:76px;border-radius:23px"><img src="${PALAZZO_LOGO}" alt="Palazo Cash logo"></div><h1 style="margin:12px 0 4px;font-size:26px;font-weight:950;color:var(--navy)">${mode==='login'?'Welcome back':'Create your account'}</h1><p class="muted" style="margin:0;font-size:11px">${mode==='login'?'Sign in to continue to Palazo Cash':'Register free, then continue to the login page.'}</p></div><div class="card"><div class="announce" style="margin-bottom:16px"><div class="announce-icon">${PIcon('shield',17)}</div><div><b>Secure account access</b><span>Your balance and rewards stay behind your login.</span></div></div>${mode==='login'?`<form id="loginForm" onsubmit="event.preventDefault();login();"><div class="fieldlabel">Username or Email <span class="required">*</span></div><input id="loginUser" class="input" autocomplete="username" placeholder="Enter username or email" required><div class="fieldlabel">Password <span class="required">*</span></div><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="submit" id="loginBtn" class="btn">Login ${PIcon('arrow',14)}</button></form><div class="center muted" style="margin-top:16px;font-size:11px">New to Palazo Cash? <b style="color:#9b7800;cursor:pointer" onclick="renderAuth('register')">Create an account</b></div>`:`<form id="registerForm" onsubmit="event.preventDefault();register();"><div class="fieldlabel">Username <span class="required">*</span></div><input id="regUser" class="input" autocomplete="username" placeholder="e.g. arausi" required><div class="fieldlabel">Email Address <span class="required">*</span></div><input id="regEmail" class="input" type="email" autocomplete="email" placeholder="name@example.com" required><div class="fieldlabel">Phone Number <span class="required">*</span></div><input id="regPhone" class="input" autocomplete="tel" placeholder="08012345678" required><div class="fieldlabel">Password <span class="required">*</span></div><input id="regPass" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><div class="fieldlabel">Invitation Code <span class="muted">(Optional)</span></div><input id="regRef" class="input" value="${esc(refFromUrl)}" placeholder="Enter invitation code" ${refFromUrl?'readonly style="background:#f1f5f9;cursor:not-allowed"':''}><button type="submit" class="btn">Create Account ${PIcon('arrow',14)}</button></form><p class="muted center" style="font-size:9px;margin:12px 0 0">After registration you will be taken directly to the login page.</p><div class="center muted" style="margin-top:16px;font-size:11px">Already registered? <b style="color:#9b7800;cursor:pointer" onclick="renderAuth('login')">Login</b></div>`}</div></div></div>`;
}
function register(){
 const username=document.getElementById('regUser')?.value.trim().replace(/\s+/g,'_'),email=document.getElementById('regEmail')?.value.trim(),phone=document.getElementById('regPhone')?.value.trim(),password=document.getElementById('regPass')?.value,ref=document.getElementById('regRef')?.value.trim();
 if(!username||username.length<3||!email||!phone||!password||password.length<8)return toast('Complete all required fields');
 if(users.some(u=>String(u.username).toLowerCase()===username.toLowerCase()))return toast('Username already exists');
 const u=ensureUser({username,email,phone,password,referralCode:username.toUpperCase(),referrerCode:ref});
 if(ref){const parent=users.find(x=>String(x.referralCode||x.username).toLowerCase()===ref.toLowerCase()||String(x.username).toLowerCase()===ref.toLowerCase());if(parent){u.referrerUsername=parent.username;parent.referrals=Number(parent.referrals||0)+1;}}
 users.push(u);save('palazo_users',users);save('palazo_config',cfg);try{localStorage.removeItem('palazo_referral_code')}catch(e){}session=null;saveSession(null);toast('Registration successful. Please login.');setTimeout(()=>renderAuth('login'),350);
}

    }catch(e){console.error(e);toast('Unable to connect to Supabase. Check your internet and try again.');}
    finally{if(btn){btn.disabled=false;btn.textContent='Login →';}}
  };

  logout = async function(){
    try{await sb.auth.signOut()}catch(e){}
    session=null;saveSession(null);users=[];renderAuth('login');
  };

  let palazoAdminTaps=0;
  let palazoAdminTapTimer=null;
  tapAdmin = function(){
    palazoAdminTaps++;
    clearTimeout(palazoAdminTapTimer);
    palazoAdminTapTimer=setTimeout(()=>{palazoAdminTaps=0;},5000);
    if(palazoAdminTaps<10)return;
    palazoAdminTaps=0;
    const u=me();
    if(!u || u.banned){toast('Admin access unavailable');return;}
    const pin=window.prompt('Enter admin password');
    if(pin!=='2026'){toast('Incorrect admin password');return;}
    if(u.role!=='admin'){toast('Admin access is not enabled for this account');return;}
    oldAdminPanel();
  };

  // Admin data refresh: every time the panel opens, pull the latest cloud records.
  adminPanel = async function(){
    const current=me();
    if(!current || current.role!=='admin' || current.banned){toast('Admin access is not enabled for this account');return;}
    if(window.PalazoCloud.ready){
      try{await loadAdminProfiles();await loadCloudData();}
      catch(e){console.error('Admin cloud load failed:',e);toast('Could not refresh admin data from Supabase.');}
    }
    oldAdminPanel();
  };

  async function startCloud(){
    if(window.PalazoCloud.loading)return;
    window.PalazoCloud.loading=true;
    try{
      const {data:{session:asession}}=await sb.auth.getSession();
      if(asession){
        const u=await loadCurrentProfile();
        if(u){
          if(u.banned){await sb.auth.signOut();session=null;saveSession(null);users=[];renderAuth('login');toast('Your account has been banned');return;}
          if(u.role==='admin') await seedInitialTasksIfNeeded();
          await loadCloudData();
          if(u.role==='admin')await loadAdminProfiles();
          render();
        }else{await sb.auth.signOut();renderAuth('login');}
      }else{
        session=null;saveSession(null);users=[];renderAuth('login');
      }
      window.PalazoCloud.ready=true;
    }catch(e){
      console.error('Supabase startup failed:',e);
      window.PalazoCloud.ready=false;
      toast('Supabase connection failed. Run the SQL setup first.');
    }finally{window.PalazoCloud.loading=false;}
  }

  sb.auth.onAuthStateChange(function(event,asession){
    if(event==='SIGNED_OUT'){session=null;saveSession(null);users=[];renderAuth('login');}
  });

  // The old local startup may have rendered first; cloud startup replaces it once ready.
  setTimeout(startCloud,0);
})();

/* === Palazo screenshot-only task verification + Supabase Storage cleanup === */
(function(){
  const TASK_PROOF_BUCKET='task-proofs';
  async function compressTaskImage(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=()=>reject(reader.error||new Error('read failed'));
      reader.onload=()=>{const img=new Image();
        img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));
          const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
          const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
          c.toBlob(b=>b?resolve(b):reject(new Error('compression failed')),'image/jpeg',0.76);
        };
        img.onerror=()=>reject(new Error('invalid image'));img.src=reader.result;
      };reader.readAsDataURL(file);
    });
  }
  async function uploadTaskProof(userId,submissionId,file){
    const blob=await compressTaskImage(file);
    const path=String(userId)+'/'+String(submissionId)+'.jpg';
    const {error}=await window.PalazoCloud.sb.storage.from(TASK_PROOF_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});
    if(error)throw error;return path;
  }
  async function deleteTaskProof(path){
    if(!path)return true;const {error}=await window.PalazoCloud.sb.storage.from(TASK_PROOF_BUCKET).remove([path]);if(error)throw error;return true;
  }
  async function getTaskProofUrl(path){
    if(!path)return null;const {data,error}=await window.PalazoCloud.sb.storage.from(TASK_PROOF_BUCKET).createSignedUrl(path,300);if(error)throw error;return data?.signedUrl||null;
  }
  window.PalazoCloud.uploadTaskProof=uploadTaskProof;
  window.PalazoCloud.deleteTaskProof=deleteTaskProof;
  window.PalazoCloud.getTaskProofUrl=getTaskProofUrl;

  window.tasksPage=function(u){
    if(currentTaskId){
      const t=(cfg.tasks||[]).find(x=>String(x.id)===String(currentTaskId));
      if(!t){currentTaskId=null;return window.tasksPage(u)}
      const sub=taskStatus(u,t.id),started=!!(u.taskStarted&&u.taskStarted[t.id]),left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));
      if(sub)return `<h2 class="title">Task Details</h2><p class="subtitle">Track your screenshot submission and approval status.</p><div class="card status-card"><div class="section-head"><h2>${esc(t.app)} · ${esc(t.category)}</h2><span class="pill ${esc(sub.status||'pending')}">${esc(String(sub.status||'pending').toUpperCase())}</span></div><div class="row"><span>Reward</span><b>${money(sub.reward||t.reward||0)}</b></div><div class="row"><span>Submitted</span><b>${esc(sub.date||'')}</b></div>${sub.note?`<div class="row"><span>Note</span><b>${esc(sub.note)}</b></div>`:''}${sub.status==='rejected'?`<button class="btn secondary" onclick="currentTaskId='${esc(t.id)}';renderApp()">Review & Resubmit</button>`:''}</div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
      return `<h2 class="title">Task Details</h2><p class="subtitle">Complete the task and upload a screenshot as proof.</p><div class="card task-step-card"><div class="section-head"><h2>${esc(t.app)} · ${esc(t.category)}</h2><b>${money(t.reward)}</b></div><p class="muted">${esc(t.description||'Complete this task and submit a screenshot as proof.')}</p><div class="row"><span>Slots left</span><b>${left}</b></div><div class="locked-note">✓ No WhatsApp, social-account binding, or account verification is required.</div><button class="btn ${started?'secondary':''}" onclick="startTask('${esc(t.id)}')">${started?'✓ Task Started — Open Link Again':'▶ Start Task'}</button></div><div class="card task-step-card"><h2>Upload Screenshot</h2><p class="muted">${started?'Upload a clear screenshot showing you completed the task.':'Start the task first to unlock submission.'}</p>${started?`<div class="fieldlabel">Task screenshot</div><input id="taskFile" class="input" type="file" accept="image/*"><div class="fieldlabel">Additional note <span class="muted">(optional)</span></div><textarea id="taskNote" class="textarea" maxlength="300" placeholder="Anything the admin should know..."></textarea><button class="btn green-btn" onclick="submitTask('${esc(t.id)}')">✓ Submit Screenshot</button>`:`<button class="btn secondary" disabled style="opacity:.55">Start the task first</button>`}</div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
    }
    const list=Array.isArray(cfg.tasks)?cfg.tasks:[],subs=u.taskSubmissions||[];
    return `<h2 class="title">Tasks</h2><p class="subtitle">Complete tasks and submit screenshots for admin review.</p><div class="card notice"><b>Screenshot verification</b><div class="muted" style="margin-top:4px">No WhatsApp or social-account binding is required. Your screenshot is the proof.</div></div>${list.length?list.map(t=>{const pct=Math.min(100,Math.round(Number(t.completed||0)/Math.max(1,Number(t.slots||1))*100)),sub=taskStatus(u,t.id);return `<div class="card task-list-card"><div style="display:flex;justify-content:space-between;gap:10px"><div>${platformBadge(t.app)} <b>${esc(t.app)} · ${esc(t.category)}</b></div>${sub?`<span class="pill ${esc(sub.status||'pending')}">${esc(String(sub.status||'pending').toUpperCase())}</span>`:''}</div><p class="muted" style="font-size:10px">${esc(t.description||'Complete this task and submit a screenshot as proof.')}</p><div style="display:flex;justify-content:space-between"><b>${money(t.reward)}</b><small>${Number(t.completed||0)} / ${Number(t.slots||0)} slots</small></div><div class="progress"><i style="width:${pct}%"></i></div><button class="btn" onclick="openTaskDetail('${esc(t.id)}')">View Task ${PIcon('arrow',14)}</button></div>`}).join(''):'<div class="card empty">No tasks are available right now.</div>'}<div class="card"><div class="section-head"><h2>My Submissions</h2><span class="pill">${subs.length}</span></div>${subs.length?subs.slice(0,8).map(s=>`<div class="row"><div><b>${esc(s.app)} · ${esc(s.category)}</b><div class="muted" style="font-size:9px">${esc(s.date||'')}</div></div><span class="pill ${esc(s.status||'pending')}">${esc(String(s.status||'pending').toUpperCase())}</span></div>`).join(''):'<div class="empty">No task submissions yet.</div>'}</div>`;
  };

  window.startTask=async function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id));if(!t)return toast('Task not found');const u=me();if(!u)return renderAuth('login');
    const previous=taskStatus(u,id);if(previous&&previous.status!=='rejected')return toast('This task is already '+previous.status);
    u.taskStarted=u.taskStarted||{};u.taskStarted[t.id]=now();await persistUser(u);
    if(t.link){try{window.open(t.link,'_blank','noopener,noreferrer')}catch(e){window.location.href=t.link}}
    currentTaskId=t.id;currentTab='tasks';renderApp();toast('Task started. Complete it, then upload your screenshot.');
  };

  window.submitTask=async function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id));if(!t)return toast('Task not found');const u=me();if(!u)return renderAuth('login');
    u.taskStarted=u.taskStarted||{};if(!u.taskStarted[t.id])return toast('Click Start Task first');const old=taskStatus(u,id);if(old&&old.status!=='rejected')return toast('This task is already '+old.status);
    
    const sub={id:'sub_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),fileName:file.name,note:String(document.getElementById('taskNote')?.value||'').trim(),status:'pending',date:now(),startedDate:u.taskStarted[t.id],proof:'stored',proof_path:''};
    try{
      if(!window.PalazoCloud?.ready)throw new Error('Cloud not ready');
      sub.proof_path=await uploadTaskProof(u.id,sub.id,file);
      u.taskSubmissions=u.taskSubmissions||[];if(old&&old.status==='rejected')u.taskSubmissions=u.taskSubmissions.filter(x=>String(x.id)!==String(old.id));u.taskSubmissions.unshift(sub);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Submission',amount:0,balance:'Task Balance',status:'pending',date:now(),taskId:t.id});addNotification(u,'Task submitted','Your '+t.category+' screenshot is pending admin review.','pending');await persistUser(u);closeModal();toast('Screenshot submitted — waiting for admin review');renderApp();
    }catch(e){console.error(e);toast('Could not upload screenshot. Please try again. Check your connection and try again.');}
  };

  window.viewProof=async function(username,id){
    const u=users.find(x=>x.username===username),sub=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!sub)return toast('Submission not found');if(!sub.proof_path)return toast('Screenshot unavailable');
    try{const url=await getTaskProofUrl(sub.proof_path);if(!url)return toast('Screenshot unavailable');openModal(`<div class="modal-head"><div><div class="section">Task Proof</div><h2 style="margin:0">Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${url}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px;border:1px solid #e5eaf2" alt="Task screenshot">`);}catch(e){console.error(e);toast('Could not open screenshot');}
  };

  window.approveTask=async function(username,id){
    const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id),t=cfg.tasks.find(x=>String(x.id)===String(s?.taskId));if(!u||!s||s.status!=='pending')return toast('This submission is no longer pending');if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast('This task has no slots left');
    if(s.proof_path){try{await deleteTaskProof(s.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Approval was not completed.');}}
    const reward=Number(s.reward||0);s.status='approved';s.approvedDate=now();delete s.proof_path;delete s.proof;u.earning=Number(u.earning||0)+reward;u.transactions=u.transactions||[];if(!updateRequestTransaction(u,s.id,'approved',reward,'Task Approved'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Approved',amount:reward,balance:'Task Balance',status:'approved',date:now()});addNotification(u,'Task Approved','Your '+s.category+' task was approved and '+money(reward)+' was added to Task Balance.','approved');if(t)t.completed=Number(t.completed||0)+1;
    if(u.referrerUsername&&!u.referralTaskRewarded){const parent=users.find(x=>x.username===u.referrerUsername);if(parent){const bonus=Number(cfg.referralReward||40);parent.affiliate=Number(parent.affiliate||0)+bonus;parent.transactions=parent.transactions||[];parent.transactions.unshift({id:'tx_'+Date.now(),type:'Referral task reward',amount:bonus,balance:'Affiliate Balance',status:'approved',date:now(),from:u.username});addNotification(parent,'Referral Reward','You received '+money(bonus)+' for your downline’s first approved task.','approved');u.referralTaskRewarded=true;}}
    await persistUser(u);save('palazo_config',cfg);toast('Task approved — screenshot deleted from Supabase Storage');adminPanel();
  };

  window.rejectTask=async function(username,id){
    const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!u||!s||s.status!=='pending')return toast('This submission is no longer pending');
    if(s.proof_path){try{await deleteTaskProof(s.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Rejection was not completed.');}}
    s.status='rejected';s.rejectedDate=now();delete s.proof_path;delete s.proof;u.transactions=u.transactions||[];if(!updateRequestTransaction(u,s.id,'rejected',0,'Task Rejected'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Rejected',amount:0,balance:'Task Balance',status:'rejected',date:now()});addNotification(u,'Task Rejected','Your '+s.category+' task submission was rejected by admin. You may review and resubmit it.','rejected');await persistUser(u);toast('Task rejected — screenshot deleted from Supabase Storage');adminPanel();
  };
})();
</script>

<script id="palazo-zapearn-final-ui-script">
(function(){
 const PZ={
  icon:(name,size=19)=>typeof PIcon==='function'?PIcon(name,size):'',
  safe:s=>typeof esc==='function'?esc(s):String(s??''),
  money:n=>typeof money==='function'?money(n):('₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2})),
  today:()=>new Date().toISOString().slice(0,10)
 };
 PZ.icon=(function(orig){return function(name,size){const aliases={mail:'info',phone:'wallet',clipboard:'tasks',megaphone:'ads',fire:'spark'};return orig(aliases[name]||name,size)}})(PZ.icon); window.PZ=PZ;
 window.pzUnread=function(u){return (u?.notifications||[]).filter(n=>!n.read).length};
 window.pzMarkNotificationsRead=function(){const u=me();if(!u)return;(u.notifications||[]).forEach(n=>n.read=true);persistUser(u);renderApp();};
 window.pzOpenDrawer=function(){let b=document.getElementById('pzDrawerBackdrop');if(!b){b=document.createElement('div');b.id='pzDrawerBackdrop';b.className='drawer-backdrop';document.body.appendChild(b);b.onclick=pzCloseDrawer}b.classList.add('open');document.getElementById('pzDrawer')?.classList.add('open');document.body.style.overflow='hidden'};
 window.pzCloseDrawer=function(){document.getElementById('pzDrawerBackdrop')?.classList.remove('open');document.getElementById('pzDrawer')?.classList.remove('open');document.body.style.overflow=''};
 window.pzMenuGo=function(id){pzCloseDrawer();if(id==='spin'){return pzSpinModal()}if(id==='streak'){return go('home')}if(id==='campaigns'){return showMyAds()}if(id==='history'){return showHistory()}if(id==='bank'){return addBankModal()}if(id==='place'){return placeAds()}if(id==='logout'){return logout()}go(id)};
 window.pzSpinModal=function(){openModal('<div class="modal-head"><div><div class="section">Rewards</div><h2 style="margin:0">Spin & Win</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="card" style="text-align:center;background:#F7FAFC!important;box-shadow:none!important"><div style="width:110px;height:110px;border-radius:50%;margin:5px auto 14px;background:conic-gradient(var(--pz-gold) 0 25%,var(--pz-green) 25% 50%,var(--pz-navy) 50% 75%,#DCE8F0 75%);display:grid;place-items:center"><div style="width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--pz-navy);font-weight:1000">PZ</div></div><h3 style="margin:0;color:var(--pz-navy)">Daily Spin</h3><p class="muted">Spin feature is ready for your existing reward logic.</p><button class="btn gold-btn" onclick="toast(\'Spin reward is not configured yet\')">Spin Now</button></div>')};
 window.airtimeNetwork=window.airtimeNetwork||'MTN';
 window.airtimePage=function(u){
  const bal=Number(u.earning||0), min=Number(cfg.airtimeMin||100), max=Number(cfg.airtimeMax||5000), hist=(u.airtimeConversions||[]).slice(0,8);
  const networks=['MTN','Airtel','Glo','9mobile'];
  return `<h2 class="title">Airtime Conversion</h2><p class="subtitle">Convert eligible Task Balance to airtime on your selected network.</p>
   <div class="card hero"><div class="label">AVAILABLE BALANCE</div><div class="balance-big">${bval2(bal)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">Min ${PZ.money(min)}</span><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">Max ${PZ.money(max)}</span><span class="pill" style="background:rgba(255,255,255,.14);color:#fff">${PZ.safe(cfg.airtimeOpeningTime||'Available 24/7')}</span></div></div>
   <div class="card"><div class="section-head"><h2>Choose Network</h2></div><div class="airtime-network-grid">${networks.map(n=>`<button class="airtime-network ${airtimeNetwork===n?'active':''}" onclick="airtimeNetwork='${n}';renderApp()"><span>${n==='9mobile'?'9M':n.slice(0,2)}</span>${n}</button>`).join('')}</div>
    <div class="fieldlabel" style="margin-top:15px">Phone Number</div><input id="airPhone" class="input" inputmode="numeric" maxlength="11" placeholder="08012345678">
    <div class="fieldlabel">Amount</div><input id="airAmount" class="input" type="number" inputmode="decimal" min="${min}" max="${max}" placeholder="${min}">
    <div class="notice" style="margin:4px 0 12px"><b>Selected:</b> ${airtimeNetwork} · Minimum ${PZ.money(min)} · Maximum ${PZ.money(max)}</div>
    <button class="btn" onclick="confirmAirtimeConversion()">Continue ${PZ.icon('arrow',14)}</button>
   </div>
   <div class="card"><div class="section-head"><h2>Conversion History</h2><span class="pill">${hist.length}</span></div>${hist.length?hist.map(x=>`<div class="row"><div><b>${PZ.safe(x.network)} · ${PZ.safe(x.phone)}</b><div class="muted" style="font-size:9px">${PZ.safe(x.date||'')}</div></div><div style="text-align:right"><b style="color:var(--pz-green)">${PZ.money(x.amount)}</b><div><span class="pill ${PZ.safe(x.status||'pending')}">${PZ.safe(String(x.status||'pending').toUpperCase())}</span></div></div></div>`).join(''):'<div class="pz-empty"><div class="empty-icon">'+PZ.icon('phone',20)+'</div><b>No airtime conversions yet</b><div style="font-size:10px;margin-top:4px">Your completed and pending conversions will appear here.</div></div>'}</div>`;
 };
 window.confirmAirtimeConversion=function(){
  const u=me(),phone=String(document.getElementById('airPhone')?.value||'').replace(/\s+/g,''),amount=Number(document.getElementById('airAmount')?.value||0),min=Number(cfg.airtimeMin||100),max=Number(cfg.airtimeMax||5000);
  if(!/^0\d{10}$/.test(phone))return toast('Enter a valid 11-digit Nigerian phone number');
  if(!Number.isFinite(amount)||amount<min)return toast('Amount is below the minimum conversion amount');
  if(amount>max)return toast('Amount is above the maximum conversion amount');
  if(amount>Number(u.earning||0))return toast('Insufficient Task Balance');
  const network=airtimeNetwork||'MTN';
  openModal(`<div class="modal-head"><div><div class="section">Confirm conversion</div><h2 style="margin:0">${network} Airtime</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="card" style="background:#F7FAFC!important;box-shadow:none!important"><div class="row"><span>Network</span><b>${PZ.safe(network)}</b></div><div class="row"><span>Phone</span><b>${PZ.safe(phone)}</b></div><div class="row"><span>Amount</span><b style="color:var(--pz-green)">${PZ.money(amount)}</b></div></div><button class="btn" onclick="submitAirtimeConversion('${PZ.safe(network)}','${PZ.safe(phone)}',${amount})">Confirm & Submit</button><button class="btn secondary" style="margin-top:8px" onclick="closeModal()">Cancel</button>`);
 };
 window.submitAirtimeConversion=function(network,phone,amount){
  const u=me();if(!u)return;amount=Number(amount);if(amount>Number(u.earning||0))return closeModal(),toast('Insufficient Task Balance');
  u.earning=Number(u.earning||0)-amount;u.airtimeConversions=u.airtimeConversions||[];const id='air_'+Date.now();u.airtimeConversions.unshift({id,network,phone,amount,status:'pending',date:typeof now==='function'?now():new Date().toLocaleString('en-NG')});u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:id,type:'Airtime Conversion',amount:-amount,balance:'Task Balance',status:'pending',date:typeof now==='function'?now():new Date().toLocaleString('en-NG'),network,phone});if(typeof addNotification==='function')addNotification(u,'Airtime conversion submitted',PZ.money(amount)+' '+network+' airtime request is pending processing.','pending');persistUser(u);closeModal();go('airtime');toast('Airtime conversion submitted');
 };
 window.header=function(){const u=me(),un=pzUnread(u);const avatar=u?.avatar?`<img src="${PZ.safe(u.avatar)}" alt="Profile">`:`<span>P</span>`;return `<header class="topbar"><div class="brand logo-tap" onclick="tapAdmin()"><div class="brand-logo top-profile-logo">${avatar}</div><div><b>Palazo Cash</b><small>${screenTitle(currentTab)} · @${PZ.safe(u.username)}</small></div></div><div class="top-actions"><button class="circle notify" aria-label="Notifications" onclick="go('notifications');setTimeout(pzMarkNotificationsRead,100)">${PZ.icon('bell',18)}${un?`<span style="position:absolute;right:-2px;top:-2px;min-width:19px;height:19px;border-radius:99px;background:#E5484F;color:#fff;font-size:9px;font-weight:950;display:grid;place-items:center;border:2px solid #fff">${un>9?'9+':un}</span>`:''}</button><button class="circle" aria-label="Open menu" onclick="pzOpenDrawer()">${PZ.icon('menu',19)}</button></div></header>`};
  window.bottom=function(){const items=[['home','home','Home'],['tasks','tasks','Tasks'],['assets','wallet','Assets'],['refer','users','Refer'],['menu','menu','Menu']];return `<div class="bottom"><nav class="nav" aria-label="Primary navigation">${items.map(([id,ic,t])=>id==='assets'?`<button class="nav-btn assets-nav ${currentTab===id?'active':''}" onclick="go('assets')"><span class="asset-fab">${PZ.icon(ic,25)}</span><span>Assets</span></button>`:id==='menu'?`<button class="nav-btn" onclick="pzOpenDrawer()">${PZ.icon(ic,21)}<span>Menu</span></button>`:`<button class="nav-btn ${currentTab===id?'active':''}" onclick="go('${id}')">${PZ.icon(ic,21)}<span>${t}</span>${currentTab===id?'<i class="nav-dot"></i>':''}</button>`).join('')}</nav></div>`};
  window.openMenu=function(){pzOpenDrawer()};
 window.go=function(t){currentTab=t;renderApp();window.scrollTo({top:0,behavior:'smooth'});if(t==='home')setTimeout(showCommunityPopup,120)};
 window.pzDrawerHTML=function(){const u=me();const items=[['home','home','Dashboard'],['tasks','tasks','Tasks'],['watch','play','Watch Ads'],['refer','users','Referral'],['assets','wallet','Assets'],['wallet','wallet','Wallet'],['deposit','deposit','Deposit'],['withdraw','withdraw','Withdrawal'],['place','ads','Place Ads'],['campaigns','megaphone','My Campaigns'],['leaderboard','trophy','Leaderboard'],['history','history','Transactions'],['notifications','bell','Notifications'],['profile','user','Profile'],['bank','bank','Bank Account'],['airtime','phone','Airtime Conversion'],['spin','spark','Spin & Win']];return `<div id="pzDrawer" class="pz-drawer"><div class="pz-drawer-head"><div class="pz-brand"><div class="pz-brand-mark">${u?.avatar?`<img src="${PZ.safe(u.avatar)}" alt="Profile">`:'P'}</div><div><b>Palazo Cash</b><small>@${PZ.safe(u.username)}</small></div></div><button class="pz-drawer-close" data-no-loader="true" onclick="pzCloseDrawer()">×</button></div><div class="pz-menu"><div class="pz-menu-section">All Features</div>${items.map(([id,ic,label])=>`<button type="button" class="pz-menu-btn ${currentTab===id?'active':''}" data-no-loader="true" onclick="pzMenuGo('${id}')">${PZ.icon(ic,18)}<span>${label}</span></button>`).join('')}<button type="button" class="pz-menu-btn logout" data-no-loader="true" onclick="pzMenuGo('logout')">${PZ.icon('logout',18)}<span>Log out</span></button></div></div>`};
  const oldRenderApp=window.renderApp;
 window.renderApp=function(){const u=me();if(!u)return renderAuth('login');let body='';if(currentTab==='home')body=home(u);if(currentTab==='tasks')body=tasksPage(u);if(currentTab==='watch')body=watchPage(u);if(currentTab==='assets')body=assetsPage(u);if(currentTab==='refer')body=referPage(u);if(currentTab==='leaderboard')body=leaderboardPage(u);if(currentTab==='notifications')body=notificationsPage(u);if(currentTab==='profile')body=profilePage(u);if(currentTab==='deposit')body=depositPage(u);if(currentTab==='withdraw')body=withdrawalPage(u);if(currentTab==='airtime')body=airtimePage(u);if(!body&&currentTab==='menu')body=home(u);document.getElementById('app').innerHTML=header()+`<main>${body}</main>`+bottom()+pzDrawerHTML()+(document.getElementById('pzDrawerBackdrop')?'':'');};
 window.renderAuth=function(mode){const ref=typeof referralCodeFromUrl==='function'?referralCodeFromUrl():'';document.getElementById('app').innerHTML=`<div class="pz-auth"><div class="pz-auth-card"><div class="pz-auth-brand"><div class="pz-auth-mark">P</div><span class="pz-badge">SECURE • REWARDS PLATFORM</span><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p>${mode==='login'?'Sign in to continue to Palazo Cash':'Register free, then continue to login.'}</p></div>${mode==='login'?`<form id="loginForm" onsubmit="event.preventDefault();login()"><div class="fieldlabel">Username or Email</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('user',18)}</span><input id="loginUser" class="input" autocomplete="username" placeholder="Enter username or email" required></div><div class="fieldlabel">Password</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('shield',18)}</span><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="button" class="pz-password-toggle" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'">${PZ.icon('eye',17)}</button></div><button type="submit" id="loginBtn" class="btn">Login ${PZ.icon('arrow',14)}</button></form><div class="pz-auth-foot">New to Palazo Cash? <b onclick="renderAuth('register')">Create an account</b></div>`:`<form id="registerForm" onsubmit="event.preventDefault();register()"><div class="fieldlabel">Username</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('user',18)}</span><input id="regUser" class="input" autocomplete="username" placeholder="Choose a username" required></div><div class="fieldlabel">Email Address</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('mail',18)}</span><input id="regEmail" class="input" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="fieldlabel">Phone Number</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('phone',18)}</span><input id="regPhone" class="input" inputmode="tel" autocomplete="tel" placeholder="08012345678" required></div><div class="fieldlabel">Password</div><div class="pz-field"><span class="pz-field-icon">${PZ.icon('shield',18)}</span><input id="regPass" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><button type="button" class="pz-password-toggle" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'">${PZ.icon('eye',17)}</button></div><div class="fieldlabel">Invitation Code <span class="muted">(Optional)</span></div><input id="regRef" class="input" value="${PZ.safe(ref)}" placeholder="Enter invitation code" ${ref?'readonly':''}><button type="submit" class="btn">Create Account ${PZ.icon('arrow',14)}</button></form><div class="pz-auth-foot">Already registered? <b onclick="renderAuth('login')">Login</b></div>`}</div></div>`};
 const oldProfile=window.profilePage;

.pz-profile-photo-wrap .profile-avatar{width:96px!important;height:96px!important;border-radius:50%!important;overflow:hidden!important;display:grid!important;place-items:center!important;font-size:32px!important}
.pz-profile-photo-wrap .profile-avatar img{width:100%!important;height:100%!important;object-fit:cover!important;border-radius:50%!important;display:block!important}
.pz-deposit-shell{padding-bottom:8px}
.pz-deposit-tabs{display:grid;grid-template-columns:1fr 1fr;background:#dfe8f1;border-radius:16px;padding:4px;margin-bottom:14px}
.pz-deposit-tabs button{border:0;background:transparent;border-radius:13px;padding:11px 8px;font-weight:700;color:#718097;font-size:12px}
.pz-deposit-tabs button.active{background:#fff;color:#162338;box-shadow:0 2px 8px rgba(11,42,74,.08)}
.pz-recharge-card{background:#202020!important;color:#fff;border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.pz-recharge-card .label{color:#a9adb5!important;font-size:10px!important;letter-spacing:.6px}
.pz-recharge-card .balance{font-size:31px;font-weight:950;color:#f5c518;margin-top:7px}
.pz-recharge-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pz-record-btn{border:1px solid rgba(255,255,255,.15);background:#3a3a3a;color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;font-size:11px}
.pz-recharge-form{background:#fff;border:1px solid #edf0f4;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(11,42,74,.04)}
.pz-recharge-form h3{margin:0 0 12px;font-size:15px}
.pz-amount-input{display:flex;align-items:center;border:2px solid #e7ebf0;border-radius:14px;height:58px;padding:0 14px;gap:9px;margin-bottom:12px}
.pz-amount-input b{font-size:18px}.pz-amount-input input{border:0;outline:0;width:100%;font-size:16px;background:transparent}
.pz-preset-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
.pz-preset-grid button{border:1px solid #e3e8ee;background:#f8fafc;border-radius:14px;padding:14px 5px;font-size:12px;font-weight:750;color:#26364a}
.pz-preset-grid button.active{border-color:#f5c518;background:#fff9df}
.pz-generate{margin-top:14px!important;background:#f5c518!important;color:#111!important;font-weight:850!important}
.pz-instructions{background:#fff;border:1px solid #edf0f4;border-radius:22px;padding:18px;box-shadow:0 5px 18px rgba(11,42,74,.04)}
.pz-instructions h3{margin:0 0 10px;font-size:15px}.pz-instructions ol{margin:0;padding-left:22px;color:#728197}.pz-instructions li{margin:8px 0;font-size:12px;line-height:1.45}
.pz-pay-details{background:#f8fafc;border:1px solid #e4eaf0;border-radius:18px;padding:4px 14px}.pz-pay-details .row{padding:12px 0;border-bottom:1px solid #e8edf2}.pz-pay-details .row:last-child{border-bottom:0}
.pz-package-note{font-size:10px!important;color:#728197;margin:0 0 12px}
</style>
<script>
(function(){
  const escSafe=(v)=>typeof esc2==='function'?esc2(v):(typeof esc==='function'?esc(v):String(v??''));
  const moneySafe=(v)=>typeof money2==='function'?money2(v):(typeof money==='function'?money(v):'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2}));
  const cloudBucket='task-proofs';

  /* Profile photo: keep the image in the user profile data so cloudSaveUser syncs it to profiles.data. */
  window.quickProfilePhoto=async function(input){
    const file=input?.files?.[0]; if(!file)return;
    if(!file.type.startsWith('image/'))return toast('Please choose an image');
    if(file.size>5*1024*1024)return toast('Profile picture must be under 5 MB');
    const reader=new FileReader();
    reader.onload=async()=>{const u=me();if(!u)return;u.avatar=reader.result;await persistUser(u);renderApp();toast('Profile picture updated');};
    reader.onerror=()=>toast('Could not read image');reader.readAsDataURL(file);
  };

  /* Header avatar follows the user's uploaded profile picture everywhere. */
  window.header=function(){
    const u=me()||{};const avatar=u.avatar?`<img src="${escSafe(u.avatar)}" alt="Profile">`:`<span>${escSafe((u.username||'P').slice(0,1).toUpperCase())}</span>`;
    return `<header class="topbar"><div class="brand logo-tap" onclick="tapAdmin()"><div class="brand-logo pz-header-avatar">${avatar}</div><div><b>Palazo Cash</b><small>${typeof screenTitle==='function'?screenTitle(currentTab):'Dashboard'} · @${escSafe(u.username)}</small></div></div><div class="top-actions"><button class="circle pz-top-avatar" aria-label="Profile" onclick="go('profile')">${avatar}</button><button class="circle notify" aria-label="Notifications" onclick="go('notifications')">${typeof PIcon==='function'?PIcon('bell',18):'🔔'}</button><button class="circle" aria-label="Logout" onclick="logout()">${typeof PIcon==='function'?PIcon('logout',18):'↪'}</button></div></header>`;
  };
  const style=document.createElement('style');style.textContent='.pz-header-avatar{width:42px!important;height:42px!important;border-radius:50%!important;overflow:hidden!important;display:grid!important;place-items:center!important;font-size:15px!important}.pz-header-avatar img{width:100%!important;height:100%!important;object-fit:cover!important;border-radius:50%!important}.pz-header-avatar span{font-weight:900}.pz-top-avatar{padding:0!important;overflow:hidden!important}.pz-top-avatar img{width:100%!important;height:100%!important;object-fit:cover!important;border-radius:50%!important}.pz-top-avatar span{font-weight:900}';document.head.appendChild(style);

  /* Deposit page matching the requested Recharge layout. */
  window.depositPage=function(u){
    const mode=window.pzDepositMode||'ads';
    const presets=[1000,3000,5000,10000,20000,50000,100000,250000,500000];
    const assetPresets=[...new Set((cfg.assetDepositPresets||[500,1000,2000,5000,10000]).map(Number).filter(n=>n>0))];
    const list=mode==='asset'?assetPresets:presets;
    const balance=mode==='asset'?Number(u.assetBalance||0):Number(u.adBalance||0);
    const label=mode==='asset'?'Asset Deposit':'Recharge';
    return `<div class="pz-deposit-shell"><h2 class="title">${label}</h2><p class="subtitle">${mode==='asset'?'Choose an investment package to fund your Income Wallet.':'Fund your Deposit Wallet through a one-time payment account.'}</p>
      <div class="pz-deposit-tabs"><button class="${mode==='ads'?'active':''}" onclick="pzSetDepositMode('ads')">Recharge</button><button class="${mode==='asset'?'active':''}" onclick="pzSetDepositMode('asset')">Asset Deposit</button></div>
      <div class="pz-recharge-card"><div class="pz-recharge-top"><div><div class="label">${mode==='asset'?'ASSET BALANCE':'RECHARGE BALANCE'}</div><div class="balance">${moneySafe(balance)}</div></div><button class="pz-record-btn" onclick="showHistory()">Recharge Records</button></div></div>
      <div class="pz-recharge-form"><h3>${mode==='asset'?'Asset Deposit Amount':'Recharge Amount'}</h3><div class="pz-amount-input"><b>₦</b><input id="pzDepositAmount" type="number" inputmode="decimal" min="${mode==='asset'?Math.min(...list):1000}" placeholder="Enter recharge amount"></div>
      <div class="pz-preset-grid">${list.map(n=>`<button type="button" onclick="pzPickDeposit(${n},this)">${moneySafe(n)}</button>`).join('')}</div>
      <button class="btn pz-generate" onclick="pzGenerateDeposit('${mode}')">Get Payment Account</button></div>
      <div class="pz-instructions"><h3>${mode==='asset'?'Asset Deposit Instructions':'Recharge Instructions'}</h3><ol><li>Enter an amount and tap <b>Get Payment Account</b> to generate a one-time bank account.</li><li>Transfer the exact amount from your bank app.</li><li>Your ${mode==='asset'?'asset':'deposit'} wallet is credited automatically after admin approval — even if you close this page.</li></ol></div></div>`;
  };
  window.pzSetDepositMode=function(mode){window.pzDepositMode=mode;renderApp()};
  window.pzPickDeposit=function(n,btn){const el=document.getElementById('pzDepositAmount');if(el)el.value=n;document.querySelectorAll('.pz-preset-grid button').forEach(b=>b.classList.remove('active'));btn?.classList.add('active')};
  window.pzGenerateDeposit=function(kind){const n=Number(document.getElementById('pzDepositAmount')?.value||0);if(n<=0)return toast('Enter a deposit amount');if(kind==='asset'){const allowed=(cfg.assetDepositPresets||[]).map(Number);if(allowed.length&&!allowed.includes(n))return toast('Choose one of the available Asset packages');assetPaymentDetails(n);return;}if(n<1000)return toast('Minimum recharge is ₦1,000');paymentDetails(n,'ads');};

  /* Asset withdrawal: only Income/Asset Wallet is gated. Other wallets remain withdrawable. */
  window.withdrawalPage=function(u){
    const type=selectedWithdrawWallet||'affiliate';
    const data={task:{label:'Task Wallet',field:'earning',min:Number(cfg.taskMinWithdrawal||500),open:cfg.taskWithdrawalOpen},asset:{label:'Income Wallet',field:'assetBalance',min:Number(cfg.assetMinWithdrawal||500),open:cfg.assetWithdrawalOpen},affiliate:{label:'Affiliate Wallet',field:'affiliate',min:Number(cfg.affiliateMinWithdrawal||500),open:cfg.affiliateWithdrawalOpen}}[type]||null;
    const active=(u.investments||[]).filter(x=>x.status==='active').length;
    if(type==='asset'&&active<1){return `<div class="pz-withdraw-screen"><h2 class="title">Withdrawal</h2><p class="subtitle">Choose a wallet to withdraw from.</p><div class="withdraw-grid"><button class="withdraw-card" onclick="selectWithdrawWallet('task')"><h3>Task Wallet</h3><b>${moneySafe(u.earning)}</b><small>Available for withdrawal</small></button><button class="withdraw-card selected" onclick="selectWithdrawWallet('asset')"><h3>Income Wallet</h3><b>${moneySafe(u.assetBalance)}</b><small>🔒 Product required</small></button><button class="withdraw-card" onclick="selectWithdrawWallet('affiliate')"><h3>Affiliate Wallet</h3><b>${moneySafe(u.affiliate)}</b><small>Available for withdrawal</small></button></div><div class="pz-gate"><div style="font-size:38px">🔒</div><h2>Purchase a Product First</h2><p class="muted" style="font-size:11px;line-height:1.6">Only Income Wallet withdrawal is locked. Purchase at least one investment product to unlock your Asset balance withdrawal.</p><button class="btn" onclick="go('assets')">Purchase Product</button></div></div>`}
    const bal=Number(u[data.field]||0);
    return `<div class="pz-withdraw-screen"><h2 class="title">Withdrawal</h2><p class="subtitle">Withdraw your available balance to your bank account.</p><div class="withdraw-grid"><button class="withdraw-card ${type==='task'?'selected':''}" onclick="selectWithdrawWallet('task')"><h3>Task Wallet</h3><b>${moneySafe(u.earning)}</b><small>Task earnings</small></button><button class="withdraw-card ${type==='asset'?'selected':''}" onclick="selectWithdrawWallet('asset')"><h3>Income Wallet</h3><b>${moneySafe(u.assetBalance)}</b><small>${active?'Asset income':'🔒 Product required'}</small></button><button class="withdraw-card ${type==='affiliate'?'selected':''}" onclick="selectWithdrawWallet('affiliate')"><h3>Affiliate Wallet</h3><b>${moneySafe(u.affiliate)}</b><small>Referral earnings</small></button></div><div class="pz-withdraw-card"><h3>${data.label}</h3><div class="balance">${moneySafe(bal)}</div><div class="muted" style="font-size:10px">Minimum withdrawal: ${moneySafe(data.min)}</div></div><div class="pz-withdraw-card"><h3>Withdrawal Amount</h3><div class="pz-withdraw-input"><span>₦</span><input id="wdAmount" type="number" min="0" max="${bal}" placeholder="Enter amount" oninput="updateWithdrawalAmount(${bal},${data.min})"></div><div class="withdraw-amount-hint">Available: ${moneySafe(bal)} · Minimum: ${moneySafe(data.min)}</div><div class="section" style="margin-top:16px">Bank Account</div>${u.bank?`<div class="pz-bank-box"><div><b>${escSafe(u.bank.bank)}</b><div class="muted" style="font-size:10px">${escSafe(u.bank.account)} · ${escSafe(u.bank.name)}</div></div><button class="change" onclick="addBankModal()">Change</button></div>`:`<div class="pz-bank-box"><div><b>No bank account added</b><div class="muted" style="font-size:10px">Add your bank details before requesting withdrawal.</div></div><button class="change" onclick="addBankModal()">Add</button></div>`}<div class="withdraw-summary" style="margin-top:14px"><div class="section">Withdrawal Summary</div><div class="row"><span>Wallet</span><b>${data.label}</b></div><div class="row"><span>Available</span><b>${moneySafe(bal)}</b></div><div class="row"><span>Amount</span><b id="wdSummaryAmount">₦0.00</b></div></div><button id="wdSubmitBtn" class="btn pz-yellow-btn" style="margin-top:14px" onclick="submitWithdrawalType('${type}')" ${data.open?'':'disabled'}>Request Withdrawal</button></div></div>`;
  };

  /* Deposit/asset proof uploads use Supabase Storage; only proof_path is stored in profile data. */
  async function uploadPaymentProof(userId,id,file){
    const path=String(userId)+'/deposits/'+String(id)+'.jpg';
    const blob=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('compression failed')),'image/jpeg',.76)};img.onerror=()=>reject(new Error('invalid image'));img.src=r.result};r.onerror=()=>reject(r.error||new Error('read failed'));r.readAsDataURL(file)});
    if(!window.PalazoCloud?.ready)throw new Error('Cloud not ready');
    const {error}=await window.PalazoCloud.sb.storage.from(cloudBucket).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});if(error)throw error;return path;
  }
  async function deletePaymentProof(path){if(!path)return true;const {error}=await window.PalazoCloud.sb.storage.from(cloudBucket).remove([path]);if(error)throw error;return true}
  async function getPaymentProofUrl(path){if(!path)return null;const {data,error}=await window.PalazoCloud.sb.storage.from(cloudBucket).createSignedUrl(path,300);if(error)throw error;return data?.signedUrl||null}

  window.submitDeposit=async function(n,code,kind='ads'){
    const name=document.getElementById('depName')?.value.trim(),file=document.getElementById('depFile')?.files?.[0];if(!name||!file)return toast('Enter account name and upload screenshot');
    const u=me(),d={id:'dep_'+Date.now(),amount:Number(n),accountName:name,narration:code,kind,fileName:file.name,status:'pending',date:now(),proof:'stored',proof_path:''};
    try{d.proof_path=await uploadPaymentProof(u.id,d.id,file);u.deposits=u.deposits||[];u.deposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:kind==='ads'?'Ads Deposit':'Deposit Request',amount:Number(n),balance:kind==='ads'?'Ads Balance':'Deposit Balance',status:'pending',date:now()});addNotification(u,kind==='ads'?'Ads Deposit submitted':'Deposit submitted','Your '+moneySafe(n)+' deposit is pending admin review.','pending');await persistUser(u);closeModal();go('deposit');toast('Screenshot submitted for admin review')}catch(e){console.error(e);toast('Could not upload screenshot. Please try again.')}
  };
  window.submitAssetDeposit=async function(n){
    const name=document.getElementById('assetDepName')?.value.trim(),file=document.getElementById('assetDepFile')?.files?.[0];if(!name||!file)return toast('Enter deposit name and screenshot');
    const u=me(),d={id:'adep_'+Date.now(),amount:Number(n),accountName:name,fileName:file.name,status:'pending',date:now(),proof:'stored',proof_path:''};
    try{d.proof_path=await uploadPaymentProof(u.id,d.id,file);u.assetDeposits=u.assetDeposits||[];u.assetDeposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:'Asset Deposit',amount:Number(n),balance:'Asset Balance',status:'pending',date:now()});addNotification(u,'Asset Deposit submitted','Your '+moneySafe(n)+' Asset Deposit is pending admin review.','pending');await persistUser(u);closeModal();go('deposit');toast('Screenshot submitted for admin review')}catch(e){console.error(e);toast('Could not upload screenshot. Please try again.')}
  };

  window.viewDepositProof=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!d)return toast('Deposit not found');if(!d.proof_path)return toast('Screenshot unavailable');try{const url=await getPaymentProofUrl(d.proof_path);if(!url)return toast('Screenshot unavailable');openModal(`<div class="modal-head"><div><div class="section">Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${url}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px" alt="Deposit screenshot">`)}catch(e){toast('Could not open screenshot')}};
  window.viewAssetDepositProof=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!d)return toast('Asset deposit not found');if(!d.proof_path)return toast('Screenshot unavailable');try{const url=await getPaymentProofUrl(d.proof_path);if(!url)return toast('Screenshot unavailable');openModal(`<div class="modal-head"><div><div class="section">Asset Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${url}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px" alt="Asset deposit screenshot">`)}catch(e){toast('Could not open screenshot')}};

  /* Delete deposit proof immediately after admin approval/rejection. */
  const oldApproveDeposit=window.approveDeposit,oldRejectDeposit=window.rejectDeposit,oldApproveAsset=window.approveAssetDeposit,oldRejectAsset=window.rejectAssetDeposit;
  window.approveDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');if(d.proof_path){try{await deletePaymentProof(d.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Approval was not completed.')}};d.status='approved';d.approvedDate=now();delete d.proof_path;delete d.proof;const amount=Number(d.amount||0),kind=d.kind||'ads';if(kind==='ads')u.adBalance=Number(u.adBalance||0)+amount;else u.deposit=Number(u.deposit||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',moneySafe(amount)+' was added to '+(kind==='ads'?'Ads Balance':'Deposit Balance')+'.','approved');save('palazo_users',users);toast('Deposit approved — screenshot deleted');adminPanel()};
  window.rejectDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');if(d.proof_path){try{await deletePaymentProof(d.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Rejection was not completed.')}};d.status='rejected';d.rejectedDate=now();delete d.proof_path;delete d.proof;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+moneySafe(d.amount||0)+' deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Deposit rejected — screenshot deleted');adminPanel()};
  window.approveAssetDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');if(d.proof_path){try{await deletePaymentProof(d.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Approval was not completed.')}};d.status='approved';d.approvedDate=now();delete d.proof_path;delete d.proof;const amount=Number(d.amount||0);u.assetBalance=Number(u.assetBalance||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,'Asset Deposit Approved');addNotification(u,'Asset Deposit Approved',moneySafe(amount)+' was added to Asset Balance.','approved');save('palazo_users',users);toast('Asset deposit approved — screenshot deleted');adminPanel()};
  window.rejectAssetDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');if(d.proof_path){try{await deletePaymentProof(d.proof_path)}catch(e){console.error(e);return toast('Could not delete screenshot. Rejection was not completed.')}};d.status='rejected';d.rejectedDate=now();delete d.proof_path;delete d.proof;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,'Asset Deposit Rejected');addNotification(u,'Asset Deposit Rejected','Your '+moneySafe(d.amount||0)+' Asset Deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Asset deposit rejected — screenshot deleted');adminPanel()};

  /* Stop old floating auth icon styling even if earlier CSS is still present. */
  const authStyle=document.createElement('style');authStyle.textContent='.pz-field-icon,.pz-password-toggle{animation:none!important;transform:none!important}.pz-auth *{animation:none!important}.pz-auth .announce-icon{animation:none!important}';document.head.appendChild(authStyle);

  /* Keep the final render using the newest header/profile/deposit/withdrawal functions. */
  const baseRender=window.renderApp;window.renderApp=function(){return baseRender.apply(this,arguments)};
})();
</script>

<style id="palazo-round3-polish">

.pz-auth .pz-field-icon{position:absolute!important;left:13px!important;top:50%!important;transform:translateY(-50%)!important;animation:none!important;z-index:3!important;display:grid!important;place-items:center!important;width:20px!important;height:20px!important;pointer-events:none!important}
.pz-auth .pz-password-toggle{position:absolute!important;right:7px!important;top:50%!important;transform:translateY(-50%)!important;animation:none!important;z-index:4!important;display:grid!important;place-items:center!important}
.pz-auth .input{min-height:50px!important;padding-top:13px!important;padding-bottom:13px!important}
/* Green community popup */
.community-popup .cp-brand{background:linear-gradient(135deg,#0b8f4d,#19c56a)!important;box-shadow:0 10px 24px rgba(18,161,80,.22)!important}
.community-popup .cp-link.primary{background:#12a150!important;border-color:#12a150!important}
.community-popup .cp-arrow{background:#e8f8ef!important;color:#11824b!important}
.community-popup .cp-link.primary .cp-arrow{background:rgba(255,255,255,.18)!important;color:#fff!important}
/* Larger true-circle Assets button */
.nav-btn.assets-nav .asset-fab{width:62px!important;height:62px!important;min-width:62px!important;min-height:62px!important;border-radius:50%!important;aspect-ratio:1/1!important;padding:0!important;overflow:hidden!important}
.nav-btn.assets-nav .asset-fab svg{width:25px!important;height:25px!important}
/* More colorful but clean withdrawal cards */
.pz-withdraw-screen{max-width:760px!important;margin:0 auto!important}
.withdraw-grid{gap:11px!important}
.withdraw-card{min-height:112px!important;border-radius:20px!important;padding:15px!important;background:linear-gradient(145deg,#fff,#f8fbff)!important;border:1px solid #dfe8f2!important;box-shadow:0 9px 24px rgba(11,42,74,.07)!important}
.withdraw-card h3{color:#10243d!important;font-size:13px!important}
