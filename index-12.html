<!-- Palazo Cash login fix: never leave the user stuck on "Signing in…" -->
<script id="palazo-login-fix">
(function(){
  function withTimeout(promise, ms, fallback){
    return Promise.race([
      Promise.resolve(promise),
      new Promise(function(resolve){setTimeout(function(){resolve(fallback);},ms);})
    ]);
  }

  window.login = async function(){
    const key = String(document.getElementById('loginUser')?.value || '').trim();
    const pass = String(document.getElementById('loginPass')?.value || '');
    const btn = document.getElementById('loginBtn');
    if(!key || !pass){ toast('Enter your username/email and password'); return; }
    if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }

    try{
      /* Prefer Supabase authentication when it is available. */
      if(typeof sb !== 'undefined' && sb?.auth?.signInWithPassword){
        let email = key;

        if(!key.includes('@')){
          try{
            const r = await withTimeout(sb.rpc('get_login_email',{identifier:key}),6000,null);
            if(r?.error || !r?.data){
              /* Fallback: find the email in the locally cached profile. */
              const cached = load('palazo_users',[]).find(function(u){
                return String(u.username||'').toLowerCase() === key.toLowerCase();
              });
              email = cached?.email || '';
            } else email = r.data;
          }catch(e){
            const cached = load('palazo_users',[]).find(function(u){
              return String(u.username||'').toLowerCase() === key.toLowerCase();
            });
            email = cached?.email || '';
          }
        }

        if(!email) { toast('Account not found. Check your username/email.'); return; }

        const authResult = await withTimeout(
          sb.auth.signInWithPassword({email:email,password:pass}),
          12000,
          {data:null,error:{message:'Login timed out. Please try again.'}}
        );
        if(authResult?.error) { toast(authResult.error.message || 'Incorrect login details'); return; }

        const authUser = authResult?.data?.user;
        if(!authUser) { toast('Login failed. Please try again.'); return; }

        let u = null;
        try{
          u = await withTimeout(loadCurrentProfile(),6000,null);
        }catch(e){ console.warn('Profile load failed, using auth data:',e); }

        /* If the profiles query is blocked/missing, do not trap the user on
           the loading state. Build a usable local profile from Auth metadata. */
        if(!u){
          const cachedUsers = load('palazo_users',[]).map(ensureUser);
          const meta = authUser.user_metadata || {};
          u = cachedUsers.find(function(x){
            return x.id === authUser.id ||
              String(x.email||'').toLowerCase() === String(authUser.email||email).toLowerCase() ||
              String(x.username||'').toLowerCase() === String(meta.username||'').toLowerCase();
          }) || ensureUser({
            id: authUser.id,
            username: meta.username || String(authUser.email||email).split('@')[0],
            email: authUser.email || email,
            phone: meta.phone || '',
            role: meta.role || 'user',
            banned: false
          });
          u.id = authUser.id;
          u.email = authUser.email || u.email;
          users = [u];
          session = {username:u.username,id:u.id};
          saveSession(session);
          save('palazo_users',users);
        }

        if(u.banned){
          try{await sb.auth.signOut();}catch(e){}
          session=null; saveSession(null); users=[];
          renderAuth('login');
          toast('Your account has been banned');
          return;
        }

        /* Cloud data is useful but must never block login/dashboard access. */
        try{ await withTimeout(loadCloudData(),5000,null); }catch(e){ console.warn('Cloud data load skipped:',e); }
        if(u.role==='admin'){
          try{ await withTimeout(loadAdminProfiles(),5000,null); }catch(e){ console.warn('Admin profile refresh skipped:',e); }
        }

        session = {username:u.username,id:u.id};
        saveSession(session);
        render();
        toast('Welcome back, @'+u.username);
        setTimeout(function(){ if(typeof showCommunityPopup==='function') showCommunityPopup(); },120);
        return;
      }

      /* Local-only fallback. */
      users = load('palazo_users',users).map(ensureUser);
      const u = users.find(function(x){
        return String(x.username||'').toLowerCase()===key.toLowerCase() ||
               String(x.email||'').toLowerCase()===key.toLowerCase();
      });
      if(!u) return toast('Account not found. Check your username/email.');
      if(String(u.password||'')!==pass) return toast('Incorrect password');
      if(u.banned) return toast('Your account has been banned');
      session={username:u.username,id:u.id}; saveSession(session); render();
      setTimeout(function(){ if(typeof showCommunityPopup==='function') showCommunityPopup(); },120);
    }catch(e){
      console.error('PALAZO LOGIN FIX:',e);
      toast(e?.message || 'Login failed. Please try again.');
    }finally{
      if(btn){ btn.disabled=false; btn.innerHTML='Login <span class="pz-submit-arrow">→</span>'; }
    }
  };
})();
</script>


<!-- PALAZO ADMIN ACCESS + SMOOTH ACTIONS FINAL PATCH -->
<script id="palazo-admin-final-patch">
(function(){
  'use strict';

  /* Admin is opened by 10 taps only.
     No admin email and no admin PIN/password are requested here. */
  var tapCount=0, tapTimer=null, adminBusy={};

  window.tapAdmin=function(){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer=setTimeout(function(){tapCount=0;},5000);
    if(tapCount<10)return;
    tapCount=0;
    window.adminPanel();
  };

  /* Admin role is read from profiles.role. Supabase RLS decides whether
     the current admin session can read/update all profiles. */
  window.refreshAdminProfiles=async function(){
    try{
      await loadAdminProfiles();
      if(typeof window.adminRefresh==='function') window.adminRefresh();
      else if(typeof window.adminPanel==='function') window.adminPanel();
      return true;
    }catch(e){
      console.error(e);
      if(typeof toast==='function') toast(e?.message||'Could not load all profiles.');
      return false;
    }
  };

  /* Render the existing admin UI. Supabase RLS remains the real permission
     layer, so opening the panel does not itself grant database access. */
  var baseAdminRender=function(){
    var page='overview';
    var tabs=['overview','users','tasks','deposits','asset deposits','withdrawals','ads','settings'];
    var screen=document.getElementById('adminScreen');
    if(!screen)return;
    screen.classList.add('open');
    screen.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';

    function renderAdmin(){
      var ulist=Array.isArray(window.users)?window.users:[];
      var content='';
      try{
        if(page==='overview')content=
          '<div class="stats">'+
          '<div class="stat"><small>USERS</small><b>'+ulist.length+'</b></div>'+
          '<div class="stat"><small>PENDING DEPOSITS</small><b>'+ulist.reduce(function(a,u){return a+(u.deposits||[]).filter(function(d){return d.status==="pending"}).length},0)+'</b></div>'+
          '<div class="stat"><small>PENDING ASSET DEPOSITS</small><b>'+ulist.reduce(function(a,u){return a+(u.assetDeposits||[]).filter(function(d){return d.status==="pending"}).length},0)+'</b></div>'+
          '<div class="stat"><small>PENDING WITHDRAWALS</small><b>'+ulist.reduce(function(a,u){return a+(u.withdrawals||[]).filter(function(d){return d.status==="pending"}).length},0)+'</b></div>'+
          '</div><div class="stats" style="margin-top:9px">'+
          '<div class="stat"><small>TASKS</small><b>'+((window.cfg&&Array.isArray(cfg.tasks))?cfg.tasks.length:0)+'</b></div>'+
          '<div class="stat"><small>TASK SLOTS LEFT</small><b>'+((window.cfg&&Array.isArray(cfg.tasks))?cfg.tasks.reduce(function(a,t){return a+Math.max(0,Number(t.slots||0)-Number(t.completed||0))},0):0)+'</b></div>'+
          '<div class="stat"><small>PENDING AD ORDERS</small><b>'+ulist.reduce(function(a,u){return a+(u.adOrders||[]).filter(function(o){return o.status==="pending"}).length},0)+'</b></div></div>'+
          '<div class="card"><div class="section">Admin Access</div><div class="notice">Admin panel unlocked by 10 taps. No admin email or PIN is required by the page.</div></div>';
        if(page==='users'&&typeof usersAdmin==='function')content=usersAdmin();
        if(page==='tasks'&&typeof tasksAdmin==='function')content=tasksAdmin();
        if(page==='deposits'&&typeof depositAdmin==='function')content=depositAdmin();
        if(page==='asset deposits'&&typeof assetDepositAdmin==='function')content=assetDepositAdmin();
        if(page==='withdrawals'&&typeof withdrawalAdmin==='function')content=withdrawalAdmin();
        if(page==='ads'&&typeof adsAdmin==='function')content=adsAdmin();
        if(page==='settings'&&typeof settingsAdmin==='function')content=settingsAdmin();
      }catch(e){
        console.error('Admin render error',e);
        content='<div class="card"><div class="notice">Admin section could not load. '+(e.message||'Please refresh.')+'</div></div>';
      }
      screen.innerHTML='<div class="admin-shell"><div class="admin-top"><div><h2>Palazzo Admin Panel</h2><small>Control Center</small></div><button class="admin-close" aria-label="Exit admin panel" data-no-loader="true" onclick="closeAdminPanel()">×</button></div><div class="admin-body"><div class="admin-tabs">'+tabs.map(function(x){return '<button class="admin-tab '+(page===x?'active':'')+'" data-no-loader="true" onclick="adminPage(\''+x+'\')">'+x+'</button>'}).join('')+'</div>'+content+'</div></div>';

      /* Admin controls: no rolling loader + prevent accidental double taps. */
      screen.querySelectorAll('button').forEach(function(btn){
        btn.dataset.noLoader='true';
        if(btn.dataset.smoothBound==='1')return;
        btn.dataset.smoothBound='1';
        btn.addEventListener('click',function(){
          if(btn.disabled)return;
          if(btn.dataset.actionBusy==='1')return;
          btn.dataset.actionBusy='1';
          btn.classList.add('palazo-admin-pressed');
          setTimeout(function(){
            btn.dataset.actionBusy='0';
            btn.classList.remove('palazo-admin-pressed');
          },900);
        },true);
      });
    }
    window.adminPage=function(p){page=p;renderAdmin()};
    window.adminRefresh=renderAdmin;
    renderAdmin();
  };

  window.adminPanel=async function(){
    try{
      /* Pull newest profiles first. If RLS blocks this request, retain the
         local cache rather than trapping the admin screen. */
      if(typeof loadAdminProfiles==='function'){
        try{await Promise.race([loadAdminProfiles(),new Promise(function(r){setTimeout(r,5000)})]);}
        catch(e){console.warn('Admin profile refresh unavailable:',e);}
      }
      if(typeof loadCloudData==='function'){
        try{await Promise.race([loadCloudData(),new Promise(function(r){setTimeout(r,5000)})]);}
        catch(e){console.warn('Admin cloud refresh unavailable:',e);}
      }
    }catch(e){console.warn('Admin refresh skipped:',e)}
    baseAdminRender();
  };

  /* One-click approve/reject wrappers. A second tap while the first request
     is saving is ignored. The original cloud/local decision logic is kept. */
  [
    'approveTask','rejectTask',
    'approveDeposit','rejectDeposit',
    'approveAssetDeposit','rejectAssetDeposit',
    'approveWithdrawal','rejectWithdrawal',
    'approveAdOrder','rejectAdOrder',
    'toggleBan','adjustUserBalance','deleteTask','deleteAllTasks'
  ].forEach(function(name){
    var original=window[name];
    if(typeof original!=='function')return;
    var lockKey='__pz_lock_'+name;
    window[name]=function(){
      if(adminBusy[lockKey])return;
      adminBusy[lockKey]=true;
      var args=arguments, result;
      try{result=original.apply(this,args);}
      catch(e){adminBusy[lockKey]=false;throw e;}
      return Promise.resolve(result).finally(function(){
        setTimeout(function(){adminBusy[lockKey]=false;},250);
      });
    };
  });

  /* Make every admin button feel immediate and stop the old global click
     loader from appearing inside the panel. */
  var css=document.createElement('style');
  css.textContent='.palazo-admin-pressed{transform:scale(.97)!important;filter:brightness(.98)!important}.admin-screen-modal button,.admin-shell button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}';
  document.head.appendChild(css);

  /* If the panel is rendered by another existing function, mark its buttons
     as no-loader too. */
  var obs=new MutationObserver(function(){
    var s=document.getElementById('adminScreen');
    if(!s||!s.classList.contains('open'))return;
    s.querySelectorAll('button').forEach(function(b){b.dataset.noLoader='true'});
  });
  obs.observe(document.documentElement,{subtree:true,childList:true});

})();
</script>

<script id="palazo-quick-fix-functional">
(function(){
  const escQ=v=>typeof escSafe==='function'?escSafe(v):typeof esc==='function'?esc(v):String(v??'');
  const moneyQ=v=>typeof money==='function'?money(v):'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
  const moneyPlain=v=>'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2}).replace(/\.00$/,'');
  const Ricon=(name,size=19)=>{try{return PIcon(name,size)}catch(e){return ''}};

  /* Social account binding: one field per platform, saved to the user's profile. */
  window.bindAccountsModal=function(){
    const u=me();if(!u)return renderAuth('login');
    u.socialAccounts=u.socialAccounts||{};
    const order=['WhatsApp','Telegram','YouTube','Twitter','Facebook','Instagram','TikTok','PlayStore','Spotify','Temu','LinkedIn','Discord','Snapchat','Pinterest','Reddit','Threads','Messenger','Twitch','Skype','Zoom','Signal','Viber','LINE','WeChat','Google','Gmail','Other'];
    const fields=order.map(app=>{const m=socialMeta(app),v=socialValue(u,app),pm=PLATFORM_META[app]||PLATFORM_META.Other;return `<div class="pz-social-row"><span class="platform-logo ${escQ(pm.cls||'')}">${typeof platformIcon==='function'?platformIcon(app,24):escQ(pm.icon||'')}</span><div style="min-width:0;flex:1"><b>${escQ(m.label)}</b><small>${escQ(m.hint)}</small><input id="social_${escQ(app)}" class="input" value="${escQ(v)}" placeholder="${escQ(m.placeholder)}" style="margin:7px 0 0"></div></div>`}).join('');
    openModal(`<div class="modal-head"><div><div class="section">My Social Accounts</div><h2 style="margin:0">Set Task Accounts</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice" style="margin-bottom:12px">You only need to set the account for a platform you want to perform. WhatsApp tasks require your WhatsApp number, Telegram tasks require your Telegram username, YouTube tasks require your YouTube username/channel, and X/Twitter tasks require your username.</div>${fields}<button class="btn pz-account-submit" onclick="saveBoundAccounts()">Save Social Accounts</button>`);
  };
  window.saveBoundAccounts=function(){
    const u=me();if(!u)return;
    u.socialAccounts=u.socialAccounts||{};
    Object.keys(SOCIAL_META).forEach(app=>{const el=document.getElementById('social_'+app);const v=String(el?.value||'').trim();if(v)u.socialAccounts[app]=v;else delete u.socialAccounts[app]});
    persistUser(u);closeModal();renderApp();toast('Social accounts saved');
  };

  /* Tasks: NO screenshot/image submission. The user's saved platform account is the submission. */
  window.tasksPage=function(u){
    const list=Array.isArray(cfg.tasks)?cfg.tasks:[];
    if(currentTaskId){

      const sub=typeof taskStatus==='function'?taskStatus(u,t.id):null;
      const started=!!(u.taskStarted&&u.taskStarted[t.id]);
      const account=socialValue(u,t.app),meta=socialMeta(t.app),left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));
      if(sub)return `<h2 class="title">Task Details</h2><p class="subtitle">Your task submission is ${escQ(sub.status||'pending')}.</p><div class="card"><div class="section-head"><h2>${escQ(t.app)} · ${escQ(t.category)}</h2><span class="pill ${escQ(sub.status||'pending')}">${escQ(String(sub.status||'pending').toUpperCase())}</span></div><div class="row"><span>Account submitted</span><b>${escQ(sub.accountValue||account||'Not recorded')}</b></div><div class="row"><span>Reward</span><b>${moneyQ(sub.reward||t.reward)}</b></div><div class="row"><span>Date</span><b>${escQ(sub.date||'')}</b></div>${sub.status==='rejected'?`<button class="btn secondary" onclick="currentTaskId='${escQ(t.id)}';renderApp()">Review & Resubmit</button>`:''}</div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
      return `<h2 class="title">Task Details</h2><p class="subtitle">Perform the task with your saved ${escQ(meta.label)}. No screenshot is required.</p><div class="card"><div class="task-detail-head"><div>${typeof platformBadge==='function'?platformBadge(t.app):''}<div><h2>${escQ(t.app)} · ${escQ(t.category)}</h2><small>${left} slots left</small></div></div><div class="task-reward-big">${moneyQ(t.reward)}<small>reward</small></div></div><div class="detail-section" style="margin-top:14px"><h3>Instructions</h3><p>${escQ(t.description||'Complete the task from your real account.')}</p></div></div><div class="card task-step-card"><div class="step-heading"><span class="step-number">1</span><div><h2>Start Task</h2><p>Open the task link and complete the required action.</p></div></div>${account?`<button class="btn ${started?'secondary':''}" onclick="startTask('${escQ(t.id)}')">${started?'✓ Task Started — Open Link Again':'▶ Start Task'}</button>`:`<button class="btn secondary" onclick="bindAccountsModal()">Bind ${escQ(t.app)} Account First</button>`}</div><div class="card task-step-card"><div class="step-heading"><span class="step-number">2</span><div><h2>Confirm Completion</h2><p>Your saved account will be sent to admin for verification.</p></div></div><div class="pz-no-proof"><b>${escQ(meta.label)}:</b> ${escQ(account)}</div><div class="fieldlabel" style="margin-top:13px">Additional note <span class="muted">(optional)</span></div><textarea id="taskNote" class="textarea" maxlength="300" placeholder="Anything the admin should know..."></textarea><button class="btn pz-account-submit" ${started?'':'disabled'} onclick="submitTask('${escQ(t.id)}')">✓ I Have Performed — Submit Details</button></div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
    }
    const subs=u.taskSubmissions||[];
    return `<h2 class="title">Tasks</h2><p class="subtitle">Set the matching social account first, perform the task, then submit the account details. Screenshots are not required.</p><div class="card notice"><b>Before performing a task</b><div class="muted" style="margin-top:4px">WhatsApp → phone number · Telegram → username · YouTube → username/channel · X/Twitter → username.</div><button class="btn secondary" style="margin-top:9px" onclick="bindAccountsModal()">${PIcon('settings',15)} Set Social Accounts</button></div>${list.length?list.map(t=>{const sub=taskStatus(u,t.id),acct=socialValue(u,t.app),pct=Math.min(100,Math.round(Number(t.completed||0)/Math.max(1,Number(t.slots||1))*100));return `<div class="card task-list-card"><div style="display:flex;justify-content:space-between;gap:10px"><div>${typeof platformBadge==='function'?platformBadge(t.app):''} <b>${escQ(t.app)} · ${escQ(t.category)}</b></div>${sub?`<span class="pill ${escQ(sub.status||'pending')}">${escQ(String(sub.status||'pending').toUpperCase())}</span>`:''}</div><p class="muted" style="font-size:10px;line-height:1.5">${escQ(t.description||'Complete the task using your saved account.')}</p><div style="display:flex;justify-content:space-between"><b>${moneyQ(t.reward)}</b><small>${Number(t.completed||0)} / ${Number(t.slots||0)} slots</small></div><div class="progress"><i style="width:${pct}%"></i></div><button class="btn" type="button" onclick="openTaskDetail('${escQ(t.id)}')">${acct?'View Task →':'Set '+escQ(t.app)+' Account →'}</button></div>`}).join(''):'<div class="card empty">No tasks are available right now.</div>'}<div class="card"><div class="section-head"><h2>My Submissions</h2><span class="pill">${subs.length}</span></div>${subs.length?subs.slice(0,10).map(s=>`<div class="row"><div><b>${escQ(s.app)} · ${escQ(s.category)}</b><div class="muted" style="font-size:9px">${escQ(s.date||'')} · ${escQ(s.accountValue||'')}</div></div><span class="pill ${escQ(s.status||'pending')}">${escQ(String(s.status||'pending').toUpperCase())}</span></div>`).join(''):'<div class="empty">No task submissions yet.</div>'}</div>`;
  };

  window.submitTask=async function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id)),u=me();if(!t)return toast('Task not found');if(!u)return renderAuth('login');
    const account=socialValue(u,t.app);if(!account){bindAccountsModal();return toast('Set your '+t.app+' account first');}
    const old=typeof taskStatus==='function'?taskStatus(u,id):null;if(old&&old.status!=='rejected')return toast('This task is already '+old.status);
    u.taskStarted=u.taskStarted||{};if(!u.taskStarted[t.id])u.taskStarted[t.id]=now();
    const sub={id:'sub_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),accountValue:account,note:String(document.getElementById('taskNote')?.value||'').trim(),status:'pending',date:now(),startedDate:u.taskStarted[t.id],proof:'',proof_path:''};
    try{u.taskSubmissions=u.taskSubmissions||[];if(old&&old.status==='rejected')u.taskSubmissions=u.taskSubmissions.filter(x=>String(x.id)!==String(old.id));u.taskSubmissions.unshift(sub);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Submission',amount:0,balance:'Task Balance',status:'pending',date:now(),taskId:t.id});if(typeof addNotification==='function')addNotification(u,'Task Submitted','Your '+t.category+' task was submitted using '+account+' and is pending admin review.','pending');await persistUser(u);currentTaskId=null;currentTab='tasks';renderApp();toast('Task submitted for admin review');}catch(e){console.error(e);toast('Could not save task submission.');}
  };

  /* Admin: show all task submissions from every loaded profile; no proof buttons. */
  window.tasksAdmin=function(){

<script id="palazo-final-functional-patch">

  window.startTask=async function(id){

  /* Proper Supabase password recovery page */

    app.innerHTML=`<div class="reset-page"><div class="reset-card"><div style="width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,#0B2A4A,#12A150);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:20px">P</div><h1>Set New Password</h1><p>Enter a new password for your Palazo account. After saving it, you can log in normally.</p><div class="fieldlabel">New Password</div><input id="resetPass1" class="input" type="password" minlength="8" placeholder="At least 8 characters"><div class="fieldlabel">Confirm New Password</div><input id="resetPass2" class="input" type="password" minlength="8" placeholder="Re-enter your password"><button class="btn" style="margin-top:12px" onclick="pzSaveResetPassword()">Update Password</button><button class="btn secondary" style="margin-top:8px" onclick="renderAuth('login')">Back to Login</button></div></div>`;
  };
  window.pzSaveResetPassword=async function(){
    const a=String(document.getElementById('resetPass1')?.value||''),b=String(document.getElementById('resetPass2')?.value||'');
    if(a.length<8)return toast('Password must be at least 8 characters.');if(a!==b)return toast('Passwords do not match.');
    try{if(!window.PalazoCloud?.sb?.auth)return toast('Password reset service is unavailable.');const {error}=await window.PalazoCloud.sb.auth.updateUser({password:a});if(error)throw error;toast('Password updated successfully.');setTimeout(()=>{history.replaceState({},document.title,window.location.pathname);renderAuth('login')},700);}catch(e){console.error(e);toast(e?.message||'Could not update password.');}
  };
  /* Hook password recovery event without disturbing normal login. */
  window.addEventListener('load',function(){
    setTimeout(async function(){
      try{

<script id="palazo-sharp-final-ui-script">
(function(){
  const logo=typeof PALAZZO_LOGO!=='undefined'?PALAZZO_LOGO:'';
  const escx=v=>typeof esc==='function'?esc(v):String(v??'');
  const pxIcon=(name,size=16)=>{try{return typeof PIcon==='function'?PIcon(name,size):''}catch(e){return ''}};

  function copyValue(value,button){
    const text=String(value||'');
    const done=()=>{if(button){button.innerHTML=pxIcon('shield',15);button.setAttribute('aria-label','Copied')}if(typeof toast==='function')toast('Copied to clipboard')};
    if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallback())}else fallback();
    function fallback(){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
  }
  window.pzCopyValue=copyValue;

  function cashierRows(account,bank,name,amount,reference,asset){
    const row=(label,value,copy)=>`<div class="pz-cashier-row"><span>${label}</span><strong>${escx(value)}</strong>${copy?`<button class="pz-copy" type="button" aria-label="Copy ${escx(label)}" onclick="pzCopyValue('${String(value).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',this)">${pxIcon('copy',16)}</button>`:'<span></span>'}</div>`;
    return row('Name',name,true)+row('Bank',bank,true)+row('Account',account,true)+row('Amount',money(amount),true)+(reference?row('Note',reference,true):'');
  }

  function cashierHTML(n,kind,code){
    const account=kind==='ads'?cfg.paymentAccount:cfg.assetPaymentAccount;
    const bank=kind==='ads'?cfg.paymentBank:cfg.assetPaymentBank;
    const name=kind==='ads'?cfg.paymentName:cfg.assetPaymentName;
    const title=kind==='ads'?'Ads Deposit':'Asset Deposit';
    return `<div class="pz-cashier"><div class="pz-cashier-title">PayNow® Cashier</div><div class="pz-cashier-steps"><div class="pz-cashier-step active">1. Submit ✓</div><div class="pz-cashier-step active">2. Payment ✓</div><div class="pz-cashier-step">3. Completed ○</div></div><div class="pz-cashier-card"><div class="pz-cashier-mark"><img src="${escx(logo)}" alt="Palazo"></div><div class="pz-cashier-amount">${money(n)}</div><div class="pz-cashier-sub">Use this account for this transaction only</div><div class="pz-cashier-expire">Payment details are valid for this transaction</div><div class="pz-cashier-details">${cashierRows(account,bank,name,n,code,kind==='asset')}</div><div class="pz-cashier-note">ⓘ Fill in the transfer details exactly as shown. Transfer the exact amount from your bank app.</div></div><div class="pz-cashier-guide"><div class="pz-cashier-guide-title">Payment Guide</div><ol><li>Please complete the payment using the account details above.</li><li>Transfer the <b>exact amount</b> shown. Do not change the amount.</li><li class="warn">Do not save or reuse this payment account for another transaction.</li><li>After completing the payment, tap <b>I Have Made This Transfer</b> below and enter the payee name and the account number you used to send the money.</li></ol></div><button class="btn green-btn pz-cashier-pay-btn" type="button" onclick="paidDeposit(${Number(n)},'${escx(code)}','${escx(kind)}')">${pxIcon('check',17)} I Have Made This Transfer</button></div>`;
  }

  /* Add missing check icon to the icon set if this file does not have one. */
  if(typeof PIcon==='function'){
    try{const test=PIcon('check',16); if(!test||test.includes('circle cx="12" cy="12"')){const oldPIcon=PIcon;window.PIcon=function(name,size){if(name==='check')return `<svg width="${size||16}" height="${size||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>`;return oldPIcon(name,size)}}}catch(e){}
  }

  /* Replace the final payment renderers with the screenshot-inspired cashier layout. */
  window.paymentDetails=function(n,kind='ads'){
    if(typeof forceDepositAccount==='function')forceDepositAccount();
    const code=typeof narration==='function'?narration():'PN-'+Date.now().toString().slice(-8);
    openModal(`<div class="modal-head"><div><div class="section">${kind==='ads'?'Ads Deposit':'Deposit'}</div><h2 style="margin:0">Payment</h2></div><button class="close" onclick="closeModal();go('deposit')">×</button></div>${cashierHTML(n,kind,code)}`);
  };
  window.assetPaymentDetails=function(n){
    if(typeof forceDepositAccount==='function')forceDepositAccount();
    const code=typeof narration==='function'?narration():'';
    openModal(`<div class="modal-head"><div><div class="section">Asset Deposit</div><h2 style="margin:0">Payment</h2></div><button class="close" onclick="closeModal();go('deposit')">×</button></div>${cashierHTML(n,'asset',code)}`);
  };

  /* Add a polished account logo/watermark to every asset plan card. */
  function paintAssetPlans(){
    document.querySelectorAll('.invest-card').forEach(card=>{
      if(!card.closest('main')||card.classList.contains('invest-active'))return;
      if(card.classList.contains('pz-plan-watermark'))return;
      card.classList.add('pz-plan-watermark');
      if(logo)card.style.setProperty('--palazo-logo',`url("${String(logo).replace(/"/g,'\\"')}")`);
      if(!card.querySelector('.asset-plan-logo')){
        const logoBox=document.createElement('div');logoBox.className='asset-plan-logo';logoBox.innerHTML=logo?`<img src="${escx(logo)}" alt="Palazo">`:`${pxIcon('wallet',22)}`;
        card.insertBefore(logoBox,card.firstElementChild);
      }
    });
  }

  /* Keep only the original/explicit button icons. Do not auto-insert or enlarge icons. */
  const mo=new MutationObserver(()=>{clearTimeout(window.__pzPolishTimer);window.__pzPolishTimer=setTimeout(polish,30)});
  mo.observe(document.body,{subtree:true,childList:true});
  document.addEventListener('DOMContentLoaded',polish);
  setTimeout(polish,250);
})();
</script>
