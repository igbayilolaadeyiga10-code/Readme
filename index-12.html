<script id="palazo-round3-functional-fix">
(function(){
  const escSafe3=v=>typeof PZ!=='undefined'&&PZ.safe?PZ.safe(v):(typeof esc==='function'?esc(v):String(v??''));
  const moneySafe3=v=>typeof money2==='function'?money2(v):(typeof money==='function'?money(v):'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2}));
  const bucket='task-proofs';

  async function proofUrl(path){
    if(!path||!window.PalazoCloud?.ready)return null;
    const storage=window.PalazoCloud.sb.storage.from(bucket);
    try{
      const r=await storage.createSignedUrl(path,300);
      if(r?.data?.signedUrl)return r.data.signedUrl;
    }catch(e){console.warn('signed proof url failed',e)}
    try{
      const r=await storage.download(path);
      if(r?.data)return URL.createObjectURL(r.data);
    }catch(e){console.warn('proof download failed',e)}
    return null;
  }
  function getPath(u,d){
    return d?.proof_path||d?.storage_path||d?.storagePath||d?.proofPath||((d?.proof==='stored'||d?.proof==='storage')&&u?.id?String(u.id)+'/deposits/'+String(d.id)+'.jpg':'');
  }
  window.viewDepositProof=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));
    if(!d)return toast('Deposit not found');
    const path=getPath(u,d);
    if(!path)return toast('Screenshot path is missing for this deposit');
    try{const url=await proofUrl(path);if(!url)return toast('Could not load screenshot. Check the Supabase Storage policy for the task-proofs bucket.');openModal('<div class="modal-head"><div><div class="section">Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="'+url+'" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px;background:#f7fafc" alt="Deposit screenshot">')}catch(e){console.error(e);toast('Could not open deposit screenshot')}
  };
  window.viewAssetDepositProof=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));
    if(!d)return toast('Asset deposit not found');
    const path=getPath(u,d);
    if(!path)return toast('Screenshot path is missing for this asset deposit');
    try{const url=await proofUrl(path);if(!url)return toast('Could not load screenshot. Check the Supabase Storage policy for the task-proofs bucket.');openModal('<div class="modal-head"><div><div class="section">Asset Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="'+url+'" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px;background:#f7fafc" alt="Asset deposit screenshot">')}catch(e){console.error(e);toast('Could not open asset deposit screenshot')}
  };

  /* Persist both names so older admin records remain compatible. */
  const originalSubmitDeposit=window.submitDeposit;
  const originalSubmitAsset=window.submitAssetDeposit;
  if(typeof originalSubmitDeposit==='function'){
    window.submitDeposit=async function(n,code,kind='ads'){
      try{
        const name=document.getElementById('depName')?.value.trim(),file=document.getElementById('depFile')?.files?.[0];
        if(!name||!file)return toast('Enter account name and upload screenshot');
        const u=me(); if(!u?.id)return toast('Please sign in again');
        const id='dep_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),path=String(u.id)+'/deposits/'+id+'.jpg';
        const blob=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('compression failed')),'image/jpeg',.78)};img.onerror=()=>reject(new Error('invalid image'));img.src=r.result};r.onerror=()=>reject(r.error||new Error('read failed'));r.readAsDataURL(file)});
        if(!window.PalazoCloud?.ready)throw new Error('Cloud not ready');
        const up=await window.PalazoCloud.sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});if(up.error)throw up.error;
        const d={id,amount:Number(n),accountName:name,narration:code,kind,fileName:file.name,status:'pending',date:now(),proof:'stored',proof_path:path,storage_path:path};
        u.deposits=u.deposits||[];u.deposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:id,type:kind==='ads'?'Ads Deposit':'Deposit Request',amount:Number(n),balance:kind==='ads'?'Ads Balance':'Deposit Balance',status:'pending',date:now()});addNotification(u,kind==='ads'?'Ads Deposit submitted':'Deposit submitted','Your '+moneySafe3(n)+' deposit is pending admin review.','pending');await persistUser(u);closeModal();go('deposit');toast('Screenshot submitted for admin review');
      }catch(e){console.error(e);toast('Could not upload screenshot. Please try again.')}
    }
  }
  if(typeof originalSubmitAsset==='function'){
    window.submitAssetDeposit=async function(n){
      try{
        const name=document.getElementById('assetDepName')?.value.trim(),file=document.getElementById('assetDepFile')?.files?.[0];
        if(!name||!file)return toast('Enter deposit name and screenshot');
        const u=me(); if(!u?.id)return toast('Please sign in again');
        const id='adep_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),path=String(u.id)+'/deposits/'+id+'.jpg';
        const blob=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('compression failed')),'image/jpeg',.78)};img.onerror=()=>reject(new Error('invalid image'));img.src=r.result};r.onerror=()=>reject(r.error||new Error('read failed'));r.readAsDataURL(file)});
        if(!window.PalazoCloud?.ready)throw new Error('Cloud not ready');
        const up=await window.PalazoCloud.sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});if(up.error)throw up.error;
        const d={id,amount:Number(n),accountName:name,fileName:file.name,status:'pending',date:now(),proof:'stored',proof_path:path,storage_path:path};
        u.assetDeposits=u.assetDeposits||[];u.assetDeposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:id,type:'Asset Deposit',amount:Number(n),balance:'Asset Balance',status:'pending',date:now()});addNotification(u,'Asset Deposit submitted','Your '+moneySafe3(n)+' Asset Deposit is pending admin review.','pending');await persistUser(u);closeModal();go('deposit');toast('Screenshot submitted for admin review');
      }catch(e){console.error(e);toast('Could not upload screenshot. Please try again.')}
    }
  }

  async function removeProof(d,u){const path=getPath(u,d);if(!path)return true;const {error}=await window.PalazoCloud.sb.storage.from(bucket).remove([path]);if(error)throw error;return true}
  const oldApprove=window.approveDeposit,oldReject=window.rejectDeposit,oldApproveAsset=window.approveAssetDeposit,oldRejectAsset=window.rejectAssetDeposit;
  if(typeof oldApprove==='function')window.approveDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');try{await removeProof(d,u)}catch(e){console.error(e);return toast('Could not delete screenshot. Approval was not completed.')}d.status='approved';d.approvedDate=now();delete d.proof_path;delete d.storage_path;delete d.proof;const amount=Number(d.amount||0),kind=d.kind||'ads';if(kind==='ads')u.adBalance=Number(u.adBalance||0)+amount;else u.deposit=Number(u.deposit||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',moneySafe3(amount)+' was added to '+(kind==='ads'?'Ads Balance':'Deposit Balance')+'.','approved');save('palazo_users',users);toast('Deposit approved — screenshot deleted');adminPanel()};
  if(typeof oldReject==='function')window.rejectDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');try{await removeProof(d,u)}catch(e){console.error(e);return toast('Could not delete screenshot. Rejection was not completed.')}d.status='rejected';d.rejectedDate=now();delete d.proof_path;delete d.storage_path;delete d.proof;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+moneySafe3(d.amount||0)+' deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Deposit rejected — screenshot deleted');adminPanel()};
  if(typeof oldApproveAsset==='function')window.approveAssetDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');try{await removeProof(d,u)}catch(e){console.error(e);return toast('Could not delete screenshot. Approval was not completed.')}d.status='approved';d.approvedDate=now();delete d.proof_path;delete d.storage_path;delete d.proof;const amount=Number(d.amount||0);u.assetBalance=Number(u.assetBalance||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,'Asset Deposit Approved');addNotification(u,'Asset Deposit Approved',moneySafe3(amount)+' was added to Asset Balance.','approved');save('palazo_users',users);toast('Asset deposit approved — screenshot deleted');adminPanel()};
  if(typeof oldRejectAsset==='function')window.rejectAssetDeposit=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');try{await removeProof(d,u)}catch(e){console.error(e);return toast('Could not delete screenshot. Rejection was not completed.')}d.status='rejected';d.rejectedDate=now();delete d.proof_path;delete d.storage_path;delete d.proof;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,'Asset Deposit Rejected');addNotification(u,'Asset Deposit Rejected','Your '+moneySafe3(d.amount||0)+' Asset Deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Asset deposit rejected — screenshot deleted');adminPanel()};

  /* Profile page: show the real uploaded picture, not only the initial. */
  const oldProfile=window.profilePage;
  if(typeof oldProfile==='function'){
    window.profilePage=function(u){
      const html=oldProfile(u);
      return html.replace(/<div class="profile-avatar">[^<]*(?:<img[^>]*>[^<]*<\/img>)?[^<]*<\/div>/,'<div class="profile-avatar">'+(u.avatar?'<img src="'+escSafe3(u.avatar)+'" alt="Profile photo">':escSafe3((u.username||'U').slice(0,1).toUpperCase()))+'</div>');
    }
  }
})();
</script>


<script id="palazo-proof-admin-final-fix">
(function(){
  const BUCKET='task-proofs';
  const escX=v=>typeof esc==='function'?esc(v):String(v??'');
  const moneyX=v=>typeof money==='function'?money(v):'₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2});
  function cloudReady(){return !!(window.PalazoCloud&&window.PalazoCloud.ready&&window.PalazoCloud.sb)}
  function pathFor(u,d,kind){
    if(!d)return '';
    return d.proof_path||d.storage_path||d.storagePath||d.proofPath||
      ((d.proof==='stored'||d.proof==='storage')&&u?.id ? String(u.id)+'/deposits/'+String(d.id)+'.jpg' : '') ||
      (kind==='task'&&u?.id&&d.id ? String(u.id)+'/'+String(d.id)+'.jpg' : '');
  }
  async function getUrl(path){
    if(!path||!cloudReady()) return null;
    const storage=window.PalazoCloud.sb.storage.from(BUCKET);
    try{const r=await storage.createSignedUrl(path,600);if(r?.data?.signedUrl)return r.data.signedUrl;}catch(e){console.warn('signed URL failed',e)}
    try{const r=await storage.download(path);if(r?.data)return URL.createObjectURL(r.data);}catch(e){console.warn('download failed',e)}
    return null;
  }
  async function deletePath(path){
    if(!path||!cloudReady()) return true;
    const {error}=await window.PalazoCloud.sb.storage.from(BUCKET).remove([path]);
    if(error) throw error;
    return true;
  }
  function openImage(title,url){
    openModal('<div class="modal-head"><div><div class="section">'+escX(title)+'</div><h2 style="margin:0">Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><div style="background:#f7fafc;border:1px solid #e5eaf2;border-radius:16px;padding:8px;text-align:center"><img src="'+url+'" style="display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:12px" alt="Screenshot proof" onerror="this.parentElement.innerHTML=\'<div class=empty>Screenshot could not be displayed.</div>\'"></div>');
  }
  window.viewDepositProof=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));
    if(!d)return toast('Deposit not found');
    if(typeof d.proof==='string'&&d.proof.startsWith('data:image/'))return openImage('Deposit Proof',d.proof);
    const path=pathFor(u,d,'deposit');
    if(!path)return toast('Screenshot path is missing');
    const url=await getUrl(path);
    if(url)openImage('Deposit Proof',url);else toast('Cannot view screenshot. The Storage policy may be blocking admin access.');
  };
  window.viewAssetDepositProof=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));
    if(!d)return toast('Asset deposit not found');
    if(typeof d.proof==='string'&&d.proof.startsWith('data:image/'))return openImage('Asset Deposit Proof',d.proof);
    const path=pathFor(u,d,'asset');
    if(!path)return toast('Screenshot path is missing');
    const url=await getUrl(path);
    if(url)openImage('Asset Deposit Proof',url);else toast('Cannot view screenshot. The Storage policy may be blocking admin access.');
  };
  window.viewProof=async function(username,id){
    const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>String(x.id)===String(id));
    if(!s)return toast('Submission not found');
    if(typeof s.proof==='string'&&s.proof.startsWith('data:image/'))return openImage('Task Proof',s.proof);
    const path=pathFor(u,s,'task');
    if(!path)return toast('Screenshot path is missing');
    const url=await getUrl(path);
    if(url)openImage('Task Proof',url);else toast('Cannot view screenshot. The Storage policy may be blocking admin access.');
  };
  window.viewTaskSubmission=async function(username,id){return window.viewProof(username,id)};

  async function removeAfterDecision(u,d){
    const path=pathFor(u,d,d?.taskId?'task':'deposit');
    if(!path)return {ok:true,path:''};
    try{await deletePath(path);return {ok:true,path};}
    catch(e){console.error('Storage delete failed:',e);return {ok:false,path,error:e};}
  }
  async function saveAdminUser(u){
    if(typeof persistUser==='function') await persistUser(u); else save('palazo_users',users);
  }
  window.approveDeposit=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));
    if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');
    const amount=Number(d.amount||0),kind=d.kind||'ads';
    d.status='approved';d.approvedDate=now();
    if(kind==='ads')u.adBalance=Number(u.adBalance||0)+amount;else u.deposit=Number(u.deposit||0)+amount;
    u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');
    addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',moneyX(amount)+' was added to '+(kind==='ads'?'Ads Balance':'Deposit Balance')+'.','approved');
    const clean=await removeAfterDecision(u,d);delete d.proof_path;delete d.storage_path;delete d.proof;
    await saveAdminUser(u);adminPanel();
    toast(clean.ok?'Deposit approved — screenshot deleted from Storage':'Deposit approved, but Storage cleanup needs the admin delete policy');
  };
  window.rejectDeposit=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>String(x.id)===String(id));
    if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');
    const clean=await removeAfterDecision(u,d);d.status='rejected';d.rejectedDate=now();
    u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+moneyX(d.amount||0)+' deposit was rejected by admin.','rejected');
    delete d.proof_path;delete d.storage_path;delete d.proof;await saveAdminUser(u);adminPanel();
    toast(clean.ok?'Deposit rejected — screenshot deleted from Storage':'Deposit rejected, but Storage cleanup needs the admin delete policy');
  };
  window.approveAssetDeposit=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));
    if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');
    const amount=Number(d.amount||0);d.status='approved';d.approvedDate=now();u.assetBalance=Number(u.assetBalance||0)+amount;
    u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,'Asset Deposit Approved');addNotification(u,'Asset Deposit Approved',moneyX(amount)+' was added to Asset Balance.','approved');
    const clean=await removeAfterDecision(u,d);delete d.proof_path;delete d.storage_path;delete d.proof;await saveAdminUser(u);adminPanel();
    toast(clean.ok?'Asset deposit approved — screenshot deleted from Storage':'Asset deposit approved, but Storage cleanup needs the admin delete policy');
  };
  window.rejectAssetDeposit=async function(username,id){
    const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>String(x.id)===String(id));
    if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');
    const clean=await removeAfterDecision(u,d);d.status='rejected';d.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,'Asset Deposit Rejected');addNotification(u,'Asset Deposit Rejected','Your '+moneyX(d.amount||0)+' Asset Deposit was rejected by admin.','rejected');
    delete d.proof_path;delete d.storage_path;delete d.proof;await saveAdminUser(u);adminPanel();
    toast(clean.ok?'Asset deposit rejected — screenshot deleted from Storage':'Asset deposit rejected, but Storage cleanup needs the admin delete policy');
  };

  /* Make the admin list show the screenshot button whenever a path exists, not only when proof is a truthy legacy value. */
  const oldDepositAdmin=window.depositAdmin,oldAssetAdmin=window.assetDepositAdmin;
  if(typeof oldDepositAdmin==='function'){
    window.depositAdmin=function(){
      const rows=users.flatMap(u=>(u.deposits||[]).map(d=>({u,d}))).sort((a,b)=>new Date(b.d.date||0)-new Date(a.d.date||0));
      const pending=rows.filter(x=>x.d.status==='pending');
      const html=pending.map(({u,d})=>`<div class="admin-order"><div><b>@${escX(u.username)}</b><div class="muted">${moneyX(d.amount)} • ${escX(d.date||'')}<br>Type: ${escX(d.kind==='ads'?'Ads Deposit':'Deposit')}<br>Account name: ${escX(d.accountName||'Not provided')}<br>Narration: ${escX(d.narration||d.code||'')}</div></div><div class="order-actions"><button class="btn secondary" onclick="viewDepositProof('${escX(u.username)}','${escX(d.id)}')">View Screenshot</button><button class="btn green-btn" onclick="approveDeposit('${escX(u.username)}','${escX(d.id)}')">✓ Approve & Credit</button><button class="btn danger" onclick="rejectDeposit('${escX(u.username)}','${escX(d.id)}')">✕ Reject</button></div></div>`).join('')||'<div class="empty">No pending deposits.</div>';
      const history=rows.slice(0,40).map(({u,d})=>`<div class="admin-order"><div><b>@${escX(u.username)} • ${moneyX(d.amount)}</b><div class="muted">${escX(d.date||'')} • ${escX(d.accountName||'')}</div></div><span class="pill ${escX(d.status||'pending')}">${escX(String(d.status||'pending').toUpperCase())}</span></div>`).join('')||'<div class="empty">No deposit history.</div>';
      return `<div class="card"><div class="section">Pending Deposits</div><p class="muted">Review user deposits before crediting Deposit Balance.</p>${html}</div><div class="card"><div class="section">Deposit History</div>${history}</div>`;
    };
  }
  if(typeof oldAssetAdmin==='function'){
    window.assetDepositAdmin=function(){
      const rows=users.flatMap(u=>(u.assetDeposits||[]).map(d=>({u,d}))).sort((a,b)=>new Date(b.d.date||0)-new Date(a.d.date||0));
      const pending=rows.filter(x=>x.d.status==='pending');
      const html=pending.map(({u,d})=>`<div class="admin-order"><div><b>@${escX(u.username)}</b><div class="muted">${moneyX(d.amount)} • ${escX(d.date||'')}<br>Account name: ${escX(d.accountName||'Not provided')}</div></div><div class="order-actions"><button class="btn secondary" onclick="viewAssetDepositProof('${escX(u.username)}','${escX(d.id)}')">View Screenshot</button><button class="btn green-btn" onclick="approveAssetDeposit('${escX(u.username)}','${escX(d.id)}')">✓ Approve & Credit</button><button class="btn danger" onclick="rejectAssetDeposit('${escX(u.username)}','${escX(d.id)}')">✕ Reject</button></div></div>`).join('')||'<div class="empty">No pending asset deposits.</div>';
      const history=rows.slice(0,40).map(({u,d})=>`<div class="admin-order"><div><b>@${escX(u.username)} • ${moneyX(d.amount)}</b><div class="muted">${escX(d.date||'')} • ${escX(d.accountName||'')}</div></div><span class="pill ${escX(d.status||'pending')}">${escX(String(d.status||'pending').toUpperCase())}</span></div>`).join('')||'<div class="empty">No asset deposit history.</div>';
      return `<div class="card"><div class="section">Pending Asset Deposits</div><p class="muted">Review asset funding requests before crediting Asset Balance.</p>${html}</div><div class="card"><div class="section">Asset Deposit History</div>${history}</div>`;
    };
  }
})();
</script>

<script>
(function(){
 const BUCKET='task-proofs';
 async function uploadProof(file,path){
   const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'image/jpeg',upsert:false,cacheControl:'3600'});
   if(error)throw error; return path;
 }
 async function signedProof(path){
   if(!path)return null; const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,600); if(error)throw error; return data?.signedUrl||null;
 }
 async function removeProof(path){
   if(!path || /^data:/.test(path))return;
   try{const {error}=await sb.storage.from(BUCKET).remove([path]);if(error)console.error('proof delete failed',error)}catch(e){console.error('proof delete failed',e)}
 }
 async function cloudUser(u){
   if(!window.PalazoCloud?.ready||!u?.id)return;
   const copy=JSON.parse(JSON.stringify(u)); delete copy.password; delete copy.id; delete copy.role; delete copy.banned; delete copy.username; delete copy.email; delete copy.phone;
   const {error}=await sb.from('profiles').update({username:u.username,email:u.email||'',phone:u.phone||'',banned:!!u.banned,data:copy}).eq('id',u.id);
   if(error)throw error;
 }
 function proofPath(d){return d?.proof_path||d?.proofPath||((d?.proof||'').startsWith('data:')?d.proof:'')||''}
 async function showProof(d,title){
   const p=proofPath(d); if(!p)return toast('Screenshot unavailable');
   let url=p; try{if(!p.startsWith('data:'))url=await signedProof(p)}catch(e){console.error(e);return toast('Could not load screenshot')}
   if(!url)return toast('Screenshot unavailable');
   openModal(`<div class="modal-head"><div><div class="section">${esc(title)}</div><h2 style="margin:0">Payment / Task Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${url}" style="display:block;width:100%;max-height:75vh;object-fit:contain;border-radius:16px;background:#f6f8fa" alt="Screenshot">`);
 }
 window.viewDepositProof=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!d)return toast('Deposit not found');await showProof(d,'Deposit Proof')};
 window.viewAssetDepositProof=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!d)return toast('Asset deposit not found');await showProof(d,'Asset Deposit Proof')};
 window.viewTaskSubmission=async function(username,id){const u=users.find(x=>x.username===username),d=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!d)return toast('Submission not found');await showProof(d,'Task Submission Proof')};
 async function finishDeposit(username,id,approved){
   const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id); if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');
   const path=proofPath(d);
   try{
     if(approved){const amount=Number(d.amount||0),kind=d.kind||'ads';if(kind==='ads')u.adBalance=Number(u.adBalance||0)+amount;else u.deposit=Number(u.deposit||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',money(amount)+' was added to your '+(kind==='ads'?'Ads':'Deposit')+' Balance.','approved');d.status='approved';d.approvedDate=now();}
     else{d.status='rejected';d.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+money(d.amount||0)+' deposit was rejected by admin.','rejected');}
     d.proof='';d.proof_path='';d.proofPath='';await cloudUser(u);oldSave('palazo_users',users);toast(approved?'Deposit approved and credited':'Deposit rejected');if(path)await removeProof(path);await adminPanel();
   }catch(e){console.error('deposit decision failed',e);toast('Could not save the decision. Check Supabase permissions.');}
 }
 window.approveDeposit=(u,id)=>finishDeposit(u,id,true);window.rejectDeposit=(u,id)=>finishDeposit(u,id,false);
 async function finishAsset(username,id,approved){
   const u=users.find(x=>x.username===username),d=(u?.assetDeposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Asset deposit is no longer pending');const path=proofPath(d);
   try{if(approved){const amount=Number(d.amount||0);u.assetBalance=Number(u.assetBalance||0)+amount;u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,'Asset Deposit Approved');addNotification(u,'Asset Deposit Approved',money(amount)+' was added to Asset Balance.','approved');d.status='approved';d.approvedDate=now();}else{d.status='rejected';d.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,'Asset Deposit Rejected');addNotification(u,'Asset Deposit Rejected','Your '+money(d.amount||0)+' Asset Deposit was rejected by admin.','rejected');}d.proof='';d.proof_path='';d.proofPath='';await cloudUser(u);oldSave('palazo_users',users);toast(approved?'Asset deposit approved and credited':'Asset deposit rejected');if(path)await removeProof(path);await adminPanel();}catch(e){console.error('asset decision failed',e);toast('Could not save the decision. Check Supabase permissions.');}
 }
 window.approveAssetDeposit=(u,id)=>finishAsset(u,id,true);window.rejectAssetDeposit=(u,id)=>finishAsset(u,id,false);
 async function finishTask(username,id,approved){
   const u=users.find(x=>x.username===username),sub=(u?.taskSubmissions||[]).find(x=>x.id===id),t=cfg.tasks.find(x=>String(x.id)===String(sub?.taskId));if(!u||!sub||sub.status!=='pending')return toast('This submission is no longer pending');const path=proofPath(sub);
   try{if(approved){if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast('This task has no slots left');const reward=Number(sub.reward||0);sub.status='approved';sub.approvedDate=now();u.earning=Number(u.earning||0)+reward;if(!updateRequestTransaction(u,sub.id,'approved',reward,'Task Approved')){u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Approved',amount:reward,balance:'Task Balance',status:'approved',date:now()})}addNotification(u,'Task Approved','Your '+sub.category+' task was approved and '+money(reward)+' was added to Task Balance.','approved');if(t)t.completed=Number(t.completed||0)+1;}else{sub.status='rejected';sub.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,sub.id,'rejected',0,'Task Rejected');addNotification(u,'Task Rejected','Your '+sub.category+' task was rejected.','rejected');}sub.proof='';sub.proof_path='';sub.proofPath='';await cloudUser(u);oldSave('palazo_users',users);if(t&&approved)await saveTasks();toast(approved?'Task approved and credited':'Task rejected');if(path)await removeProof(path);await adminPanel();}catch(e){console.error('task decision failed',e);toast('Could not save the decision. Check Supabase permissions.');}
 }
 window.approveTask=(u,id)=>finishTask(u,id,true);window.rejectTask=(u,id)=>finishTask(u,id,false);
 // New task submission: store proof in Storage, not in profile JSON.
 window.submitTask=async function(id){
   const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id)),file=document.getElementById('taskFile')?.files?.[0];if(!t||!file)return toast('Upload your task screenshot');const u=me();if((u.taskSubmissions||[]).some(s=>s.taskId===id&&s.status==='pending'))return toast('This task is already pending approval');
   const sub={id:'sub_'+Date.now(),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),fileName:file.name,status:'pending',date:now(),proof:'',proof_path:''};
   try{sub.proof_path=await uploadProof(file,String(u.id||u.username)+'/task/'+sub.id+'.jpg');u.taskSubmissions=u.taskSubmissions||[];u.taskSubmissions.unshift(sub);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Submission',amount:0,balance:'Task Balance',status:'pending',date:now()});addNotification(u,'Task submitted','Your '+t.category+' task is pending admin review.','pending');await persistUser(u);closeModal();toast('Task submitted — waiting for approval');renderApp();}catch(e){console.error(e);toast('Could not upload screenshot. Check Storage permissions.');}
 };
 // Deposit proof submission in Storage.
 window.submitDeposit=async function(n,code,kind='ads'){
   const name=document.getElementById('depName')?.value.trim(),file=document.getElementById('depFile')?.files?.[0];if(!name||!file)return toast('Enter account name and upload screenshot');const u=me();const d={id:'dep_'+Date.now(),amount:Number(n),accountName:name,narration:code,kind,fileName:file.name,status:'pending',date:now(),proof:'',proof_path:''};
   try{d.proof_path=await uploadProof(file,String(u.id||u.username)+'/deposit/'+d.id+'.jpg');u.deposits=u.deposits||[];u.deposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:kind==='ads'?'Ads Deposit':'Deposit Request',amount:Number(n),balance:kind==='ads'?'Ads Balance':'Deposit Balance',status:'pending',date:now()});addNotification(u,kind==='ads'?'Ads Deposit submitted':'Deposit submitted','Your '+money(n)+' deposit is pending admin review.','pending');await persistUser(u);closeModal();go('deposit');toast('Deposit submitted for admin review');}catch(e){console.error(e);toast('Could not upload screenshot. Check Storage permissions.');}
 };
 window.submitAssetDeposit=async function(n){const name=document.getElementById('assetDepName')?.value.trim(),file=document.getElementById('assetDepFile')?.files?.[0];if(!name||!file)return toast('Enter deposit name and screenshot');const u=me(),d={id:'adep_'+Date.now(),amount:Number(n),accountName:name,fileName:file.name,status:'pending',date:now(),proof:'',proof_path:''};try{d.proof_path=await uploadProof(file,String(u.id||u.username)+'/asset/'+d.id+'.jpg');u.assetDeposits=u.assetDeposits||[];u.assetDeposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:'Asset Deposit Request',amount:Number(n),balance:'Asset Balance',status:'pending',date:now()});await persistUser(u);closeModal();renderApp();toast('Asset deposit submitted for admin review')}catch(e){console.error(e);toast('Could not upload screenshot. Check Storage permissions.')}};
 // Admin storage usage dashboard (client-visible estimate, not a Supabase billing quota).
 window.proofStorageDashboard=async function(){try{const {data,error}=await sb.storage.from(BUCKET).list('',{limit:1000});if(error)throw error;const files=(data||[]).filter(x=>x.id);let used=files.reduce((a,x)=>a+Number(x.metadata?.size||x.metadata?.mimetype_size||0),0);const capacity=1024*1024*1024;const pct=Math.min(100,used/capacity*100);return `<div class="card"><div class="section">Proof Storage</div><div class="muted">Current proof files in the task-proofs bucket.</div><div class="storage-grid" style="margin-top:10px"><div class="storage-chip"><small>Files</small><b>${files.length}</b></div><div class="storage-chip"><small>Used</small><b>${(used/1048576).toFixed(2)} MB</b></div><div class="storage-chip"><small>Remaining*</small><b>${((capacity-used)/1048576).toFixed(2)} MB</b></div></div><div class="storage-bar"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:8px;margin-top:6px">*Shown against a 1 GB dashboard reference; actual Supabase plan limits can differ.</div></div>`}catch(e){return `<div class="card"><div class="section">Proof Storage</div><div class="muted">Storage usage unavailable: ${esc(e.message||'permission denied')}</div></div>`}}
 // Make admin panel append storage dashboard without breaking existing panel.
 const oldAdmin=window.adminPanel;window.adminPanel=async function(){const r=oldAdmin?await oldAdmin():null;try{const box=document.getElementById('app');if(box&&me()?.role==='admin'){const dash=await proofStorageDashboard();if(!box.innerHTML.includes('Proof Storage'))box.insertAdjacentHTML('beforeend',dash)}}catch(e){console.error(e)}return r};
 // Clean, non-floating authentication UI.
 window.renderAuth=function(mode){const login=mode==='login';document.getElementById('app').innerHTML=`<div class="auth-shell"><div class="auth-wrap"><div class="auth-brand"><div class="brand-logo">PC</div><h1 style="margin:10px 0 4px;font-size:25px">${login?'Welcome Back':'Create Account'}</h1><p class="muted" style="margin:0;font-size:12px">${login?'Sign in to continue to Palazo':'Register free and start earning'}</p></div><div class="auth-card"><div class="announce" style="margin-bottom:14px"><div class="announce-icon">✓</div><div><b>${login?'Secure Login':'Secure Registration'}</b><span>Your account and balances are protected.</span></div></div>${login?`<form onsubmit="event.preventDefault();login()"><div class="auth-field"><div class="fieldlabel">Username or Email</div><span class="auth-input-icon">👤</span><input id="loginUser" class="input auth-input" autocomplete="username" placeholder="Enter username or email" required></div><div class="auth-field"><div class="fieldlabel">Password</div><span class="auth-input-icon">🔒</span><input id="loginPass" class="input auth-input" type="password" autocomplete="current-password" placeholder="Enter your password" required></div><button type="submit" id="loginBtn" class="btn auth-btn">Login →</button></form><div class="center muted" style="margin-top:17px;font-size:11px">Don't have an account? <b style="color:#15945f;cursor:pointer" onclick="renderAuth('register')">Create one</b></div>`:`<form onsubmit="event.preventDefault();register()"><div class="auth-field"><div class="fieldlabel">Username</div><span class="auth-input-icon">👤</span><input id="regUser" class="input auth-input" placeholder="Choose a username" required></div><div class="auth-field"><div class="fieldlabel">Email Address</div><span class="auth-input-icon">✉</span><input id="regEmail" class="input auth-input" type="email" placeholder="name@example.com" required></div><div class="auth-field"><div class="fieldlabel">Phone Number</div><span class="auth-input-icon">☎</span><input id="regPhone" class="input auth-input" placeholder="08012345678" required></div><div class="auth-field"><div class="fieldlabel">Password</div><span class="auth-input-icon">🔒</span><input id="regPass" class="input auth-input" type="password" minlength="8" placeholder="At least 8 characters" required></div><div class="auth-field"><div class="fieldlabel">Referral Code <span class="muted">(Optional)</span></div><span class="auth-input-icon">♧</span><input id="regRef" class="input auth-input" placeholder="Enter referral code"></div><button type="submit" class="btn auth-btn">Create Account →</button></form><div class="center muted" style="margin-top:17px;font-size:11px">Already have an account? <b style="color:#15945f;cursor:pointer" onclick="renderAuth('login')">Login</b></div>`}</div></div></div>`};
})();
</script>

<script id="palazo-earnex-auth-exact-js">
(function(){
  const icon=(name)=>{
    const common='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    if(name==='user') return `<svg viewBox="0 0 24 24" ${common}><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.3 3.1-5 7-5s6.2 1.7 7 5"/></svg>`;
    if(name==='mail') return `<svg viewBox="0 0 24 24" ${common}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>`;
    if(name==='users') return `<svg viewBox="0 0 24 24" ${common}><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.4-4.5 5.5-4.5S13.9 16 14.5 19"/><circle cx="17" cy="9" r="2.4"/><path d="M15.3 15c2.8-.2 4.6 1.1 5.2 3.5"/></svg>`;
    if(name==='lock') return `<svg viewBox="0 0 24 24" ${common}><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
    if(name==='eye') return `<svg viewBox="0 0 24 24" ${common}><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>`;
    if(name==='eyeoff') return `<svg viewBox="0 0 24 24" ${common}><path d="M3 3l18 18"/><path d="M10.6 6.3A10.8 10.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7"/><path d="M6.2 6.2C3.8 7.9 2.5 12 2.5 12s3.4 6 9.5 6c1.3 0 2.5-.3 3.6-.8"/><path d="M9.8 9.8a3 3 0 0 0 4.4 4.4"/></svg>`;
    if(name==='arrow') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>`;
    if(name==='shield') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 20 5.7v5.7c0 5.1-3.2 8.7-8 10.6-4.8-1.9-8-5.5-8-10.6V5.7L12 2.5Z"/><path d="m8.4 12 2.2 2.2 5-5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return '';
  };

  const escA=(v)=>String(v??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const refCode=()=>{try{return typeof referralCodeFromUrl==='function'?referralCodeFromUrl():''}catch(e){return ''}};

  function strengthHtml(){
    return `<div class="pz-strength" id="pzStrength"><i></i><i></i><i></i><i></i></div><div class="pz-strength-text" id="pzStrengthText">Must be at least 6 characters</div>`;
  }

  function field(label, id, placeholder, ico, type='text', extra=''){
    return `<div class="pz-field"><label class="pz-field-label" for="${id}">${label}</label><div class="pz-input-wrap"><span class="pz-input-icon">${icon(ico)}</span><input id="${id}" class="pz-input" type="${type}" placeholder="${placeholder}" ${extra}></div></div>`;
  }
  function passField(id,placeholder,label){
    return `<div class="pz-field"><label class="pz-field-label" for="${id}">${label}</label><div class="pz-input-wrap"><span class="pz-input-icon">${icon('lock')}</span><input id="${id}" class="pz-input" type="password" placeholder="${placeholder}" autocomplete="${id==='loginPass'?'current-password':'new-password'}" required><button class="pz-eye" type="button" aria-label="Show password" onclick="window.pzTogglePass('${id}',this)">${icon('eye')}</button></div></div>`;
  }

  window.pzTogglePass=function(id,btn){
    const el=document.getElementById(id); if(!el)return;
    const show=el.type==='password'; el.type=show?'text':'password';
    btn.innerHTML=icon(show?'eyeoff':'eye'); btn.setAttribute('aria-label',show?'Hide password':'Show password');
  };

  window.pzUpdateStrength=function(){
    const p=document.getElementById('regPass'),bars=document.querySelectorAll('#pzStrength i'),t=document.getElementById('pzStrengthText');
    if(!p||!bars.length)return;
    const v=p.value||''; let score=0;
    if(v.length>=6)score++;
    if(v.length>=10)score++;
    if(/[A-Z]/.test(v)&&/[a-z]/.test(v))score++;
    if(/\d|[^A-Za-z]/.test(v))score++;
    bars.forEach((b,i)=>b.classList.toggle('on',i<score));
    if(!v||v.length<6)t.textContent='Must be at least 6 characters';
    else if(score<=1)t.textContent='Weak password';
    else if(score<=3)t.textContent='Good password';
    else t.textContent='Strong password';
  };

  window.pzForgotPassword=async function(){
    const value=window.prompt('Enter the email address linked to your Palazo account:');
    if(!value)return;
    const email=String(value).trim().toLowerCase();
    if(!email.includes('@'))return toast('Please enter a valid email address.');
    try{
      if(typeof sb!=='undefined' && sb?.auth?.resetPasswordForEmail){
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
        if(error)throw error;
        toast('Password reset email sent.');
      }else{
        toast('Password reset is currently unavailable. Please try again.');
      }
    }catch(e){console.error(e);toast(e?.message||'Could not send password reset email.');}
  };

  window.renderAuth=function(mode){
    const login=mode==='login';
    document.body.classList.add('palazo-auth-page');
    const ref=refCode();
    const app=document.getElementById('app');
    if(!app)return;

    const loginFields=`
      ${field('EMAIL OR USERNAME','loginUser','Enter email or username','user','text','autocomplete="username" required')}
      ${passField('loginPass','Enter your password','PASSWORD')}
      <button type="button" class="pz-forgot" onclick="pzForgotPassword()">Forgot Password?</button>
      <button type="submit" id="loginBtn" class="pz-submit">Login <span class="pz-submit-arrow">${icon('arrow')}</span></button>
      <div class="pz-divider"><span>OR</span></div>
      <div class="pz-switch">Don't have an account? <b onclick="renderAuth('register')">Create Account</b></div>
      <div class="pz-secure"><span class="pz-secure-icon">${icon('shield')}</span><div><b>Secure · Trusted · Reliable</b><span>Your security is our priority</span></div></div>`;

    const registerFields=`
      ${field('USERNAME','regUser','Choose a username','user','text','autocomplete="username" required pattern="[A-Za-z0-9_]+"')}
      <div class="pz-helper" style="margin-top:-17px;margin-bottom:27px">Only letters, numbers and underscores allowed.</div>
      ${field('EMAIL ADDRESS','regEmail','you@example.com','mail','email','autocomplete="email" required')}
      <div class="pz-field"><label class="pz-field-label" for="regRef">REFERRAL CODE (OPTIONAL)</label><div class="pz-input-wrap"><span class="pz-input-icon">${icon('users')}</span><input id="regRef" class="pz-input" placeholder="Referral code" value="${escA(ref)}" ${ref?'readonly':''}></div></div>
      ${passField('regPass','Create a password','PASSWORD')}
      ${strengthHtml()}
      <div class="pz-field" style="margin-top:27px">${passField('regPass2','Re-enter your password','CONFIRM PASSWORD')}</div>
      <input type="hidden" id="regPhone" value="">
      <button type="submit" class="pz-submit">Create Account <span class="pz-submit-arrow">${icon('arrow')}</span></button>
      <div class="pz-divider"><span>OR</span></div>
      <div class="pz-switch">Already have an account? <b onclick="renderAuth('login')">Login</b></div>`;

    app.innerHTML=`
      <div class="pz-auth">
        <section class="pz-auth-hero">
          <div class="pz-auth-brand">
            <div class="pz-auth-logo"><img src="${typeof PALAZZO_LOGO!=='undefined'?PALAZZO_LOGO:''}" alt="Palazo logo"></div>
            <h1>Palazo</h1>
            <p class="pz-auth-tagline">EARN SMART. EARN DAILY.</p>
          </div>
        </section>
        <section class="pz-auth-card">
          <div class="pz-auth-inner">
            <h2 class="pz-auth-heading">${login?'Welcome Back!':'Create Account'}</h2>
            <p class="pz-auth-sub">${login?'Login to your Palazo account and continue earning.':'Join Palazo today and start your earning journey.'}</p>
            <form id="${login?'loginForm':'registerForm'}" onsubmit="event.preventDefault();${login?'login()':'pzRegisterExact()'}">
              ${login?loginFields:registerFields}
            </form>
          </div>
        </section>
      </div>`;

    if(!login){
      const pass=document.getElementById('regPass');
      if(pass)pass.addEventListener('input',window.pzUpdateStrength);
    }
  };

  /* Registration keeps the existing Supabase/local profile behavior, while
     matching the reference form (phone is intentionally not shown). */
  window.pzRegisterExact=async function(){
    const username=document.getElementById('regUser')?.value.trim().replace(/\s+/g,'_');
    const email=document.getElementById('regEmail')?.value.trim().toLowerCase();
    const password=document.getElementById('regPass')?.value||'';
    const confirm=document.getElementById('regPass2')?.value||'';
    const ref=document.getElementById('regRef')?.value.trim()||refCode();
    if(!username||username.length<3)return toast('Choose a username with at least 3 characters.');
    if(!/^[A-Za-z0-9_]+$/.test(username))return toast('Username can only contain letters, numbers and underscores.');
    if(!email)return toast('Enter your email address.');
    if(password.length<6)return toast('Password must be at least 6 characters.');
    if(password!==confirm)return toast('Passwords do not match.');
    const btn=document.querySelector('#registerForm .pz-submit');
    if(btn){btn.disabled=true;btn.textContent='Creating Account…';}
    try{
      if(typeof sb!=='undefined' && sb?.auth?.signUp){
        const {data:existing}=await sb.rpc('get_login_email',{identifier:username});
        if(existing)return toast('Username already exists.');
        const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,phone:'',referral_code:ref}}});
        if(error)throw error;
        try{localStorage.removeItem('palazo_referral_code')}catch(e){}
        if(data?.session){
          try{await loadCurrentProfile();if(me()?.role==='admin')await seedInitialTasksIfNeeded();await loadCloudData();}catch(e){}
          try{await sb.auth.signOut()}catch(e){}
        }
        toast('Registration successful. Please login.');
        setTimeout(()=>renderAuth('login'),500);
      }else if(typeof users!=='undefined'){
        if(users.some(u=>String(u.username).toLowerCase()===username.toLowerCase()))return toast('Username already exists.');
        const u=ensureUser({username,email,phone:'',password,referralCode:username.toUpperCase(),referrerCode:ref});
        let parent=null;
        if(ref)parent=users.find(x=>String(x.referralCode||x.username).toLowerCase()===ref.toLowerCase()||String(x.username).toLowerCase()===ref.toLowerCase());
        if(parent&&String(parent.username).toLowerCase()!==String(username).toLowerCase()){u.referrerUsername=parent.username;parent.referrals=Number(parent.referrals||0)+1;}
        users.push(u);save('palazo_users',users);save('palazo_config',cfg);
        try{localStorage.removeItem('palazo_referral_code')}catch(e){}
        session=null;saveSession(null);toast('Registration successful. Please login.');
        setTimeout(()=>renderAuth('login'),500);
      }else{
        toast('Registration is unavailable. Please reload the page.');
      }
    }catch(e){
      console.error(e);
      toast(e?.message||'Registration failed. Please try again.');
    }finally{
      const b=document.querySelector('#registerForm .pz-submit');
      if(b){b.disabled=false;b.innerHTML=`Create Account <span class="pz-submit-arrow">${icon('arrow')}</span>`;}
    }
  };

  /* Make login button text/icon restore correctly after the existing login()
     implementation changes it to a plain text loading state. */
  const oldLogin=window.login;
  window.login=async function(){
    try{
      return await oldLogin.apply(this,arguments);
    }finally{
      const b=document.getElementById('loginBtn');
      if(b)b.innerHTML=`Login <span class="pz-submit-arrow">${icon('arrow')}</span>`;
    }
  };

  /* Re-render auth if an older startup wrapper calls renderAuth later. */
  const oldRenderApp=window.renderApp;
  window.__palazoAuthRenderApp=oldRenderApp;

  /* Repaint the initial screen after the original startup has rendered. */
  try{
    if(!session || !me()){
      window.renderAuth(refCode() ? 'register' : 'login');
    }
  }catch(e){ console.error('Palazo auth repaint failed:',e); }
})();
</script>

<script id="palazo-no-storage-proof-final">
(function(){
  /* Final proof handler: screenshots are compressed in-browser and saved as
     data:image JPEG inside the user's profile record. No Supabase Storage upload
     is required for task, deposit, or asset-deposit submissions. */
  function compressProofImage(file){
    return new Promise((resolve,reject)=>{
      if(!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('Please upload an image screenshot'));
      const reader=new FileReader();
      reader.onerror=()=>reject(reader.error||new Error('Could not read screenshot'));
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=1280;
          const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
          const c=document.createElement('canvas');
          c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
          c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
          const ctx=c.getContext('2d',{alpha:false});
          if(!ctx) return reject(new Error('Image processing unavailable'));
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
          c.toDataURL('image/jpeg',0.68) && resolve(c.toDataURL('image/jpeg',0.68));
        };
        img.onerror=()=>reject(new Error('Invalid image'));
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  async function proofData(file){
    const data=await compressProofImage(file);
    /* Keep profile JSON reasonably small. */
    if(data.length>2.8*1024*1024) throw new Error('Screenshot is too large after compression. Please use a clearer/cropped screenshot.');
    return data;
  }
  function saveLocalAndCloud(u){
    try{ if(typeof persistUser==='function') return persistUser(u); }
    catch(e){ console.error('proof save failed',e); }
    try{ users=users.map(x=>x.username===u.username?u:x); save('palazo_users',users); }catch(e){ console.error(e); }
  }

  window.submitTask=async function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id));
    const u=me();
    if(!t)return toast('Task not found');
    if(!u)return renderAuth('login');
    u.taskStarted=u.taskStarted||{};
    if(!u.taskStarted[t.id])return toast('Click Start Task first');
    const old=typeof taskStatus==='function'?taskStatus(u,id):null;
    if(old&&old.status!=='rejected')return toast('This task is already '+old.status);
    const file=document.getElementById('taskFile')?.files?.[0];
    if(!file)return toast('Upload your task screenshot');
    if(!file.type.startsWith('image/'))return toast('Please upload an image screenshot');
    if(file.size>10*1024*1024)return toast('Screenshot is too large. Please use an image under 10 MB.');
    const btn=document.querySelector('.task-submit-btn,.task-step-card .green-btn');
    if(btn){btn.disabled=true;btn.dataset.oldText=btn.textContent;btn.textContent='Saving Screenshot…';}
    try{
      const proof=await proofData(file);
      const sub={id:'sub_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),fileName:file.name,note:String(document.getElementById('taskNote')?.value||'').trim(),status:'pending',date:now(),startedDate:u.taskStarted[t.id],proof:proof,proof_path:''};
      u.taskSubmissions=u.taskSubmissions||[];
      if(old&&old.status==='rejected')u.taskSubmissions=u.taskSubmissions.filter(x=>String(x.id)!==String(old.id));
      u.taskSubmissions.unshift(sub);
      u.transactions=u.transactions||[];

  window.submitAssetDeposit=async function(n){

      u.assetDeposits=u.assetDeposits||[];u.assetDeposits.unshift(d);
      u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:'Asset Deposit Request',amount:Number(n),balance:'Asset Balance',status:'pending',date:now()});
      addNotification(u,'Asset Deposit submitted','Your '+money(n)+' Asset Deposit is pending admin review.','pending');
      await saveLocalAndCloud(u);closeModal();go('deposit');toast('Asset deposit submitted for admin review');

<script id="palazo-final-transaction-task-notification-fix">
(function(){
  const escSafe=(v)=>typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const moneySafe=(v)=>typeof money==='function'?money(v):('₦'+Number(v||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}));
  const statusLabel=s=>String(s||'pending').toLowerCase()==='rejected'?'DECLINED':String(s||'pending').toUpperCase();
  const statusClass=s=>String(s||'pending').toLowerCase();

  /* Make task start state reliable even if an older version of the page was used. */
  window.startTask=function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id));
    const u=me();
    if(!t)return toast('Task not found');
    if(!u)return renderAuth('login');
    const old=typeof taskStatus==='function'?taskStatus(u,id):null;
    if(old&&old.status!=='rejected')return toast('This task is already '+old.status);
    u.taskStarted=u.taskStarted||{};
    u.taskStarted[t.id]=now();
    try{persistUser(u)}catch(e){try{users=users.map(x=>x.username===u.username?u:x);save('palazo_users',users)}catch(_) {}}
    currentTaskId=t.id;currentTab='tasks';
    try{renderApp()}catch(e){}
    if(t.link){try{window.open(t.link,'_blank','noopener,noreferrer')}catch(e){try{window.location.href=t.link}catch(_){}}}
    toast('Task started. Complete it, then upload your screenshot.');
  };

  /* Final task page: clicking the task/start flow always unlocks submission. */
  window.tasksPage=function(u){
    const list=Array.isArray(cfg.tasks)?cfg.tasks:[];
    if(currentTaskId){
      const t=list.find(x=>String(x.id)===String(currentTaskId));
      if(!t){currentTaskId=null;return window.tasksPage(u)}
      const sub=typeof taskStatus==='function'?taskStatus(u,t.id):null;
      const started=!!(u.taskStarted&&u.taskStarted[t.id]);
      const left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));
      if(sub){
        return `<h2 class="title">Task Details</h2><p class="subtitle">Your submission is being reviewed by admin.</p><div class="card status-card"><div class="section-head"><h2>${escSafe(t.app)} · ${escSafe(t.category)}</h2><span class="pill ${escSafe(statusClass(sub.status))}">${escSafe(statusLabel(sub.status))}</span></div><div class="row"><span>Reward</span><b>${moneySafe(sub.reward||t.reward||0)}</b></div><div class="row"><span>Submitted</span><b>${escSafe(sub.date||'')}</b></div>${sub.status==='rejected'?`<button class="btn secondary" onclick="currentTaskId='${escSafe(t.id)}';renderApp()">Review & Resubmit</button>`:''}</div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
      }
      return `<h2 class="title">Task Details</h2><p class="subtitle">Complete the task and submit your screenshot proof.</p>
      <div class="card task-detail-card"><div class="task-detail-head"><div>${typeof platformBadge==='function'?platformBadge(t.app):''}<div><h2>${escSafe(t.app)} · ${escSafe(t.category)}</h2><small>${left} slots left</small></div></div><div class="task-reward-big">${moneySafe(t.reward)}<small>reward</small></div></div><div class="detail-section" style="margin-top:14px"><h3>Instructions</h3><p>${escSafe(t.description||'Complete this task and upload a screenshot as proof.')}</p></div></div>
      <div class="card task-step-card"><div class="step-heading"><span class="step-number">1</span><div><h2>Start the task</h2><p>Open the target link before submitting your proof.</p></div></div><button class="btn ${started?'secondary':''}" onclick="startTask('${escSafe(t.id)}')">${started?'✓ Task Started — Open Link Again':'▶ Start Task'}</button></div>
      <div class="card task-step-card"><div class="step-heading"><span class="step-number">2</span><div><h2>Submit screenshot proof</h2><p>${started?'Upload a clear screenshot showing you completed the task.':'You can also start from here if the start state was lost.'}</p></div></div><div class="fieldlabel">Task screenshot</div><input id="taskFile" class="input" type="file" accept="image/*"><div class="fieldlabel" style="margin-top:12px">Additional note <span class="muted">(optional)</span></div><textarea id="taskNote" class="textarea" maxlength="300" placeholder="Anything the admin should know..."></textarea><button class="btn green-btn" onclick="submitTask('${escSafe(t.id)}')">✓ Submit Screenshot</button></div><button class="btn secondary" onclick="currentTaskId=null;renderApp()">← Back to Tasks</button>`;
    }
    return `<h2 class="title">Tasks</h2><p class="subtitle">Choose a task, start it, then submit screenshot proof.</p>${list.length?list.map(t=>{const sub=typeof taskStatus==='function'?taskStatus(u,t.id):null;const pct=Math.min(100,Math.round(Number(t.completed||0)/Math.max(1,Number(t.slots||1))*100));return `<div class="card task-list-card" onclick="openTaskDetail('${escSafe(t.id)}')" role="button" tabindex="0"><div style="display:flex;justify-content:space-between;gap:10px"><div>${typeof platformBadge==='function'?platformBadge(t.app):''} <b>${escSafe(t.app)} · ${escSafe(t.category)}</b></div>${sub?`<span class="pill ${escSafe(statusClass(sub.status))}">${escSafe(statusLabel(sub.status))}</span>`:''}</div><p class="muted" style="font-size:10px;line-height:1.5">${escSafe(t.description||'Complete this task and submit a screenshot as proof.')}</p><div style="display:flex;justify-content:space-between"><b>${moneySafe(t.reward)}</b><small>${Number(t.completed||0)} / ${Number(t.slots||0)} slots</small></div><div class="progress"><i style="width:${pct}%"></i></div><button class="btn" type="button" onclick="event.stopPropagation();openTaskDetail('${escSafe(t.id)}')">View Task →</button></div>`}).join(''):'<div class="card empty">No tasks are available right now.</div>'}<div class="card"><div class="section-head"><h2>My Submissions</h2><span class="pill">${(u.taskSubmissions||[]).length}</span></div>${(u.taskSubmissions||[]).slice(0,10).map(s=>`<div class="row"><div><b>${escSafe(s.app)} · ${escSafe(s.category)}</b><div class="muted" style="font-size:9px">${escSafe(s.date||'')}</div></div><span class="pill ${escSafe(statusClass(s.status))}">${escSafe(statusLabel(s.status))}</span></div>`).join('')||'<div class="empty">No task submissions yet.</div>'}</div>`;
  };

  /* Screenshot submission never uses Supabase Storage and never blocks on taskStarted. */
  window.submitTask=async function(id){
    const t=(cfg.tasks||[]).find(x=>String(x.id)===String(id));
    const u=me();
    if(!t)return toast('Task not found');
    if(!u)return renderAuth('login');
    u.taskStarted=u.taskStarted||{};
    if(!u.taskStarted[t.id]){u.taskStarted[t.id]=now();try{persistUser(u)}catch(e){}}
    const old=typeof taskStatus==='function'?taskStatus(u,id):null;
    if(old&&old.status!=='rejected')return toast('This task is already '+old.status);
    const file=document.getElementById('taskFile')?.files?.[0];
    if(!file)return toast('Upload your task screenshot');
    if(!String(file.type||'').startsWith('image/'))return toast('Please upload an image screenshot');
    if(file.size>10*1024*1024)return toast('Screenshot is too large. Please use an image under 10 MB.');
    try{
      const proof=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read screenshot'));r.readAsDataURL(file)});
      const sub={id:'sub_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),accountValue:'Screenshot proof',fileName:file.name,note:String(document.getElementById('taskNote')?.value||'').trim(),status:'pending',date:now(),startedDate:u.taskStarted[t.id],proof:proof,proof_path:''};
      u.taskSubmissions=u.taskSubmissions||[];
      if(old&&old.status==='rejected')u.taskSubmissions=u.taskSubmissions.filter(x=>String(x.id)!==String(old.id));
      u.taskSubmissions.unshift(sub);
      u.transactions=u.transactions||[];
      u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Submission',amount:0,balance:'Task Balance',status:'pending',date:now(),taskId:t.id});
      if(typeof addNotification==='function')addNotification(u,'Task Submitted','Your '+t.category+' screenshot is pending admin review.','pending');
      try{persistUser(u)}catch(e){users=users.map(x=>x.username===u.username?u:x);save('palazo_users',users)}
      currentTaskId=null;currentTab='tasks';renderApp();toast('Screenshot submitted — waiting for admin review');
    }catch(e){console.error(e);toast(e.message||'Could not save screenshot. Please try again.')}
  };

  /* Admin task decisions update the same transaction record and notify the user. */
  window.approveTask=function(username,id){
    const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id),t=(cfg.tasks||[]).find(x=>String(x.id)===String(s?.taskId));
    if(!u||!s||s.status!=='pending')return toast('This submission is no longer pending');
    if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast('This task has no slots left');
    const reward=Number(s.reward||0);s.status='approved';s.approvedDate=now();u.earning=Number(u.earning||0)+reward;u.transactions=u.transactions||[];
    if(!updateRequestTransaction(u,s.id,'approved',reward,'Task Approved'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Approved',amount:reward,balance:'Task Balance',status:'approved',date:now()});
    if(typeof addNotification==='function')addNotification(u,'Task Approved','Your '+s.category+' task was approved and '+moneySafe(reward)+' was added to Task Balance.','approved');
    if(t)t.completed=Number(t.completed||0)+1;
    try{persistUser(u)}catch(e){users=users.map(x=>x.username===u.username?u:x);save('palazo_users',users)}
    try{save('palazo_config',cfg)}catch(e){}
    toast('Task approved — reward credited');adminPanel();
  };
  window.rejectTask=function(username,id){
    const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id);
    if(!u||!s||s.status!=='pending')return toast('This submission is no longer pending');
    s.status='rejected';s.rejectedDate=now();u.transactions=u.transactions||[];
    if(!updateRequestTransaction(u,s.id,'rejected',0,'Task Declined'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Declined',amount:0,balance:'Task Balance',status:'rejected',date:now()});
    if(typeof addNotification==='function')addNotification(u,'Task Declined','Your '+s.category+' task submission was declined by admin. You may review and resubmit it.','rejected');
    try{persistUser(u)}catch(e){users=users.map(x=>x.username===u.username?u:x);save('palazo_users',users)}
    toast('Task declined — status updated');adminPanel();
  };

  /* Dedicated transaction history page. */
  window.transactionHistoryPage=function(u){
    const all=Array.isArray(u.transactions)?u.transactions:[];
    const filter=window.__txFilter||'all';
    const kinds=[['all','All'],['deposit','Deposits'],['withdrawal','Withdrawals'],['task','Tasks'],['income','Income'],['referral','Referral'],['other','Other']];
    const rows=filter==='all'?all:all.filter(x=>typeof historyKind==='function'?historyKind(x)===filter:false);
    const approved=all.filter(x=>String(x.status).toLowerCase()==='approved').length,pending=all.filter(x=>String(x.status).toLowerCase()==='pending').length,declined=all.filter(x=>String(x.status).toLowerCase()==='rejected').length;
    return `<div class="transaction-page"><h2 class="title">Transaction History</h2><p class="subtitle">Every deposit, withdrawal, task and reward with its latest status.</p><div class="transaction-summary"><div class="mini"><b>${approved}</b><small>APPROVED</small></div><div class="mini"><b>${pending}</b><small>PENDING</small></div><div class="mini"><b>${declined}</b><small>DECLINED</small></div></div><div class="card"><div class="tx-filter">${kinds.map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="window.__txFilter='${k}';renderApp()">${l}</button>`).join('')}</div>${rows.length?rows.slice(0,150).map(t=>{const amt=Number(t.amount||0),st=String(t.status||'approved').toLowerCase();return `<div class="tx-card"><div><b>${escSafe(t.type||'Transaction')}</b><div class="tx-meta">${escSafe(t.balance||'Balance')} · ${escSafe(t.date||'')}</div></div><div><div class="tx-amount" style="color:${amt<0?'#d93030':'#129669'}">${amt<0?'-':amt>0?'+':''}${moneySafe(Math.abs(amt))}</div><div class="tx-status"><span class="pill ${escSafe(statusClass(st))}">${escSafe(statusLabel(st))}</span></div></div></div>`}).join(''):'<div class="empty">No transactions in this category yet.</div>'}</div></div>`;
  };

  /* showHistory now navigates to a real page, never a modal. */
  window.showHistory=function(){window.__txFilter='all';currentTab='history';renderApp();window.scrollTo({top:0,behavior:'smooth'})};

  /* Stronger upper-right notification counter. */
  window.header=function(){
    const u=me(),un=typeof pzUnread==='function'?pzUnread(u):(u?.notifications||[]).filter(n=>!n.read).length;
    const avatar=u?.avatar?`<img src="${escSafe(u.avatar)}" alt="Profile">`:`<span>P</span>`;
    return `<header class="topbar"><div class="brand logo-tap" onclick="tapAdmin()"><div class="brand-logo top-profile-logo">${avatar}</div><div><b>Palazo Cash</b><small>${typeof screenTitle==='function'?screenTitle(currentTab):'Palazo'} · @${escSafe(u?.username||'')}</small></div></div><div class="top-actions"><button class="circle notify" aria-label="Notifications" onclick="go('notifications');setTimeout(()=>{if(typeof pzMarkNotificationsRead==='function')pzMarkNotificationsRead()},120)">${typeof PZ!=='undefined'?PZ.icon('bell',19):'🔔'}${un?`<span class="notify-badge">${un>99?'99+':un}</span>`:''}</button><button class="circle" aria-label="Open menu" onclick="pzOpenDrawer()">${typeof PZ!=='undefined'?PZ.icon('menu',19):'☰'}</button></div></header>`;
  };

  /* Final renderer adds the history page. */
  const oldRender=window.renderApp;
  window.renderApp=function(){
    const u=me();if(!u)return renderAuth('login');
    if(currentTab==='history'){
      document.getElementById('app').innerHTML=header()+`<main>${transactionHistoryPage(u)}</main>`+bottom()+pzDrawerHTML();
      return;
    }
    return oldRender();
  };
  window.pzMenuGo=function(id){if(typeof pzCloseDrawer==='function')pzCloseDrawer();if(id==='history')return showHistory();if(id==='notifications')return go('notifications');if(id==='bank')return addBankModal();if(id==='campaigns')return showMyAds();if(id==='place')return placeAds();if(id==='spin')return pzSpinModal();if(id==='logout')return logout();if(id==='wallet')return go('wallet');if(id==='deposit')return go('deposit');if(id==='withdraw')return go('withdraw');if(id==='airtime')return go('airtime');return go(id)};

  /* Normalize old transaction records so every status is visible in the new page. */
  try{users.forEach(u=>{u.transactions=Array.isArray(u.transactions)?u.transactions:[];u.notifications=Array.isArray(u.notifications)?u.notifications:[];u.taskStarted=(u.taskStarted&&typeof u.taskStarted==='object')?u.taskStarted:{};});}catch(e){}
})();
</script>

<style id="palazo-smooth-polish">
/* =========================================================
   PALAZO CASH — SMOOTH + POLISHED UI
   Visual-only/performance layer: keeps existing functionality intact.
   ========================================================= */
:root{
  --pal-green:#00A651;
  --pal-green-dark:#008c45;
  --pal-green-soft:#e9f9f1;
  --pal-ink:#132238;
  --pal-muted:#718096;
  --pal-line:#e7edf0;
  --pal-shadow:0 8px 26px rgba(15,35,55,.065);
  --pal-shadow-hover:0 12px 32px rgba(15,35,55,.10);
}
html{scroll-behavior:auto!important;-webkit-text-size-adjust:100%}
body{overflow-x:hidden;background:#f7faf9;overscroll-behavior-x:none}
/* Remove the two continuously animated decorative blobs: they cause needless mobile repaints. */
body:before,body:after{animation:none!important;opacity:.55}
/* Keep navigation and cards responsive without expensive blur/filter work. */
.topbar{background:rgba(255,255,255,.98)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:0 1px 0 rgba(20,40,60,.03)}
.bottom{background:rgba(255,255,255,.98)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:0 -5px 22px rgba(15,35,55,.055)}
.card,.action,.modal-box,.tx-card,.transaction-summary .mini{box-shadow:var(--pal-shadow);transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.card{border-color:#e8edef}
.action:hover,.card:hover{box-shadow:var(--pal-shadow-hover)}
.action:active,.btn:active,.nav-btn:active,.circle:active,.icon-btn:active,.pz-menu-btn:active,.tx-filter button:active{transform:scale(.975)!important}
.circle{position:relative;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.circle:hover{border-color:#cfe9dc;box-shadow:0 5px 16px rgba(0,166,81,.10)}
/* Palazo green identity */
.brand-logo{background:linear-gradient(135deg,#008f49,#00b85a)!important;box-shadow:0 7px 18px rgba(0,166,81,.20)!important}
.hero{background:linear-gradient(135deg,#007d3f 0%,#00A651 52%,#20c66d 100%)!important}
.btn:not(.secondary):not(.danger){background:linear-gradient(135deg,#00964a,#00b85a)!important;box-shadow:0 8px 18px rgba(0,166,81,.16)!important}
.btn.green-btn{background:linear-gradient(135deg,#008f49,#20c66d)!important}
.nav-btn.active{color:var(--pal-green)!important}
.nav-dot{background:var(--pal-green)!important}
.input:focus,.select:focus,.textarea:focus{border-color:#58c58a!important;box-shadow:0 0 0 3px rgba(0,166,81,.09)!important}
.pill.approved,.pill.paid{background:#e8f8f0!important;color:#008f49!important}
.tx-filter button.active{background:var(--pal-green)!important}
.notify-badge{background:#e53935!important}
/* Cleaner task/history cards */
.tx-card{border-radius:18px!important;padding:13px!important}
.tx-card:hover{transform:translateY(-1px)}
.transaction-summary .mini{border-radius:17px!important}
.transaction-summary .mini:first-child{background:linear-gradient(180deg,#f2fbf6,#fff)}
/* Better touch targets on phones */
button,.nav-btn,.action,.pz-menu-btn{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
/* Avoid accidental selection during rapid navigation */
.nav-btn,.circle,.action,.pz-menu-btn,.tx-filter button{user-select:none;-webkit-user-select:none}
/* Page entrance: very short, subtle and GPU-friendly. */
main{animation:palazoPageIn .12s ease-out both;will-change:opacity,transform}
@keyframes palazoPageIn{from{opacity:.72;transform:translateY(3px)}to{opacity:1;transform:none}}
/* Give the main content a stable rendering boundary. */
main{contain:layout style}
/* Make mobile text and cards breathe better without changing the layout structure. */

<script id="palazo-instant-navigation-polish">
(function(){
  /* Make navigation feel immediate: render first, then perform non-essential scrolling. */
  const originalGo=window.go;
  if(typeof originalGo==='function'){
    window.go=function(tab){
      currentTab=tab;
      try{renderApp()}catch(e){console.error(e)}
      requestAnimationFrame(function(){window.scrollTo(0,0)});
      if(tab==='home')setTimeout(function(){try{showCommunityPopup()}catch(e){}},120);
    };
  }
  /* Instant visual feedback for every tappable control, without waiting for a page repaint. */
  document.addEventListener('pointerdown',function(e){
    const el=e.target.closest('button,.action,.nav-btn,.pz-menu-btn,.circle,.tx-filter button');
    if(el && !el.disabled) el.classList.add('palazo-pressed');
  },{passive:true});
  document.addEventListener('pointerup',function(){
    document.querySelectorAll('.palazo-pressed').forEach(x=>x.classList.remove('palazo-pressed'));
  },{passive:true});
  document.addEventListener('pointercancel',function(){
    document.querySelectorAll('.palazo-pressed').forEach(x=>x.classList.remove('palazo-pressed'));
  },{passive:true});
  /* Prevent browser double-tap zoom from making the UI feel laggy on controls. */
  const st=document.createElement('style');
  st.textContent='.palazo-pressed{transform:scale(.975)!important;filter:brightness(.985)}';
  document.head.appendChild(st);
})();
</script>

<script>
(function(){

  window.syncApprovedTaskCounts=function(){

        const current=Number(t.completed||0);
        if(approved>current){t.completed=approved;changed=true;}
        if(Number(t.completed||0)>Number(t.slots||0)){t.completed=Number(t.slots||0);changed=true;}
      });
      if(changed){try{save('palazo_config',cfg)}catch(e){}}
    }catch(e){console.warn('slot sync skipped',e)}
