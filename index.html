<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prime Vest</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-100">
<div id="root"></div>

<script type="text/babel">

const { useState } = React;

/* PACKAGES */
const packages = [
 {id:1,name:"Package 1",price:1500,daily:450,duration:100},
 {id:2,name:"Package 2",price:3000,daily:750,duration:100},
 {id:3,name:"Package 3",price:5000,daily:1200,duration:100},
 {id:4,name:"Package 4",price:10000,daily:2200,duration:100},
 {id:5,name:"Package 5",price:15000,daily:3400,duration:100},
 {id:6,name:"Package 6",price:20000,daily:4200,duration:100},
 {id:7,name:"Package 7",price:50000,daily:5500,duration:100}
];

function App(){

const [page,setPage] = useState("register");
const [users,setUsers] = useState(JSON.parse(localStorage.getItem("users")||"[]"));
const [user,setUser] = useState(null);
const [investments,setInvestments] = useState(JSON.parse(localStorage.getItem("investments")||"[]"));

/* UPDATE USER */
function updateUser(u){
  const updated = users.map(x=>x.username===u.username?u:x);
  setUsers(updated);
  localStorage.setItem("users",JSON.stringify(updated));
  setUser({...u});
}

/* REGISTER */
function register(username,phone,password){
  if(users.find(u=>u.username===username)){
    alert("User exists");
    return;
  }

  const newUser={
    username,
    phone,
    password,
    balance:500, // welcome bonus
    lastBonus:0,
    bonusLocked:500,
    hasDeposited:false
  };

  const all=[...users,newUser];
  setUsers(all);
  localStorage.setItem("users",JSON.stringify(all));

  alert("Registered successfully! Login now");
  setPage("login");
}

/* LOGIN */
function login(username,password){
  const u=users.find(x=>x.username===username && x.password===password);
  if(!u) return alert("Invalid login");

  setUser(u);
  setPage("home");

  setTimeout(showPopup,500);
}

/* POPUP */
function showPopup(){
  const pop=document.createElement("div");
  pop.style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999";

  pop.innerHTML=`
  <div style="background:#fff;padding:20px;border-radius:10px;text-align:center;width:90%;max-width:300px;">
    <h3>Welcome 👋</h3>
    <p>🎁 Daily Bonus: ₦100</p>
    <p>🎉 Welcome Bonus: ₦500</p>

    <button id="tgBtn" style="background:#0088cc;color:#fff;padding:10px;width:100%;border:none;border-radius:5px;margin-top:10px;">
      Join our Telegram
    </button>

    <button id="closeBtn" style="margin-top:10px;padding:8px;width:100%;">
      Continue
    </button>
  </div>
  `;

  document.body.appendChild(pop);

  document.getElementById("tgBtn").onclick=()=>{
    window.open("https://t.me/+-9f-M7aXoOBiOTRk","_blank");
  };

  document.getElementById("closeBtn").onclick=()=>{
    pop.remove();
  };
}

/* DAILY BONUS */
function claimBonus(){
  if(Date.now()-user.lastBonus<86400000){
    alert("Come back tomorrow");
    return;
  }
  user.balance+=100;
  user.lastBonus=Date.now();
  updateUser(user);
}

/* BUY PACKAGE */
function buyPack(p){
  if(user.balance<p.price) return alert("Insufficient balance");

  user.balance-=p.price;

  const inv={
    user:user.username,
    name:p.name,
    daily:p.daily,
    duration:p.duration,
    start:Date.now()
  };

  const all=[...investments,inv];
  setInvestments(all);
  localStorage.setItem("investments",JSON.stringify(all));

  updateUser(user);
}

/* CALC EARN */
function calc(inv){
  const days=Math.floor((Date.now()-inv.start)/86400000);
  return Math.min(days,inv.duration)*inv.daily;
}

/* DEPOSIT */
function deposit(amount){
  user.balance+=Number(amount);
  user.hasDeposited=true;
  user.bonusLocked=0;
  updateUser(user);
  alert("Deposit successful");
}

/* WITHDRAW */
function withdraw(amount){
  if(user.balance<amount) return alert("Insufficient");

  if(user.bonusLocked>0 && !user.hasDeposited){
    alert("Deposit required before withdrawing bonus");
    return;
  }

  user.balance-=amount;
  updateUser(user);
  alert("Withdrawal successful");
}

/* UI */
return(
<div className="max-w-md mx-auto p-4">

{/* REGISTER */}
{page==="register" && (
<div>
<h2 className="text-xl font-bold">Register</h2>
<input id="ru" placeholder="Username" className="border p-2 w-full mt-2"/>
<input id="rph" placeholder="Phone Number" className="border p-2 w-full mt-2"/>
<input id="rp" type="password" placeholder="Password" className="border p-2 w-full mt-2"/>
<button onClick={()=>register(ru.value,rph.value,rp.value)} className="bg-green-500 text-white p-2 w-full mt-2">Register</button>
<p onClick={()=>setPage("login")} className="text-blue-500 mt-2">Login</p>
</div>
)}

{/* LOGIN */}
{page==="login" && (
<div>
<h2 className="text-xl font-bold">Login</h2>
<input id="lu" placeholder="Username" className="border p-2 w-full mt-2"/>
<input id="lp" type="password" placeholder="Password" className="border p-2 w-full mt-2"/>
<button onClick={()=>login(lu.value,lp.value)} className="bg-blue-500 text-white p-2 w-full mt-2">Login</button>
</div>
)}

{/* HOME */}
{user && page==="home" && (
<div>
<h2 className="text-xl font-bold">₦{user.balance}</h2>

<button onClick={claimBonus} className="bg-yellow-500 p-2 w-full mt-2">
Daily Bonus ₦100
</button>

<div className="grid grid-cols-3 gap-2 mt-4">
<button onClick={()=>setPage("invest")} className="bg-blue-500 text-white p-2">Invest</button>
<button onClick={()=>setPage("deposit")} className="bg-green-500 text-white p-2">Deposit</button>
<button onClick={()=>setPage("withdraw")} className="bg-red-500 text-white p-2">Withdraw</button>
<button onClick={()=>setPage("products")} className="bg-purple-500 text-white p-2">Products</button>
</div>
</div>
)}

{/* INVEST */}
{page==="invest" && (
<div>
<h2>Packages</h2>
{packages.map(p=>(
<div key={p.id} className="border p-2 mt-2">
<p>{p.name}</p>
<p>₦{p.price}</p>
<p>₦{p.daily}/day</p>
<button onClick={()=>buyPack(p)} className="bg-blue-500 text-white p-1">Buy</button>
</div>
))}
<button onClick={()=>setPage("home")}>Back</button>
</div>
)}

{/* PRODUCTS */}
{page==="products" && (
<div>
<h2>My Products</h2>
{investments.filter(i=>i.user===user.username).map((i,index)=>(
<div key={index} className="border p-2 mt-2">
<p>{i.name}</p>
<p>Earned: ₦{calc(i)}</p>
</div>
))}
<button onClick={()=>setPage("home")}>Back</button>
</div>
)}

{/* DEPOSIT */}
{page==="deposit" && (
<div>
<h2>Deposit</h2>
<p>Kuda Bank</p>
<p>Adesewa Adebanjo</p>
<p>2079026767</p>
<input id="dep" placeholder="Amount" className="border p-2 w-full mt-2"/>
<button onClick={()=>deposit(dep.value)} className="bg-green-500 text-white p-2 w-full mt-2">Submit</button>
<button onClick={()=>setPage("home")}>Back</button>
</div>
)}

{/* WITHDRAW */}
{page==="withdraw" && (
<div>
<h2>Withdraw</h2>
<input id="wd" placeholder="Amount" className="border p-2 w-full mt-2"/>
<button onClick={()=>withdraw(wd.value)} className="bg-red-500 text-white p-2 w-full mt-2">Withdraw</button>
<button onClick={()=>setPage("home")}>Back</button>
</div>
)}

</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
