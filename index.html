<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EarnHub Referral Upgrade</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div><script type="text/babel">
const { useState, useEffect } = React;

const createSupabase = (url, key) => ({
  get: async (table, query='') => {
    const res = await fetch(`${url}/rest/v1/${table}?${query}`, {
      headers: { apikey: key, Authorization: `Bearer ${key}` }
    });
    return res.ok ? await res.json() : [];
  },
  upsert: async (table, data) => {
    return fetch(`${url}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify(data)
    });
  },
  update: async (table, data, query) => {
    return fetch(`${url}/rest/v1/${table}?${query}`, {
      method: 'PATCH',
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });
  }
});

const App = () => {
  const [sb, setSb] = useState(null);
  const [user, setUser] = useState(null);
  const [config, setConfig] = useState({ referralReward: 1 });

  const uid = localStorage.getItem("uid") || "u_" + Math.random().toString(36).substring(2);
  localStorage.setItem("uid", uid);

  const getReferrer = () => {
    const params = new URLSearchParams(window.location.search);
    return params.get("ref");
  };

  useEffect(() => {
    const init = async () => {
      const url = localStorage.getItem("sb_url");
      const key = localStorage.getItem("sb_key");
      if (!url || !key) return;

      const client = createSupabase(url, key);
      setSb(client);

      const usrRes = await client.get('users', `uid=eq.${uid}`);

      if (usrRes[0]) {
        setUser(usrRes[0]);
      } else {
        const referrer = getReferrer();

        const newUser = {
          uid,
          username: "Guest",
          points: 0,
          referrals: 0,
          referred_by: referrer || null
        };

        await client.upsert('users', [newUser]);
        setUser(newUser);

        if (referrer && referrer !== uid) {
          const refUser = await client.get('users', `uid=eq.${referrer}`);

          if (refUser[0]) {
            const reward = parseFloat(config.referralReward || 1);

            await client.update('users', {
              points: parseFloat(refUser[0].points) + reward,
              referrals: parseInt(refUser[0].referrals || 0) + 1
            }, `uid=eq.${referrer}`);
          }
        }
      }
    };

    init();
  }, []);

  if (!user) return <h3>Loading...</h3>;

  const referralLink = `${window.location.origin}?ref=${user.uid}`;

  return (
    <div style={{padding:20}}>
      <h2>User ID: {user.uid}</h2>
      <h3>Points: {user.points}</h3>
      <h3>Referrals: {user.referrals}</h3>

      <input value={referralLink} readOnly style={{width:"100%"}} />

      <button onClick={() => {
        navigator.clipboard.writeText(referralLink);
        alert("Copied!");
      }}>
        Copy Referral Link
      </button>
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById("root"));
</script></body>
</html>
