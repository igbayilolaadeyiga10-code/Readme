<script type="text/babel">

const SUPABASE_URL = "YOUR_URL_HERE";
const SUPABASE_KEY = "YOUR_KEY_HERE";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const {useState,useEffect} = React;

function App(){

// USER ID
let uid = localStorage.getItem("uid");
if(!uid){
uid = "U"+Math.floor(Math.random()*99999999);
localStorage.setItem("uid",uid);
}

// STATES
const [points,setPoints] = useState(0);
const [tasks,setTasks] = useState([]);
const [tab,setTab] = useState("home");

// ================= USER LOAD =================
async function loadUser(){
let {data} = await supabase.from("users").select("*").eq("id",uid);

if(data.length===0){
// referral check
const url = new URLSearchParams(window.location.search);
const ref = url.get("ref");

await supabase.from("users").insert({
id: uid,
ref_by: ref || null
});

if(ref){
await supabase.rpc("increment_ref", {ref_id: ref});
}
}else{
setPoints(data[0].points);
}
}

// ================= LOAD TASKS =================
async function loadTasks(){
let {data} = await supabase.from("tasks").select("*");
setTasks(data);
}

// ================= COMPLETE TASK =================
async function completeTask(task){
window.open(task.link,"_blank");

setTimeout(async ()=>{

// check if done
let {data} = await supabase
.from("completed")
.select("*")
.eq("user_id",uid)
.eq("task_id",task.id);

if(data.length>0){
alert("Already done");
return;
}

// save completion
await supabase.from("completed").insert({
user_id: uid,
task_id: task.id
});

// add points
await supabase.rpc("add_points", {
uid_input: uid,
amount_input: task.reward
});

setPoints(points + task.reward);
alert("Earned ₦"+task.reward);

},3000);
}

// ================= WITHDRAW =================
async function withdraw(){
let amount = parseInt(prompt("Enter amount"));
if(!amount) return;

await supabase.from("withdrawals").insert({
user_id: uid,
amount,
wallet: "bank"
});

await supabase.rpc("add_points", {
uid_input: uid,
amount_input: -amount
});

setPoints(points - amount);

alert("Withdraw requested");
}

// ================= INIT =================
useEffect(()=>{
loadUser();
loadTasks();
},[]);

// ================= UI =================
return(
<div className="max-w-md mx-auto p-4 pb-24">

<h1 className="text-xl font-bold text-green-600">EarnHub</h1>

{tab==="home" &&(
<div>
<div className="card text-center">
<h2 className="text-3xl text-green-600">₦{points}</h2>
</div>
</div>
)}

{tab==="tasks" &&(
<div>
{tasks.map(t=>(
<div key={t.id} className="card">
<p>{t.title}</p>
<p>₦{t.reward}</p>
<button className="btn" onClick={()=>completeTask(t)}>Start</button>
</div>
))}
</div>
)}

{tab==="invite" &&(
<div className="card">
<p>Referral Link</p>
<input className="input" value={window.location.origin+"?ref="+uid} readOnly/>
</div>
)}

{tab==="withdraw" &&(
<button className="btn" onClick={withdraw}>Withdraw</button>
)}

<div className="navbar">
<div onClick={()=>setTab("home")}>Home</div>
<div onClick={()=>setTab("tasks")}>Tasks</div>
<div onClick={()=>setTab("invite")}>Invite</div>
<div onClick={()=>setTab("withdraw")}>Withdraw</div>
</div>

</div>
)
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
