<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EarnHub Cyber</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body { background:#080d0c; color:#e0f2f1; font-size:10px; }
.cyber-card { background:#111b1a; padding:10px; border-radius:8px; }
.btn-action { background:#ff9f1c; padding:10px; border-radius:6px; width:100%; }
.input-cyber { background:#000; padding:8px; width:100%; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const showToast = (msg) => alert(msg);

// ✅ SUPABASE
const createSupabase = (url, key) => ({
  get: async (table, query='') => {
    const res = await fetch(`${url}/rest/v1/${table}?${query}`, {
      headers: { apikey:key, Authorization:`Bearer ${key}` }
    });
    return res.ok ? await res.json() : [];
  },
  upsert: async (table, data) => {
    return fetch(`${url}/rest/v1/${table}`, {
      method:'POST',
      headers:{
        apikey:key,
        Authorization:`Bearer ${key}`,
        'Content-Type':'application/json',
        Prefer:'resolution=merge-duplicates'
      },
      body:JSON.stringify(data)
    });
  },
  update: async (table,data,query)=>{
    return fetch(`${url}/rest/v1/${table}?${query}`,{
      method:'PATCH',
      headers:{
        apikey:key,
        Authorization:`Bearer ${key}`,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(data)
    });
  }
});

const App = () => {

  const [sb,setSb] = useState(null);
  const [user,setUser] = useState(null);
  const [tasks,setTasks] = useState([]);
  const [userSubmissions,setUserSubmissions] = useState([]);
  const [loading,setLoading] = useState(true);

  const [config,setConfig] = useState({
    referralReward: 1
  });

  const uid =
    tg?.initDataUnsafe?.user?.id?.toString() ||
    localStorage.getItem("uid") ||
    "u_" + Math.random().toString(36).slice(2);

  localStorage.setItem("uid", uid);

  // ✅ GET REFERRAL FROM URL
  const getReferrer = () => {
    const params = new URLSearchParams(window.location.search);
    return params.get("ref");
  };

  // ✅ INIT
  const init = async () => {
    const url = localStorage.getItem("sb_url");
    const key = localStorage.getItem("sb_key");

    if (url && key) {
      const client = createSupabase(url, key);
      setSb(client);

      try {
        // CONFIG
        const cfg = await client.get("config", "key=eq.app");
        if (cfg[0]) setConfig(cfg[0].data);

        // USER CHECK
        const usrRes = await client.get("users", `uid=eq.${uid}`);

        if (usrRes[0]) {
          setUser(usrRes[0]);
        } else {
          const referrer = getReferrer();

          const newUser = {
            uid,
            username: tg?.initDataUnsafe?.user?.username || "Guest",
            points: 0,
            referrals: 0,
            joined: false,
            referred_by: referrer || null
          };

          await client.upsert("users", [newUser]);
          setUser(newUser);

          // 🎁 REFERRAL BONUS
          if (referrer && referrer !== uid) {
            const refUser = await client.get("users", `uid=eq.${referrer}`);

            if (refUser[0]) {
              const reward = parseFloat(cfg[0]?.data?.referralReward || 1);

              await client.update("users", {
                points: parseFloat(refUser[0].points) + reward,
                referrals: parseInt(refUser[0].referrals || 0) + 1
              }, `uid=eq.${referrer}`);

              showToast("Referral bonus added");
            }
          }
        }

        // LOAD TASKS
        const tks = await client.get("tasks");
        setTasks(tks || []);

        // LOAD SUBMISSIONS
        const subs = await client.get("submissions", `uid=eq.${uid}`);
        setUserSubmissions(subs || []);

      } catch(e){}

    }

    setLoading(false);
  };

  useEffect(()=>{ init(); },[]);

  if(loading) return <h3 style={{padding:20}}>Loading...</h3>;
  if(!user) return <h3>No user</h3>;

  // ✅ WEBSITE REF LINK
  const referralLink = `${window.location.origin}?ref=${user.uid}`;

  return (
    <div style={{padding:20}}>

      <div className="cyber-card">
        <h3>@{user.username}</h3>
        <p>UID: {user.uid}</p>
        <p>Points: {user.points}</p>
        <p>Referrals: {user.referrals}</p>
      </div>

      <br/>

      {/* ✅ REFERRAL BOX */}
      <div className="cyber-card">
        <p>Your Referral Link</p>

        <input
          className="input-cyber"
          value={referralLink}
          readOnly
        />

        <button
          className="btn-action"
          onClick={()=>{
            navigator.clipboard.writeText(referralLink);
            showToast("Copied!");
          }}
        >
          Copy Link
        </button>
      </div>

    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
