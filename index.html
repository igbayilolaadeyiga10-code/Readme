<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub Cyber</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body { background:white; font-family:sans-serif; margin:0; }
input, select { width:100%; padding:8px; margin:4px 0; border:1px solid #22c55e; border-radius:6px; }
button { background:#22c55e; color:white; padding:10px; border:none; border-radius:6px; cursor:pointer; width:100%; margin-top:4px; }
button:hover { opacity:0.9; }
.card { background:#f0fdf4; border:1px solid #22c55e; border-radius:12px; padding:12px; margin-bottom:12px; }
.navbar { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; border-top:1px solid #22c55e; background:white; padding:12px; }
.active { font-weight:bold; color:#22c55e; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
    const [page, setPage] = useState(localStorage.getItem("currentPage") || "register"); // register/login/dashboard
    const [users, setUsers] = useState(JSON.parse(localStorage.getItem("users")||"[]"));
    const [currentUser, setCurrentUser] = useState(JSON.parse(localStorage.getItem("currentUser")||"null"));
    const [referralBonus, setReferralBonus] = useState(parseInt(localStorage.getItem("referralBonus")||100));
    const [minWithdraw, setMinWithdraw] = useState(parseInt(localStorage.getItem("minWithdraw")||1000));
    const [maxWithdraw, setMaxWithdraw] = useState(parseInt(localStorage.getItem("maxWithdraw")||20000));
    const [tasks, setTasks] = useState(JSON.parse(localStorage.getItem("tasks")||"[]"));
    const [withdraws, setWithdraws] = useState(JSON.parse(localStorage.getItem("withdraws")||"[]"));

    const saveUsers = (arr) => { setUsers(arr); localStorage.setItem("users", JSON.stringify(arr)); }
    const saveCurrentUser = (user) => { setCurrentUser(user); localStorage.setItem("currentUser", JSON.stringify(user)); }

    // -------- Registration --------
    const [regForm, setRegForm] = useState({username:"", phone:"", password:"", email:"", referral:""});
    const handleRegister = () => {
        if(!regForm.username || !regForm.phone || !regForm.password || !regForm.email){ alert("Fill all required fields"); return; }
        if(users.find(u=>u.username===regForm.username)){ alert("Username exists"); return; }

        const newUser = {
            username: regForm.username,
            phone: regForm.phone,
            password: regForm.password,
            email: regForm.email,
            referrals:0,
            points:0,
            referralCode: regForm.username
        };

        // Handle referral bonus
        if(regForm.referral){
            const refUser = users.find(u=>u.username===regForm.referral);
            if(refUser){
                refUser.points += referralBonus;
                refUser.referrals +=1;
                saveUsers([...users.filter(u=>u.username!==refUser.username), refUser]);
                alert(`Referral bonus ₦${referralBonus} added to ${refUser.username}`);
            }
        }

        saveUsers([...users, newUser]);
        alert("Registration successful! Please login now.");
        setRegForm({username:"", phone:"", password:"", email:"", referral:""});
        setPage("login");
        localStorage.setItem("currentPage","login");
    }

    // -------- Login --------
    const [loginForm, setLoginForm] = useState({username:"", password:""});
    const handleLogin = () => {
        const user = users.find(u=>u.username===loginForm.username && u.password===loginForm.password);
        if(!user){ alert("Invalid credentials"); return; }
        saveCurrentUser(user);
        setPage("dashboard");
        localStorage.setItem("currentPage","dashboard");
    }

    // -------- Logout --------
    const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem("currentUser");
        setPage("login");
        localStorage.setItem("currentPage","login");
    }

    // -------- Dashboard Functions --------
    const handleWithdraw = () => {
        const amount = parseInt(prompt(`Enter withdraw amount (min: ${minWithdraw}, max: ${maxWithdraw})`));
        if(!amount || amount<minWithdraw || amount>maxWithdraw || amount>currentUser.points){ alert("Invalid amount"); return; }
        const w = {id:Date.now(), username:currentUser.username, amount, status:"Pending"};
        setWithdraws([...withdraws, w]);
        localStorage.setItem("withdraws", JSON.stringify([...withdraws, w]));
        currentUser.points -= amount;
        saveCurrentUser(currentUser);
        alert("Withdraw request sent");
    }

    // -------- Admin Panel --------
    const [adminMode, setAdminMode] = useState(false);
    const adminUsernames = ["admin"]; // Example, you can extend
    useEffect(()=>{ if(currentUser && adminUsernames.includes(currentUser.username)){ setAdminMode(true); } },[currentUser]);

    if(page==="register"){
        return (
            <div className="card p-4 max-w-md mx-auto mt-8">
                <h2 className="font-bold text-green-600 mb-2 text-center">Register</h2>
                <input placeholder="Username" value={regForm.username} onChange={e=>setRegForm({...regForm, username:e.target.value})} />
                <input placeholder="Phone Number" value={regForm.phone} onChange={e=>setRegForm({...regForm, phone:e.target.value})} />
                <input placeholder="Password" type="password" value={regForm.password} onChange={e=>setRegForm({...regForm, password:e.target.value})} />
                <input placeholder="Email" value={regForm.email} onChange={e=>setRegForm({...regForm, email:e.target.value})} />
                <input placeholder="Referral Code (optional)" value={regForm.referral} onChange={e=>setRegForm({...regForm, referral:e.target.value})} />
                <button onClick={handleRegister}>Register</button>
                <p className="mt-2 text-center">Already have an account? <span style={{color:"#22c55e",cursor:"pointer"}} onClick={()=>{setPage("login"); localStorage.setItem("currentPage","login")}}>Login</span></p>
            </div>
        )
    }

    if(page==="login"){
        return (
            <div className="card p-4 max-w-md mx-auto mt-8">
                <h2 className="font-bold text-green-600 mb-2 text-center">Login</h2>
                <input placeholder="Username" value={loginForm.username} onChange={e=>setLoginForm({...loginForm, username:e.target.value})} />
                <input placeholder="Password" type="password" value={loginForm.password} onChange={e=>setLoginForm({...loginForm, password:e.target.value})} />
                <button onClick={handleLogin}>Login</button>
                <p className="mt-2 text-center">Don't have an account? <span style={{color:"#22c55e",cursor:"pointer"}} onClick={()=>{setPage("register"); localStorage.setItem("currentPage","register")}}>Register</span></p>
            </div>
        )
    }

    if(page==="dashboard" && currentUser){
        const refLink = `https://your-site.com/?ref=${currentUser.username}`;
        return (
            <div className="max-w-md mx-auto p-4">
                <header className="flex justify-between mb-4">
                    <h2 className="text-green-600 font-bold">Dashboard</h2>
                    <button onClick={handleLogout}>Logout</button>
                </header>
                <div className="card">
                    <p>Username: {currentUser.username}</p>
                    <p>Points: ₦{currentUser.points}</p>
                    <p>Referral Link: <input readOnly value={refLink} style={{width:"100%"}}/></p>
                    <button onClick={()=>{navigator.clipboard.writeText(refLink); alert("Referral link copied");}}>Copy Referral Link</button>
                </div>

                <div className="card mt-4">
                    <h3 className="font-bold mb-2">Tasks</h3>
                    {tasks.map(t=><div key={t.id} className="card">
                        <p>{t.title} - ₦{t.reward}</p>
                        <button onClick={()=>{
                            if(currentUser.points>=0){ // simulate task completion
                                currentUser.points += t.reward;
                                saveCurrentUser(currentUser);
                                alert("Task completed! Points added.");
                            }
                        }}>Complete Task</button>
                    </div>)}
                </div>

                <div className="card mt-4">
                    <h3 className="font-bold mb-2">Withdraw</h3>
                    <button onClick={handleWithdraw}>Request Withdraw</button>
                </div>

                {adminMode && (
                    <div className="card mt-4">
                        <h3 className="font-bold text-red-600 mb-2">Admin Panel</h3>
                        <input type="number" placeholder="Set Referral Bonus" value={referralBonus} onChange={e=>{setReferralBonus(parseInt(e.target.value)); localStorage.setItem("referralBonus",e.target.value)}} />
                        <input type="number" placeholder="Set Min Withdraw" value={minWithdraw} onChange={e=>{setMinWithdraw(parseInt(e.target.value)); localStorage.setItem("minWithdraw",e.target.value)}} />
                        <input type="number" placeholder="Set Max Withdraw" value={maxWithdraw} onChange={e=>{setMaxWithdraw(parseInt(e.target.value)); localStorage.setItem("maxWithdraw",e.target.value)}} />
                        <h4 className="font-bold mt-2">View Withdraws</h4>
                        {withdraws.map(w=><div key={w.id} className="card">
                            <p>{w.username} requested ₦{w.amount} - Status: {w.status}</p>
                            <button onClick={()=>{ w.status="Approved"; setWithdraws([...withdraws]); localStorage.setItem("withdraws", JSON.stringify(withdraws)); }}>Approve</button>
                            <button onClick={()=>{ w.status="Rejected"; setWithdraws([...withdraws]); localStorage.setItem("withdraws", JSON.stringify(withdraws)); }}>Reject</button>
                        </div>)}
                        <h4 className="font-bold mt-2">Edit User Points</h4>
                        <EditPoints users={users} saveUsers={saveUsers} />
                    </div>
                )}
            </div>
        )
    }

    return <div>Loading...</div>
}

// -------- Edit User Points Component --------
function EditPoints({users, saveUsers}){
    const [uid, setUid] = useState("");
    const [points, setPoints] = useState(0);
    const handleEdit = () => {
        const user = users.find(u=>u.username===uid);
        if(!user){ alert("User not found"); return; }
        user.points = points;
        saveUsers([...users.filter(u=>u.username!==uid), user]);
        alert("Points updated");
        setUid(""); setPoints(0);
    }
    return (
        <div>
            <input placeholder="Username" value={uid} onChange={e=>setUid(e.target.value)} />
            <input type="number" placeholder="Points" value={points} onChange={e=>setPoints(parseInt(e.target.value))} />
            <button onClick={handleEdit}>Update Points</button>
        </div>
    )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
