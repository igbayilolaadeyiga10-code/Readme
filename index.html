
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Naira Hope</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root { 
            --bg: #ffffff; 
            --card: #f8fafc; 
            --accent: #4f46e5; 
            --text: #0f172a; 
            --border: #e2e8f0;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 0; font-size: 10.5px; user-select: none; -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-bar { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px); border-top: 1px solid var(--border); }
        .standard-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .btn-primary { background: var(--accent); color: #fff; font-weight: 800; border-radius: 8px; padding: 10px; width: 100%; font-size: 11px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.15); border: none; outline: none; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; border-radius: 8px; padding: 7px 12px; font-size: 10.5px; }
        .input-field { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); outline: none; width: 100%; font-size: 11px; transition: border 0.2s; }
        .input-field:focus { border-color: var(--accent); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideUp 0.2s cubic-bezier(0, 0, 0.2, 1) forwards; }
        .header-avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3); }
        .grad-accent { background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%); }
        .status-chip { font-size: 7px; font-weight: 800; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; }
        .broadcast-banner { background: #4f46e5; color: white; padding: 10px 14px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 10px; line-height: 1.4; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 8px 15px rgba(79, 70, 229, 0.2); }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="toast-layer"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.ready(); tg.expand(); }

        const firebaseConfig = {
            apiKey: "AIzaSyDVqS3DAdCk8HT37RlTJesVKKK2ZnULz1Y",
            authDomain: "beast4ton.firebaseapp.com",
            databaseURL: "https://beast4ton-default-rtdb.firebaseio.com",
            projectId: "beast4ton",
            storageBucket: "beast4ton.firebasestorage.app",
            messagingSenderId: "530797704489",
            appId: "1:530797704489:web:6fe06f31e27c902048b338"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const showToast = (msg, icon = "✨") => {
            const container = document.getElementById('toast-layer');
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 w-[90%] bg-indigo-600 text-white p-3 rounded-xl flex items-center gap-3 shadow-2xl z-[90000] font-bold text-[11px] animate-slide';
            toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = '0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [config, setConfig] = useState({ 
                appName: 'NAIRA HOPE', currency: 'Points', minWithdrawal: 100, minTasksForWithdrawal: 5,
                adminPin: '8888', devPin: '0000', adminTelegramId: '7420541258', devTelegramId: '7420541258',
                referralReward: 10, referralCommissionPercent: 5, minTasksForValidReferral: 3, nairaRate: 10, adReward: 2, adCooldown: 5,
                adminAdLink: '', devAdLink: '', 
                broadcastMessage: '', submissionChannelId: '', payoutChannelId: '', botToken: '',
                botUsername: '', appShortName: '', 
                mandatoryChannels: [], categories: ['Socials', 'Tasks', 'Videos']
            });
            const [tasks, setTasks] = useState([]);
            const [submissions, setSubmissions] = useState({});
            const [userWithdrawals, setUserWithdrawals] = useState([]);
            const [leaderboard, setLeaderboard] = useState({ earners: [], recruiters: [] });
            const [tab, setTab] = useState('home');
            const [lbType, setLbType] = useState('earners'); 
            const [loading, setLoading] = useState(true);
            const [adminTaps, setAdminTaps] = useState(0);
            const [devTaps, setDevTaps] = useState(0);
            const [showPin, setShowPin] = useState(false);
            const [pinType, setPinType] = useState('admin');
            const [showAdmin, setShowAdmin] = useState(false);
            const [showDev, setShowDev] = useState(false);
            const [activeTask, setActiveTask] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [adTimer, setAdTimer] = useState(0);
            const [hasAcceptedChannels, setHasAcceptedChannels] = useState(() => {
                try { return localStorage.getItem('eh_gate_v25') === 'true'; } catch(e) { return false; }
            });

            const [currentTgId, setCurrentTgId] = useState(() => {
                const id = tg?.initDataUnsafe?.user?.id?.toString() || localStorage.getItem('eh_id') || '0';
                if(id !== '0') localStorage.setItem('eh_id', id);
                return id;
            });

            const getBotAppLink = useCallback((uid = '') => {
                const botUser = config?.botUsername || 'EarnHubBot';
                const appName = config?.appShortName || 'app';
                const base = `https://t.me/${botUser}/${appName}`;
                return uid && uid !== '0' ? `${base}?startapp=ref_${uid}` : base;
            }, [config]);

            const sendTelegramNotification = useCallback(async (text, chatId, file = null, buttons = null) => {
                if (!config?.botToken || !chatId) return;
                let targetId = chatId.trim();
                if (!targetId.startsWith('-') && targetId.length > 5) targetId = `-100${targetId}`;
                try {
                    let url = `https://api.telegram.org/bot${config.botToken}/sendMessage`;
                    let body;
                    const reply_markup = buttons ? JSON.stringify({ inline_keyboard: buttons }) : undefined;
                    if (file) {
                        url = `https://api.telegram.org/bot${config.botToken}/sendPhoto`;
                        const formData = new FormData();
                        formData.append('chat_id', targetId);
                        formData.append('caption', text);
                        formData.append('parse_mode', 'HTML');
                        formData.append('photo', file);
                        if (reply_markup) formData.append('reply_markup', reply_markup);
                        body = formData;
                    } else {
                        const payload = { chat_id: targetId, text: text, parse_mode: 'HTML' };
                        if (reply_markup) payload.reply_markup = JSON.parse(reply_markup);
                        body = JSON.stringify(payload);
                    }
                    await fetch(url, { method: 'POST', body: body, headers: file ? {} : { 'Content-Type': 'application/json' } });
                } catch (error) { console.error("Notify failed", error); }
            }, [config]);

            // Sync Telegram Username to Database
            useEffect(() => {
                if (user && tg?.initDataUnsafe?.user) {
                    const tgUser = tg.initDataUnsafe.user;
                    const realName = tgUser.username || (tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : ""));
                    if (realName && (user.username?.startsWith('Agent_') || !user.username)) {
                        db.ref(`users/${currentTgId}/username`).set(realName);
                    }
                }
            }, [user, currentTgId]);

            useEffect(() => {
                const configRef = db.ref('app_config');
                const userRef = db.ref(`users/${currentTgId}`);
                const tasksRef = db.ref('tasks');
                const subsRef = db.ref('submissions').orderByChild('uid').equalTo(currentTgId);
                const usersRef = db.ref('users');
                const withdrawalsRef = db.ref('withdrawals').orderByChild('uid').equalTo(currentTgId);

                configRef.on('value', snap => { if (snap.exists()) setConfig(prev => ({ ...prev, ...snap.val() })); });

                userRef.on('value', snap => {
                    if (snap.exists()) {
                        setUser(snap.val());
                        setLoading(false);
                    } else if (currentTgId !== '0') {
                        const tgUser = tg?.initDataUnsafe?.user;
                        const detectedName = tgUser?.username || (tgUser?.first_name ? (tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "")) : null) || 'Agent_' + currentTgId.slice(-4);
                        const newUser = {
                            uid: currentTgId, username: detectedName, points: 0, referrals: 0, completedTasksCount: 0,
                            referredBy: (tg?.initDataUnsafe?.start_param?.startsWith('ref_') ? tg.initDataUnsafe.start_param.replace('ref_', '') : null),
                            refAwarded: false, lastAdWatched: 0, lastActive: Date.now(), timestamp: Date.now()
                        };
                        userRef.set(newUser).then(() => setUser(newUser));
                        setLoading(false);
                    } else { setLoading(false); }
                }, () => setLoading(false));

                tasksRef.on('value', snap => setTasks(snap.val() ? Object.values(snap.val()) : []));
                subsRef.on('value', snap => setSubmissions(snap.val() || {}));
                withdrawalsRef.on('value', snap => snap.exists() ? setUserWithdrawals(Object.values(snap.val()).sort((a,b) => b.timestamp - a.timestamp)) : setUserWithdrawals([]));
                
                // Optimized Leaderboard Listener (Top 5 Only)
                usersRef.on('value', snap => {
                    if (snap.exists()) {
                        const allUsers = Object.values(snap.val());
                        setLeaderboard({
                            earners: [...allUsers].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 5),
                            recruiters: [...allUsers].sort((a, b) => (b.referrals || 0) - (a.referrals || 0)).slice(0, 5)
                        });
                    }
                });
                return () => { configRef.off(); userRef.off(); tasksRef.off(); subsRef.off(); usersRef.off(); withdrawalsRef.off(); };
            }, [currentTgId]);

            const triggerAccess = (type) => {
                const ids = type === 'admin' ? config?.adminTelegramId : config?.devTelegramId;
                const list = ids ? ids.split(',').map(i => i.trim()).filter(Boolean) : [];
                if (list.length === 0 || list.includes(currentTgId)) {
                    setPinType(type); setShowPin(true);
                } else { showToast("Unauthorized Node", "🚫"); }
            };

            const startAd = () => {
                const now = Date.now();
                const cooldownMs = (config?.adCooldown || 5) * 60000;
                if (now - (user?.lastAdWatched || 0) < cooldownMs) return showToast(`Node charging...`, "⏳");
                const links = [config?.adminAdLink, config?.devAdLink].filter(l => l && l.trim() !== "");
                if (links.length > 0) window.open(links[Math.floor(Math.random() * links.length)], '_blank');
                setAdTimer(15);
                const interval = setInterval(() => {
                    setAdTimer(prev => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            db.ref(`users/${currentTgId}`).transaction(u => {
                                if(u) {
                                    u.points = (u.points || 0) + (config?.adReward || 20);
                                    u.lastAdWatched = Date.now();
                                }
                                return u;
                            });
                            showToast(`Earned +${config?.adReward}!`, "📺");
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
            };

            if (loading) return <div className="fixed inset-0 bg-white flex flex-col items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div><p className="mt-4 font-black text-indigo-900 text-[9px] uppercase tracking-widest">Waking EarnHub...</p></div>;

            if (!hasAcceptedChannels && config?.mandatoryChannels?.length > 0) {
                return (
                    <div className="fixed inset-0 bg-white z-[30000] flex flex-col items-center justify-center p-8 animate-slide uppercase">
                        <div className="header-avatar w-16 h-16 text-3xl mb-6 shadow-xl grad-accent">📢</div>
                        <h2 className="text-lg font-black mb-2 text-center tracking-tight">Access Controlled</h2>
                        <p className="text-[9px] text-slate-400 mb-6 text-center px-4 font-bold">Authenticate by joining our networks.</p>
                        <div className="w-full space-y-2 mb-8 max-h-[40vh] overflow-y-auto no-scrollbar">
                            {(config.mandatoryChannels || []).map((c, i) => (
                                <div key={i} className="standard-card flex justify-between items-center p-3 border-slate-100">
                                    <span className="font-black truncate w-2/3">{c?.name || 'Network'}</span>
                                    <button onClick={() => window.open(c?.link, '_blank')} className="btn-primary w-auto px-4 py-1.5 text-[8px] uppercase">JOIN</button>
                                </div>
                            ))}
                        </div>
                        <button onClick={() => { try { localStorage.setItem('eh_gate_v25', 'true'); } catch(e) {} setHasAcceptedChannels(true); }} className="btn-primary w-2/3 py-4 uppercase font-black">AUTHENTICATE</button>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white pb-24">
                    {showPin && (
                        <div className="fixed inset-0 bg-white/95 z-[60000] flex items-center justify-center p-8">
                            <div className="standard-card w-full p-8 text-center border-indigo-100 shadow-2xl">
                                <h3 className="text-[8px] font-black text-indigo-600 uppercase mb-6 tracking-widest">ACCESS CODE REQUIRED</h3>
                                <input type="password" autoFocus className="input-field text-center text-2xl tracking-[1.5em] mb-4" maxLength={4} 
                                    onChange={e => {
                                        if (e.target.value === (pinType === 'dev' ? config?.devPin : config?.adminPin)) {
                                            if (pinType === 'dev') setShowDev(true); else setShowAdmin(true);
                                            setShowPin(false);
                                        }
                                    }} />
                                <button onClick={() => setShowPin(false)} className="text-[8px] text-slate-300 uppercase font-black">ABORT</button>
                            </div>
                        </div>
                    )}

                    {showAdmin && <AdminPanel config={config} db={db} onClose={() => setShowAdmin(false)} />}
                    {showDev && <DeveloperPanel config={config} db={db} onClose={() => setShowDev(false)} />}

                    <header className="px-5 py-4 flex justify-between items-center sticky top-0 bg-white/80 backdrop-blur-xl z-[10000] border-b border-slate-100">
                        <div className="flex items-center gap-3" onClick={() => setAdminTaps(v => v+1 >= 15 ? (triggerAccess('admin'), 0) : v+1)}>
                            <div className="header-avatar grad-accent">{(user?.username || 'A')[0]}</div>
                            <div className="leading-tight">
                                <h1 className="text-[11px] font-black text-slate-900 truncate max-w-[140px]">@{user?.username || 'agent'}</h1>
                                <p className="text-[8px] text-indigo-500 font-bold uppercase">{(user?.points || 0).toFixed(0)} {config?.currency || 'PTS'} (₦{((user?.points || 0) * (config?.nairaRate || 10)).toLocaleString()})</p>
                            </div>
                        </div>
                        <div onClick={() => setDevTaps(v => v+1 >= 15 ? (triggerAccess('dev'), 0) : v+1)}>
                            <div className="bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100"><span className="text-[7px] font-black text-indigo-600 uppercase tracking-widest">ACTIVE NODE</span></div>
                        </div>
                    </header>

                    <main className="px-4 py-6 space-y-6 animate-slide">
                        {tab === 'home' && (
                            <div className="space-y-6 uppercase font-black">
                                {config?.broadcastMessage && <div className="broadcast-banner animate-slide"><span className="text-xl">📢</span><div className="flex-1 pr-2">{config.broadcastMessage}</div></div>}
                                <div className="standard-card py-8 px-6 text-center grad-accent text-white border-0 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 -rotate-45 translate-x-12 -translate-y-12 rounded-full"></div>
                                    <p className="text-[8px] font-black opacity-60 uppercase tracking-[0.4em] mb-2">Total Equity</p>
                                    <h2 className="text-3xl font-black tracking-tight">{(user?.points || 0).toFixed(0)} <span className="text-xs opacity-50 uppercase font-bold">{config?.currency || 'PTS'}</span></h2>
                                    <p className="text-[10px] opacity-80 mt-1">≈ ₦{((user?.points || 0) * (config?.nairaRate || 10)).toLocaleString()}</p>
                                    <div className="grid grid-cols-2 gap-4 mt-8 pt-6 border-t border-white/10 uppercase">
                                        <div><p className="text-sm font-black">{user?.referrals || 0}</p><p className="text-[7px] opacity-50 font-black">SQUAD</p></div>
                                        <div><p className="text-sm font-black">{user?.completedTasksCount || 0}</p><p className="text-[7px] opacity-50 font-black">MISSIONS</p></div>
                                    </div>
                                </div>
                                <div className="standard-card p-4 bg-indigo-50 border-indigo-100 flex justify-between items-center shadow-none">
                                    <div className="w-2/3"><h4 className="font-black text-indigo-900 text-[10px]">Daily Ad Reward</h4><p className="text-[8px] text-indigo-400 font-bold">Earn +{config?.adReward || 0} PTS (₦{(config?.adReward * (config?.nairaRate || 10)).toLocaleString()})</p></div>
                                    <button onClick={startAd} disabled={adTimer > 0} className="btn-primary w-24 py-2 uppercase font-black">{adTimer > 0 ? `${adTimer}s` : 'START'}</button>
                                </div>
                                <button onClick={() => setTab('tasks')} className="btn-primary py-4 text-[12px] uppercase font-black tracking-widest">BROWSE BOUNTIES</button>
                            </div>
                        )}

                        {tab === 'tasks' && (
                            <div className="space-y-8 uppercase">
                                {(config?.categories || ['Socials']).map(cat => {
                                    const catTasks = tasks.filter(t => (t?.category || 'General') === cat);
                                    if (catTasks.length === 0) return null;
                                    return (
                                        <div key={cat} className="space-y-3">
                                            <h3 className="text-[10px] font-black text-indigo-600 uppercase tracking-widest border-l-4 border-indigo-600 pl-3">{cat} MISSIONS</h3>
                                            <div className="space-y-2.5">
                                                {catTasks.map(t => {
                                                    const sub = submissions[`${currentTgId}_${t?.id}`];
                                                    const blocked = sub && (sub.status === 'pending' || sub.status === 'approved');
                                                    return (
                                                        <div key={t?.id} className={`standard-card p-3 flex justify-between items-center ${blocked ? 'opacity-40 pointer-events-none' : ''}`} onClick={() => setActiveTask(t)}>
                                                            <div className="flex items-center gap-3.5 w-3/4 truncate">
                                                                <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">{t?.icon || '🎯'}</div>
                                                                <div className="truncate leading-tight font-black">
                                                                    <h5 className="text-[11px] text-slate-900 truncate">{t?.title || 'Mission'}</h5>
                                                                    <p className="text-[8.5px] text-indigo-500 tracking-tighter">+{t?.reward || 0} PTS (₦{(t?.reward * (config?.nairaRate || 10)).toLocaleString()})</p>
                                                                </div>
                                                            </div>
                                                            {sub ? <span className="status-chip bg-amber-100 text-amber-600 px-2 py-1 rounded-lg">{sub.status}</span> : <div className="text-[7px] font-black text-indigo-600">START</div>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {tab === 'stats' && (
                            <div className="space-y-6">
                                <div className="flex bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setLbType('earners')} className={`flex-1 py-2 rounded-lg text-[9px] font-black uppercase transition-all ${lbType === 'earners' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>TOP 5 EARNERS</button>
                                    <button onClick={() => setLbType('recruiters')} className={`flex-1 py-2 rounded-lg text-[9px] font-black uppercase transition-all ${lbType === 'recruiters' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>TOP 5 SQUAD LEADS</button>
                                </div>
                                <div className="space-y-3">
                                    {(lbType === 'earners' ? (leaderboard.earners || []) : (leaderboard.recruiters || [])).map((e, i) => (
                                        <div key={e?.uid || i} className="standard-card flex justify-between items-center py-2.5 uppercase font-black">
                                            <div className="flex items-center gap-3 font-bold text-[10px]"><span className="text-slate-300">#{i+1}</span><span className="truncate w-32">@{e?.username || 'agent'}</span></div>
                                            <span className="text-indigo-600 text-[10px]">{lbType === 'earners' ? `${(e?.points || 0).toFixed(0)} PTS` : `${e?.referrals || 0} REFS`}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'ref' && (
                            <div className="text-center py-6 space-y-6 animate-slide uppercase font-black">
                                <div className="w-20 h-20 grad-accent rounded-3xl flex items-center justify-center mx-auto text-4xl shadow-2xl border-4 border-white">💎</div>
                                <div className="space-y-3 px-6"><h3 className="text-xl tracking-tight">Expand the Squad</h3><p className="text-[10px] text-slate-400 font-bold">Earn +{config?.referralReward || 0} PTS (₦{(config?.referralReward * (config?.nairaRate || 10)).toLocaleString()}) + {config?.referralCommissionPercent || 0}% Com.</p></div>
                                <div className="standard-card bg-indigo-50 border-indigo-100 text-left space-y-3">
                                    <h4 className="text-[9px] text-indigo-600 uppercase tracking-widest">Requirements</h4>
                                    <div className="flex justify-between items-center text-[10px] font-bold">
                                        <span className="text-slate-500">Your Referrals</span>
                                        <span className="text-indigo-600">{user?.referrals || 0} Agents</span>
                                    </div>
                                    <div className="p-3 bg-white rounded-xl border border-indigo-100">
                                        <p className="text-[8px] text-slate-400 font-bold uppercase leading-relaxed">
                                            Invite friends. They must finish <span className="text-indigo-600">{config?.minTasksForValidReferral || 3} missions</span> for the reward node to trigger.
                                        </p>
                                    </div>
                                </div>

                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Bot API Token</p><input className="input-field" value={loc.botToken} onChange={e => setLoc({...loc, botToken: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Bot Username</p><input className="input-field" value={loc.botUsername} onChange={e => setLoc({...loc, botUsername: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">App Name</p><input className="input-field" value={loc.appShortName} onChange={e => setLoc({...loc, appShortName: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Sub Feed ID</p><input className="input-field" value={loc.submissionChannelId} onChange={e => setLoc({...loc, submissionChannelId: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Payout Feed ID</p><input className="input-field" value={loc.payoutChannelId} onChange={e => setLoc({...loc, payoutChannelId: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Admin Ad Link</p><input className="input-field" value={loc.adminAdLink} onChange={e => setLoc({...loc, adminAdLink: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Dev Ad Link</p><input className="input-field" value={loc.devAdLink} onChange={e => setLoc({...loc, devAdLink: e.target.value})} /></div>
                            </div>
                        </div>

                        <div className="standard-card p-5 space-y-4 border-rose-100 bg-rose-50/20 shadow-none">
                            <h4 className="text-[9px] text-rose-600 tracking-widest">Danger Zone (Wipe)</h4>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => wipeData('users')} className="btn-outline text-rose-600 text-[8px]">Wipe Users</button>
                                <button onClick={() => wipeData('submissions')} className="btn-outline text-rose-600 text-[8px]">Wipe Subs</button>
                                <button onClick={() => wipeData('withdrawals')} className="btn-outline text-rose-600 text-[8px]">Wipe Payouts</button>
                                <button onClick={() => wipeData('tasks')} className="btn-outline text-rose-600 text-[8px]">Wipe Tasks</button>
                            </div>
                        </div>

                        <div className="standard-card p-5 space-y-4 border-slate-100 shadow-none">
                            <h4 className="text-[9px] text-indigo-600 tracking-widest">Auth Master</h4>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Admin PIN</p><input className="input-field" value={loc.adminPin} onChange={e => setLoc({...loc, adminPin: e.target.value})} /></div>
                                <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Dev PIN</p><input className="input-field" value={loc.devPin} onChange={e => setLoc({...loc, devPin: e.target.value})} /></div>
                            </div>
                            <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Admin IDs (CSV)</p><input className="input-field" value={loc.adminTelegramId} onChange={e => setLoc({...loc, adminTelegramId: e.target.value})} /></div>
                            <div className="space-y-1"><p className="text-[7px] text-slate-300 ml-1">Dev IDs (CSV)</p><input className="input-field" value={loc.devTelegramId} onChange={e => setLoc({...loc, devTelegramId: e.target.value})} /></div>
                        </div>
                        <button onClick={save} className="btn-primary py-5 uppercase grad-accent">SYNC CORE</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
