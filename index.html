<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SparkBNB Rewards</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-blue: #1e3a8a;
            --light-blue: #eff6ff;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 13px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .bnb-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .bnb-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
        }
        .form-input {
            background: #ffffff !important;
            border: 1.5px solid #cbd5e1 !important;
            border-radius: 10px !important;
            font-size: 13px !important;
            padding: 10px 12px !important;
            color: #0f172a !important;
            width: 100%;
        }
        .form-input:focus {
            border-color: var(--primary-blue) !important;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1) !important;
            outline: none;
        }
        .status-badge {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 6px;
            border-radius: 6px;
        }
        .status-pending { background: #dbeafe; color: #1e40af; }
        .status-approved { background: #dcfce7; color: #15803d; }
        .status-declined { background: #fee2e2; color: #b91c1c; }
        
        .img-preview-box {
            width: 100%;
            height: 140px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }
        .img-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const Icon = ({ name, size = 18, className = "", fill = "none" }) => {
          const containerRef = useRef(null);
          useEffect(() => {
            if (containerRef.current && window.lucide) {
              const iconEl = document.createElement('i');
              iconEl.setAttribute('data-lucide', name);
              iconEl.className = className;
              iconEl.style.width = `${size}px`;
              iconEl.style.height = `${size}px`;
              iconEl.style.display = 'inline-block';
              containerRef.current.innerHTML = '';
              containerRef.current.appendChild(iconEl);
              window.lucide.createIcons({
                root: containerRef.current,
                attrs: { width: size, height: size, fill: fill, 'stroke-width': 2.5 }
              });
            }
          }, [name, size, className, fill]);
          return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }} />;
        };

        const firebaseConfig = {
          apiKey: "AIzaSyDkmOxu7QaURpmHPQMqhUohX1qk23wTBHY",
          authDomain: "coffee-spark-ai-barista-f2341.firebaseapp.com",
          databaseURL: "https://coffee-spark-ai-barista-f2341-default-rtdb.firebaseio.com",
          projectId: "coffee-spark-ai-barista-f2341",
          storageBucket: "coffee-spark-ai-barista-f2341.firebasestorage.app",
          messagingSenderId: "986967963715",
          appId: "1:986967963715:web:d5156277ca1c30f4ca3cf6"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const Status = { PENDING: 'PENDING', APPROVED: 'APPROVED', DECLINED: 'DECLINED' };

        const sendToTelegram = async (botToken, chatId, message) => {
          if (!botToken || !chatId) return;
          try {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'HTML' })
            });
          } catch (e) { console.error("TG Send Error", e); }
        };

        const sendPhotoToTelegram = async (botToken, chatId, base64Image, caption) => {
          if (!botToken || !chatId) return;
          try {
            const response = await fetch(base64Image);
            const blob = await response.blob();
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'proof.png');
            formData.append('caption', caption);
            formData.append('parse_mode', 'HTML');
            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
          } catch (e) { console.error("TG Photo Error", e); }
        };

  const App = () => {
  const defaultConfig = {
    pointsToBnbRate: 1000000,
    minWithdrawalPoints: 50000,
    dailyBonus: 500,
    referralBonus: 1000,
    minTasksForWithdrawal: 3,
    minReferralsForWithdrawal: 5,
    adminPass: "admin123", // default password
    telegramBotToken: "",
    tgChatId: "",
    tgPayoutChatId: "",
    chan1Name: "Missions Channel", chan1Link: "",
    chan2Name: "Payouts Channel", chan2Link: "",
    chan3Name: "News Channel", chan3Link: ""
  };

  // ✅ Load saved config safely, fallback to default
  const savedConfig = (() => {
    try {
      const data = localStorage.getItem("config");
      return data ? JSON.parse(data) : defaultConfig;
    } catch {
      return defaultConfig;
    }
  })();

  const [config, setConfig] = useState(savedConfig);
  const [activeTab, setActiveTab] = useState('missions');
  const [isAdmin, setIsAdmin] = useState(false);
  const [showAdminModal, setShowAdminModal] = useState(false);
  const [showBanner, setShowBanner] = useState(false);
  const [loading, setLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [authUser, setAuthUser] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [ranks, setRanks] = useState({ earners: [], referrers: [] });

  // ✅ Only clear config AFTER component mounts
  useEffect(() => {
    localStorage.removeItem("config"); // resets admin password
    setConfig(defaultConfig); // restore default config in state
  }, []);

  ...
};
          // Show banner whenever Missions tab is selected
          useEffect(() => {
            if (activeTab === 'missions' && user) {
              setShowBanner(true);
            }
          }, [activeTab, user]);

          useEffect(() => {
            const unsubAuth = auth.onAuthStateChanged((aUser) => {
              setAuthUser(aUser);
              if (aUser) {
                const userRef = db.ref(`users/${aUser.uid}`);
                userRef.on('value', (snap) => {
                  if (snap.exists()) {
                    setUser(snap.val());
                  }
                });
              } else {
                setUser(null);
              }
              setLoading(false);
            });

            db.ref('config').on('value', snap => snap.exists() && setConfig(prev => ({...prev, ...snap.val()})));
            db.ref('tasks').on('value', snap => setTasks(snap.exists() ? Object.values(snap.val()) : []));
            db.ref('taskSubmissions').on('value', snap => setSubmissions(snap.exists() ? Object.values(snap.val()) : []));
            
            db.ref('users').on('value', snap => {
              if (snap.exists()) {
                const all = Object.values(snap.val());
                setRanks({
                  earners: [...all].sort((a,b) => (b.points || 0) - (a.points || 0)).slice(0, 5),
                  referrers: [...all].sort((a,b) => (b.referralCount || 0) - (a.referralCount || 0)).slice(0, 5)
                });
              }
            });

            return () => { unsubAuth(); db.ref('config').off(); db.ref('tasks').off(); db.ref('taskSubmissions').off(); db.ref('users').off(); };
          }, []);

          const handleTaskSubmit = async (task, proofImg, email) => {
            const subId = db.ref('taskSubmissions').push().key;
            const submission = {
              id: subId, userId: user.id, username: user.username,
              taskId: task.id, taskTitle: task.title, reward: task.reward,
              signupEmail: email, status: Status.PENDING, createdAt: Date.now()
            };
            await db.ref(`taskSubmissions/${subId}`).set(submission);
            await db.ref(`users/${user.id}/taskStatuses/${task.id}`).set(Status.PENDING);
            
            await sendPhotoToTelegram(config.telegramBotToken, config.tgChatId, proofImg, 
              `📢 <b>TASK SUBMISSION</b>\n<b>Username:</b> @${user.username}\n<b>Mission:</b> ${task.title}\n<b>Email:</b> ${email || "N/A"}\n\nPlease verify in the Admin Dashboard.`);
            
            alert("Sent! Your proof is being verified.");
          };

          if (loading) return (
            <div className="h-screen w-full flex flex-col items-center justify-center bg-blue-900 text-white">
              <div className="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
              <p className="mt-4 text-xs font-black uppercase tracking-[0.3em]">Connecting...</p>
            </div>
          );

          if (!authUser) return <AuthScreen auth={auth} db={db} config={config} />;

          return (
            <div className="min-h-screen pb-24">
              <AdminAuthModal isOpen={showAdminModal} onClose={() => setShowAdminModal(false)} correctPass={config.adminPass} onAuth={() => { setIsAdmin(true); setActiveTab('admin'); }} />

              {showBanner && activeTab === 'missions' && (
                <div className="fixed inset-0 z-[3000] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-6">
                  <div className="w-full max-w-sm bnb-card p-6 space-y-5 text-center shadow-2xl animate-in zoom-in-95 duration-200">
                     <div className="w-16 h-16 bnb-gradient rounded-2xl flex items-center justify-center mx-auto mb-2"><Icon name="bell" size={32} className="text-white" /></div>
                     <h2 className="text-xl font-black text-blue-900">Official Channels</h2>
                     <p className="text-xs text-slate-500">Join our official communities to stay updated and track missions!</p>
                     
                     <div className="space-y-3">
                       {config.chan1Link && (
                         <a href={config.chan1Link} target="_blank" className="block w-full py-3 bg-blue-50 text-blue-700 rounded-xl font-black text-xs uppercase border border-blue-100 flex items-center justify-center space-x-2">
                           <Icon name="send" size={14}/> <span>{config.chan1Name}</span>
                         </a>
                       )}
                       {config.chan2Link && (
                         <a href={config.chan2Link} target="_blank" className="block w-full py-3 bg-blue-50 text-blue-700 rounded-xl font-black text-xs uppercase border border-blue-100 flex items-center justify-center space-x-2">
                           <Icon name="send" size={14}/> <span>{config.chan2Name}</span>
                         </a>
                       )}
                       {config.chan3Link && (
                         <a href={config.chan3Link} target="_blank" className="block w-full py-3 bg-blue-50 text-blue-700 rounded-xl font-black text-xs uppercase border border-blue-100 flex items-center justify-center space-x-2">
                           <Icon name="send" size={14}/> <span>{config.chan3Name}</span>
                         </a>
                       )}
                     </div>

                     <button onClick={() => setShowBanner(false)} className="w-full py-4 bnb-gradient rounded-xl font-black text-xs uppercase tracking-widest shadow-lg">Start Missions</button>
                  </div>
                </div>
              )}

              <header className="fixed top-0 left-0 right-0 h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-50">
                <div className="flex items-center space-x-2 select-none">
                  <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg"><Icon name="zap" size={16} className="text-white" fill="currentColor" /></div>
                  <span className="font-extrabold text-sm text-blue-900 tracking-tight">SPARK<span className="text-blue-400">BNB</span></span>
                </div>
                <div className="bg-blue-50 border border-blue-100 px-3 py-1 rounded-full flex items-center space-x-2">
                   <Icon name="database" size={12} className="text-blue-600" />
                   <span className="font-bold text-xs text-blue-800">{(user?.points || 0).toLocaleString()} <span className="text-[10px] opacity-60">PTS</span></span>
                </div>
              </header>

              <main className="max-w-md mx-auto pt-20 px-4">
                {activeTab === 'missions' && <MissionsView tasks={tasks} user={user} onSubmit={handleTaskSubmit} />}
                {activeTab === 'ranks' && <RanksView ranks={ranks} currentUserId={user?.id} />}
                {activeTab === 'wallet' && <WalletView user={user} config={config} db={db} />}
                {activeTab === 'account' && <AccountView user={user} config={config} onLogout={() => auth.signOut()} onDaily={() => {
                   const now = Date.now();
                   if (now - (user.lastDaily || 0) < 86400000) return alert("Come back tomorrow for your next reward!");
                   db.ref(`users/${user.id}`).update({ points: (user.points || 0) + (config.dailyBonus || 500), lastDaily: now });
                   alert(`Bonus of ${config.dailyBonus || 500} points claimed!`);
                }} isAdmin={isAdmin} onOpenAdmin={() => setShowAdminModal(true)} onGoAdmin={() => setActiveTab('admin')} />}
                {activeTab === 'admin' && isAdmin && <AdminPanel db={db} tasks={tasks} submissions={submissions} config={config} setConfig={setConfig} />}
              </main>

              <nav className="fixed bottom-4 left-4 right-4 h-16 bg-blue-900 rounded-2xl flex justify-around items-center px-2 shadow-2xl z-50">
                <NavBtn active={activeTab === 'missions'} onClick={() => setActiveTab('missions')} icon="target" label="Missions" />
                <NavBtn active={activeTab === 'ranks'} onClick={() => setActiveTab('ranks')} icon="trophy" label="Ranks" />
                <NavBtn active={activeTab === 'wallet'} onClick={() => setActiveTab('wallet')} icon="wallet" label="Wallet" />
                <NavBtn active={activeTab === 'account' || activeTab === 'admin'} onClick={() => setActiveTab('account')} icon="user" label="Profile" />
              </nav>
            </div>
          );
        };

        const NavBtn = ({ active, onClick, icon, label }) => (
          <button onClick={onClick} className={`flex flex-col items-center flex-1 py-2 transition-all ${active ? 'text-blue-400 scale-105' : 'text-blue-200/40'}`}>
            <Icon name={icon} size={20} fill={active ? "currentColor" : "none"} />
            <span className="text-[10px] font-bold mt-1 uppercase tracking-tighter">{label}</span>
          </button>
        );

        const MissionsView = ({ tasks, user, onSubmit }) => {
          const [selected, setSelected] = useState(null);
          const [email, setEmail] = useState('');
          const [img, setImg] = useState(null);
          const fileInput = useRef(null);

          return (
            <div className="space-y-4">
              <div className="bnb-card p-5 bnb-gradient shadow-md border-0">
                <h2 className="text-xl font-black uppercase">Earn Points</h2>
                <p className="text-xs text-white/80">Complete the missions below to grow your balance.</p>
              </div>

              {tasks.length === 0 && <p className="text-center py-10 text-slate-400">New missions coming soon!</p>}

              <div className="space-y-2">
                {tasks.map(t => {
                  const s = user?.taskStatuses?.[t.id] || 'AVAILABLE';
                  return (
                    <div key={t.id} className="bnb-card p-4 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><Icon name="check-circle" size={18} /></div>
                        <div>
                          <h4 className="font-bold text-sm text-slate-800">{t.title}</h4>
                          <div className="flex items-center space-x-2 mt-0.5">
                            <span className="text-[10px] font-black text-blue-600">+{t.reward} PTS</span>
                            {s !== 'AVAILABLE' && <span className={`status-badge status-${s.toLowerCase()}`}>{s}</span>}
                          </div>
                        </div>
                      </div>
                      {s === 'AVAILABLE' && <button onClick={() => { window.open(t.url, '_blank'); setSelected(t); }} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-bold text-xs uppercase shadow-sm">Start</button>}
                      {s === 'PENDING' && <Icon name="clock" className="text-blue-500 animate-pulse" size={18} />}
                      {s === 'APPROVED' && <Icon name="check-circle-2" className="text-green-500" size={20} />}
                      {s === 'DECLINED' && <button onClick={() => { window.open(t.url, '_blank'); setSelected(t); }} className="px-3 py-1.5 border border-red-200 text-red-600 rounded font-bold text-[10px] uppercase">Retry</button>}
                    </div>
                  );
                })}
              </div>

              {selected && (
                <div className="fixed inset-0 z-[4000] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                   <div className="w-full max-w-sm bnb-card p-6 space-y-4">
                      <div className="text-center">
                        <h3 className="text-lg font-black text-blue-900 uppercase">Mission Proof</h3>
                        <p className="text-xs text-slate-500 mt-1">Upload a screenshot as proof of completion.</p>
                      </div>
                      <div className="space-y-3">
                        <div className="img-preview-box" onClick={() => fileInput.current.click()}>
                          {img ? <img src={img} alt="Proof" /> : <div className="text-center text-slate-400"><Icon name="camera" size={32} className="mx-auto mb-2 opacity-20" /><p className="text-[10px] font-black uppercase">Tap to upload proof</p></div>}
                        </div>
                        <input type="file" hidden ref={fileInput} accept="image/*" onChange={e => {
                          const file = e.target.files[0];
                          if (file) {
                            const reader = new FileReader();
                            reader.onloadend = () => setImg(reader.result);
                            reader.readAsDataURL(file);
                          }
                        }} />
                        <input className="form-input" placeholder="Your Signup Email..." value={email} onChange={e => setEmail(e.target.value)} />
                      </div>
                      <div className="flex space-x-2">
                        <button onClick={() => { setSelected(null); setImg(null); }} className="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold uppercase text-xs">Back</button>
                        <button disabled={!img} onClick={() => { onSubmit(selected, img, email); setSelected(null); setImg(null); setEmail(''); }} className={`flex-1 py-3 rounded-xl font-bold uppercase text-xs shadow-lg ${img ? 'bnb-gradient' : 'bg-slate-200 text-slate-400'}`}>Verify</button>
                      </div>
                   </div>
                </div>
              )}
            </div>
          );
        };

        const RanksView = ({ ranks, currentUserId }) => (
          <div className="space-y-6 pt-2">
            <h2 className="text-center font-black text-xs text-blue-900/40 uppercase tracking-[0.2em]">Top Rankers</h2>
            
            <div className="space-y-4">
              <div>
                <p className="text-[10px] font-black uppercase text-slate-400 mb-2 ml-1 tracking-widest">Points Leaders</p>
                <div className="bnb-card overflow-hidden">
                  {ranks.earners.map((u, i) => (
                    <div key={u.id} className={`flex items-center justify-between p-4 border-b border-slate-50 last:border-0 ${u.id === currentUserId ? 'bg-blue-50/50' : ''}`}>
                      <div className="flex items-center space-x-3">
                        <span className={`text-sm font-black w-5 text-center ${i === 0 ? 'text-blue-600' : 'text-slate-300'}`}>{i + 1}</span>
                        <p className="font-bold text-sm text-slate-800">@{u.username}</p>
                      </div>
                      <p className="font-black text-xs text-slate-900">{u.points.toLocaleString()} <span className="opacity-30 font-normal">PTS</span></p>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <p className="text-[10px] font-black uppercase text-slate-400 mb-2 ml-1 tracking-widest">Top Inviters</p>
                <div className="bnb-card overflow-hidden">
                  {ranks.referrers.map((u, i) => (
                    <div key={u.id} className={`flex items-center justify-between p-4 border-b border-slate-50 last:border-0 ${u.id === currentUserId ? 'bg-blue-50/50' : ''}`}>
                      <div className="flex items-center space-x-3">
                        <span className={`text-sm font-black w-5 text-center ${i === 0 ? 'text-blue-600' : 'text-slate-300'}`}>{i + 1}</span>
                        <p className="font-bold text-sm text-slate-800">@{u.username}</p>
                      </div>
                      <p className="font-black text-xs text-slate-900">{u.referralCount || 0} <span className="opacity-30 font-normal">INVITES</span></p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );

        const WalletView = ({ user, config, db }) => {
          const [addr, setAddr] = useState('');
          const [working, setWorking] = useState(false);
          const pts = user?.points || 0;
          const val = pts / config.pointsToBnbRate;
          const done = Object.values(user?.taskStatuses || {}).filter(s => s === 'APPROVED').length;
          const refs = user?.referralCount || 0;
          
          const ready = pts >= config.minWithdrawalPoints && 
                        done >= (config.minTasksForWithdrawal || 0) &&
                        refs >= (config.minReferralsForWithdrawal || 0);
          
          const handleWithdrawal = async () => {
            if (!addr.startsWith('0x')) return alert("Enter a valid BEP-20 wallet address.");
            setWorking(true);
            try {
              const id = db.ref('withdrawals').push().key;
              await db.ref(`withdrawals/${id}`).set({
                id, userId: user.id, username: user.username, address: addr, bnb: val.toFixed(6), status: Status.PENDING, createdAt: Date.now()
              });
              await db.ref(`users/${user.id}`).update({ points: 0 });
              
              const targetChat = config.tgPayoutChatId || config.tgChatId;
              await sendToTelegram(config.telegramBotToken, targetChat, 
                `💰 <b>PAYOUT REQUEST</b>\n<b>User:</b> @${user.username}\n<b>Amount:</b> ${val.toFixed(6)} BNB\n<b>Address:</b> ${addr}`);
              
              alert("Withdrawal request logged! Verification in progress.");
              setAddr('');
            } finally { setWorking(false); }
          };

          return (
            <div className="space-y-4 pt-2">
              <div className="bnb-card p-6 bnb-gradient text-center shadow-lg border-0">
                 <p className="text-[10px] font-bold uppercase tracking-widest text-white/50 mb-1">Current Balance</p>
                 <div className="flex items-center justify-center space-x-2">
                   <h3 className="text-3xl font-black">{val.toFixed(6)}</h3>
                   <span className="text-xs font-bold opacity-60 mt-1">BNB</span>
                 </div>
              </div>

              <div className="grid grid-cols-3 gap-2">
                 <div className="bnb-card p-3 text-center">
                    <p className="text-[8px] font-black text-slate-400 uppercase">Points</p>
                    <p className="text-sm font-black text-blue-900">{pts.toLocaleString()}</p>
                 </div>
                 <div className="bnb-card p-3 text-center">
                    <p className="text-[8px] font-black text-slate-400 uppercase">Missions</p>
                    <p className="text-sm font-black text-blue-900">{done}/{config.minTasksForWithdrawal}</p>
                 </div>
                 <div className="bnb-card p-3 text-center">
                    <p className="text-[8px] font-black text-slate-400 uppercase">Invites</p>
                    <p className="text-sm font-black text-blue-900">{refs}/{config.minReferralsForWithdrawal}</p>
                 </div>
              </div>

              <div className="bnb-card p-5 space-y-4">
                 <div>
                   <label className="text-[10px] font-black text-slate-400 uppercase ml-1">BEP-20 Wallet Address</label>
                   <input className="form-input mt-1 font-mono text-xs" placeholder="0x..." value={addr} onChange={e => setAddr(e.target.value)} />
                 </div>
                 <button onClick={handleWithdrawal} disabled={!ready || working} className={`w-full py-4 rounded-xl font-black uppercase text-xs tracking-widest transition-all active:scale-95 ${ready ? 'bnb-gradient shadow-xl' : 'bg-slate-100 text-slate-300'}`}>
                   {working ? '...' : (ready ? 'Withdraw' : 'Unlock Account')}
                 </button>
                 {!ready && (
                   <div className="text-center space-y-1">
                     <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Needed: {config.minWithdrawalPoints.toLocaleString()} PTS, {config.minTasksForWithdrawal} Missions & {config.minReferralsForWithdrawal} Invites</p>
                   </div>
                 )}
              </div>
            </div>
          );
        };

        const AccountView = ({ user, onLogout, onDaily, config, isAdmin, onOpenAdmin, onGoAdmin }) => {
          const refLink = `${window.location.origin}${window.location.pathname}?ref=${user?.username}`;
          const timerRef = useRef(null);

          const handleLongPressStart = () => {
            timerRef.current = setTimeout(() => {
              if (isAdmin) {
                onGoAdmin();
              } else {
                onOpenAdmin();
              }
            }, 3000);
          };

          const handleLongPressEnd = () => {
            if (timerRef.current) clearTimeout(timerRef.current);
          };

          return (
            <div className="space-y-4 pt-4">
              <div 
                className="flex flex-col items-center space-y-2 mb-6 select-none cursor-pointer"
                onMouseDown={handleLongPressStart}
                onMouseUp={handleLongPressEnd}
                onTouchStart={handleLongPressStart}
                onTouchEnd={handleLongPressEnd}
              >
                <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-blue-600/20"><Icon name="user" size={32} /></div>
                <div className="text-center">
                  <h2 className="text-lg font-black text-blue-900">@{user?.username}</h2>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Active Member</p>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                 <button onClick={onDaily} className="bnb-card p-4 bnb-gradient text-center shadow-md active:scale-95 transition-transform">
                   <Icon name="gift" size={20} className="mx-auto mb-1" />
                   <p className="text-[9px] font-black uppercase text-white/50">Daily Gift</p>
                   <p className="text-sm font-black">Claim</p>
                 </button>
                 <div className="bnb-card p-4 text-center">
                   <Icon name="users" size={20} className="mx-auto mb-1 text-blue-600" />
                   <p className="text-[9px] font-black uppercase text-slate-400">Invites</p>
                   <p className="text-sm font-black text-slate-900">{user?.referralCount || 0}</p>
                 </div>
              </div>

              <div className="bnb-card p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Your Referral Link</span>
                  <button onClick={() => { navigator.clipboard.writeText(refLink); alert("Copied!"); }} className="text-blue-600 font-bold text-[10px] uppercase">Copy</button>
                </div>
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                  <p className="text-[10px] font-mono text-slate-400 truncate">{refLink}</p>
                </div>
                <p className="text-[10px] text-slate-500 font-bold italic text-center">Earn {config.referralBonus.toLocaleString()} points for every referral!</p>
              </div>

              <div className="pt-4 space-y-2">
                 <button onClick={onLogout} className="w-full py-3 bg-red-50 text-red-500 rounded-xl font-black uppercase text-[10px] tracking-widest">Logout</button>
              </div>
            </div>
          );
        };

        const AdminPanel = ({ db, tasks, submissions, config, setConfig }) => {
          const [wd, setWd] = useState([]);
          const [tab, setTab] = useState('review');
          const [editing, setEditing] = useState(null);

          useEffect(() => {
            db.ref('withdrawals').on('value', s => setWd(s.exists() ? Object.values(s.val()).reverse() : []));
            return () => db.ref('withdrawals').off();
          }, []);

          const updateConf = (key, val) => {
            db.ref('config').update({ [key]: val });
            setConfig({ ...config, [key]: val });
            alert("Saved!");
          };

          const handleApproval = async (s, action) => {
            if (action === 'APPROVE') {
              await db.ref(`taskSubmissions/${s.id}`).update({ status: Status.APPROVED });
              await db.ref(`users/${s.userId}/taskStatuses/${s.taskId}`).set(Status.APPROVED);
              const uRef = db.ref(`users/${s.userId}`);
              const uS = await uRef.once('value');
              await uRef.update({ points: (uS.val().points || 0) + Number(s.reward) });
            } else {
              await db.ref(`taskSubmissions/${s.id}`).update({ status: Status.DECLINED });
              await db.ref(`users/${s.userId}/taskStatuses/${s.taskId}`).set(Status.DECLINED);
            }
          };

          const handlePay = async (w, action) => {
            await db.ref(`withdrawals/${w.id}`).update({ status: action });
          };

          return (
            <div className="space-y-4 pt-2">
               <div className="flex bg-slate-200 p-1 rounded-xl space-x-1">
                  {['review', 'tasks', 'payouts', 'config'].map(t => (
                    <button key={t} onClick={() => setTab(t)} className={`flex-1 py-1.5 rounded-lg font-black text-[9px] uppercase ${tab === t ? 'bg-slate-900 text-blue-400' : 'text-slate-500'}`}>{t}</button>
                  ))}
               </div>

               {tab === 'review' && (
                 <div className="space-y-3">
                   {submissions.filter(s => s.status === Status.PENDING).map(s => (
                     <div key={s.id} className="bnb-card p-4 space-y-3">
                        <div className="flex justify-between items-start">
                           <div>
                              <p className="text-[10px] font-black text-blue-600 uppercase">@{s.username}</p>
                              <h4 className="font-bold text-xs text-slate-800">{s.taskTitle}</h4>
                           </div>
                        </div>
                        <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 text-[10px]">
                           <p className="opacity-40 uppercase font-black mb-1">Signup Email:</p>
                           <p className="font-bold text-slate-700 break-all">{s.signupEmail || "N/A"}</p>
                           <p className="mt-2 text-blue-400 italic font-bold">Check Telegram for screenshot proof.</p>
                        </div>
                        <div className="flex space-x-2">
                           <button onClick={() => handleApproval(s, 'DECLINE')} className="flex-1 py-2.5 bg-red-50 text-red-600 font-black text-[10px] uppercase rounded-lg">Reject</button>
                           <button onClick={() => handleApproval(s, 'APPROVE')} className="flex-1 py-2.5 bnb-gradient text-white font-black text-[10px] uppercase rounded-lg">Approve</button>
                        </div>
                     </div>
                   ))}
                   {submissions.filter(s => s.status === Status.PENDING).length === 0 && <p className="text-center py-10 opacity-30 text-xs font-bold uppercase">No pending reviews</p>}
                 </div>
               )}

               {tab === 'tasks' && (
                 <div className="space-y-3">
                    <button onClick={() => setEditing({ title: '', url: '', reward: 1000 })} className="w-full py-3 bg-slate-900 text-blue-400 rounded-xl font-black text-[10px] uppercase">+ New Mission</button>
                    {tasks.map(t => (
                      <div key={t.id} className="bnb-card p-3 flex justify-between items-center">
                         <div><p className="font-bold text-xs">{t.title}</p><p className="text-[10px] font-bold text-blue-600">{t.reward} PTS</p></div>
                         <div className="flex space-x-1">
                            <button onClick={() => setEditing(t)} className="p-2 text-slate-400"><Icon name="edit" size={14}/></button>
                            <button onClick={() => confirm("Delete task?") && db.ref(`tasks/${t.id}`).remove()} className="p-2 text-red-200"><Icon name="trash" size={14}/></button>
                         </div>
                      </div>
                    ))}
                 </div>
               )}

               {tab === 'payouts' && (
                  <div className="space-y-3">
                    {wd.map(p => (
                      <div key={p.id} className="bnb-card p-4 space-y-2">
                         <div className="flex justify-between items-center">
                            <span className="font-black text-xs">@{p.username}</span>
                            <span className={`status-badge status-${p.status.toLowerCase()}`}>{p.status}</span>
                         </div>
                         <p className="text-lg font-black">{p.bnb} BNB</p>
                         <p className="bg-slate-50 p-2 rounded text-[9px] font-mono break-all text-slate-400">{p.address}</p>
                         {p.status === Status.PENDING && (
                            <div className="flex space-x-2 pt-2">
                               <button onClick={() => handlePay(p, Status.DECLINED)} className="flex-1 py-2 bg-red-50 text-red-500 font-black text-[9px] uppercase rounded">Reject</button>
                               <button onClick={() => handlePay(p, Status.APPROVED)} className="flex-1 py-2 bnb-gradient font-black text-[9px] uppercase rounded">Mark Paid</button>
                            </div>
                         )}
                      </div>
                    ))}
                  </div>
               )}

               {tab === 'config' && (
                 <div className="bnb-card p-5 space-y-4">
                    <AdminItem label="Daily Bonus Amount (PTS)" value={config.dailyBonus} onSave={v => updateConf('dailyBonus', Number(v))} />
                    <AdminItem label="Min Points to Withdraw" value={config.minWithdrawalPoints} onSave={v => updateConf('minWithdrawalPoints', Number(v))} />
                    <AdminItem label="Min Missions to Withdraw" value={config.minTasksForWithdrawal} onSave={v => updateConf('minTasksForWithdrawal', Number(v))} />
                    <AdminItem label="Min Invites to Withdraw" value={config.minReferralsForWithdrawal} onSave={v => updateConf('minReferralsForWithdrawal', Number(v))} />
                    <AdminItem label="Invite Bonus (PTS)" value={config.referralBonus} onSave={v => updateConf('referralBonus', Number(v))} />
                    <AdminItem label="Admin Passkey" value={config.adminPass} onSave={v => updateConf('adminPass', v)} type="password" />
                    <AdminItem label="TG Bot Token" value={config.telegramBotToken} onSave={v => updateConf('telegramBotToken', v)} />
                    <AdminItem label="Missions Chat ID" value={config.tgChatId} onSave={v => updateConf('tgChatId', v)} />
                    <AdminItem label="Payouts Chat ID" value={config.tgPayoutChatId} onSave={v => updateConf('tgPayoutChatId', v)} />
                    <hr className="opacity-10"/>
                    <AdminItem label="Banner Channel 1 Name" value={config.chan1Name} onSave={v => updateConf('chan1Name', v)} />
                    <AdminItem label="Banner Channel 1 Link" value={config.chan1Link} onSave={v => updateConf('chan1Link', v)} />
                    <AdminItem label="Banner Channel 2 Name" value={config.chan2Name} onSave={v => updateConf('chan2Name', v)} />
                    <AdminItem label="Banner Channel 2 Link" value={config.chan2Link} onSave={v => updateConf('chan2Link', v)} />
                    <AdminItem label="Banner Channel 3 Name" value={config.chan3Name} onSave={v => updateConf('chan3Name', v)} />
                    <AdminItem label="Banner Channel 3 Link" value={config.chan3Link} onSave={v => updateConf('chan3Link', v)} />
                 </div>
               )}

               {editing && (
                 <div className="fixed inset-0 z-[4000] bg-slate-900/90 p-4 flex items-center justify-center">
                   <div className="w-full max-w-xs bnb-card p-6 space-y-4">
                     <h3 className="font-black text-sm uppercase text-center">Mission Details</h3>
                     <input className="form-input" placeholder="Title" value={editing.title} onChange={e=>setEditing({...editing, title: e.target.value})} />
                     <input className="form-input" placeholder="Mission Link" value={editing.url} onChange={e=>setEditing({...editing, url: e.target.value})} />
                     <input className="form-input" type="number" placeholder="Points Reward" value={editing.reward} onChange={e=>setEditing({...editing, reward: Number(e.target.value)})} />
                     <div className="flex space-x-2 pt-2">
                        <button onClick={()=>setEditing(null)} className="flex-1 py-3 bg-slate-100 rounded-xl font-black text-[10px] uppercase text-slate-500">Back</button>
                        <button onClick={() => { const id = editing.id || db.ref('tasks').push().key; db.ref(`tasks/${id}`).set({ ...editing, id }); setEditing(null); }} className="flex-1 py-3 bnb-gradient rounded-xl font-black text-[10px] uppercase">Save</button>
                     </div>
                   </div>
                 </div>
               )}
            </div>
          );
        };

        const AdminItem = ({ label, value, onSave, type="text" }) => {
          const [v, setV] = useState(value);
          useEffect(() => setV(value), [value]);
          return (
            <div className="space-y-1">
               <label className="text-[9px] font-black uppercase text-slate-400">{label}</label>
               <div className="flex space-x-2">
                  <input type={type} className="flex-1 form-input" value={v} onChange={e=>setV(e.target.value)} />
                  <button onClick={() => onSave(v)} className="p-2 bnb-gradient rounded-lg shadow"><Icon name="save" size={14}/></button>
               </div>
            </div>
          );
        };

        const AdminAuthModal = ({ isOpen, onClose, onAuth, correctPass }) => {
          const [p, setP] = useState('');
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-[5000] bg-slate-900/90 flex items-center justify-center p-4">
              <div className="w-full max-w-xs bnb-card p-6 space-y-4 shadow-2xl">
                <h3 className="text-sm font-black uppercase text-center text-blue-900">Admin Key</h3>
                <input autoFocus type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="Enter Passkey" className="form-input text-center font-bold tracking-widest" onKeyPress={e=>e.key === 'Enter' && (p === correctPass ? (onAuth(), onClose()) : alert("Access Denied"))} />
                <div className="flex space-x-2">
                  <button onClick={onClose} className="flex-1 py-3 bg-slate-100 rounded-xl font-black text-[10px] uppercase">Back</button>
                  <button onClick={() => p === correctPass ? (onAuth(), onClose()) : alert("Access Denied")} className="flex-1 py-3 bnb-gradient rounded-xl font-black text-[10px] uppercase">Login</button>
                </div>
              </div>
            </div>
          );
        };

        const AuthScreen = ({ auth, db, config }) => {
          const [isL, setIsL] = useState(true);
          const [em, setEm] = useState('');
          const [pw, setPw] = useState('');
          const [uname, setUname] = useState('');
          const [working, setWorking] = useState(false);

          const handleAuth = async (e) => {
            e.preventDefault();
            setWorking(true);
            try {
              if (isL) {
                await auth.signInWithEmailAndPassword(em, pw);
              } else {
                if (!uname || uname.length < 3) throw new Error("Please choose a longer username.");
                const cleanUname = uname.toLowerCase().trim().replace(/[^a-z0-9_]/g, '');
                const uCheck = await db.ref('users').orderByChild('username').equalTo(cleanUname).once('value');
                if (uCheck.exists()) throw new Error("This username is already taken.");

                const cred = await auth.createUserWithEmailAndPassword(em, pw);
                const data = {
                  id: cred.user.uid,
                  username: cleanUname,
                  points: 100,
                  taskStatuses: {}, referralCount: 0, lastDaily: 0, joinedAt: Date.now()
                };
                await db.ref(`users/${cred.user.uid}`).set(data);
                
                const params = new URLSearchParams(window.location.search);
                const refBy = params.get('ref');
                if (refBy) {
                   const refSnap = await db.ref('users').orderByChild('username').equalTo(refBy).once('value');
                   if (refSnap.exists()) {
                      const key = Object.keys(refSnap.val())[0];
                      const current = refSnap.val()[key];
                      await db.ref(`users/${key}`).update({
                         points: (current.points || 0) + config.referralBonus,
                         referralCount: (current.referralCount || 0) + 1
                      });
                   }
                }
              }
            } catch (err) { alert(err.message); }
            finally { setWorking(false); }
          };

          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
               <div className="w-full max-w-xs space-y-6">
                 <div className="text-center">
                    <div className="w-14 h-14 bnb-gradient rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-xl"><Icon name="zap" size={28} className="text-white" fill="currentColor" /></div>
                    <h1 className="text-2xl font-black text-blue-900 tracking-tighter">SPARK<span className="text-blue-400">BNB</span></h1>
                    <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Join the Reward Network</p>
                 </div>

                 <div className="bnb-card p-6 space-y-4 shadow-lg border-slate-200">
                    <form onSubmit={handleAuth} className="space-y-3">
                       {!isL && (
                         <div>
                            <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Unique Username</label>
                            <input type="text" value={uname} onChange={e=>setUname(e.target.value)} placeholder="yourname" className="form-input mt-1" required={!isL} />
                         </div>
                       )}
                       <div>
                          <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Email</label>
                          <input type="email" value={em} onChange={e=>setEm(e.target.value)} placeholder="me@email.com" className="form-input mt-1" required />
                       </div>
                       <div>
                          <label className="text-[10px] font-black uppercase text-slate-400 ml-1">Password</label>
                          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" className="form-input mt-1" required />
                       </div>
                       <button type="submit" disabled={working} className="w-full bnb-gradient py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl mt-2 active:scale-95 transition-all">{working ? '...' : (isL ? 'Login' : 'Join Now')}</button>
                    </form>
                    <button onClick={() => setIsL(!isL)} className="w-full text-[10px] text-slate-400 font-bold uppercase tracking-widest hover:text-blue-600 transition-colors">{isL ? "Need an account? Sign Up" : "Back to Login"}</button>
                 </div>
               </div>
            </div>
          );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
