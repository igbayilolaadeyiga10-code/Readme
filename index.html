<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Vest</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body { background:#0f172a; color:white; }
.card { background:#1e293b; padding:15px; border-radius:12px; margin-bottom:10px; }
.btn { background:#22c55e; padding:8px; border-radius:6px; margin:3px; }
.admin { background:#111827; padding:10px; border-radius:10px; }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCTcEsTD-S1OhhcRJnLi4LmOoah2nEKXoY",
  authDomain: "bluepeak-57ba6.firebaseapp.com",
  databaseURL: "https://bluepeak-57ba6-default-rtdb.firebaseio.com",
  projectId: "bluepeak-57ba6",
  storageBucket: "bluepeak-57ba6.firebasestorage.app",
  messagingSenderId: "282378073862",
  appId: "1:282378073862:web:14a65788b52565a4a5d087"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_UID = "admin123"; // 🔐 CHANGE THIS TO YOUR UID

const App = () => {

  const [user,setUser] = React.useState(null);
  const [users,setUsers] = React.useState([]);
  const [deposits,setDeposits] = React.useState([]);
  const [withdraws,setWithdraws] = React.useState([]);
  const [admin,setAdmin] = React.useState(false);

  const uid = localStorage.getItem("uid") || "u_" + Math.random().toString(36).slice(2);
  localStorage.setItem("uid", uid);

  React.useEffect(()=>{

    db.ref("users/"+uid).once("value",snap=>{
      if(!snap.exists()){
        db.ref("users/"+uid).set({
          balance:0,
          depositBalance:0
        });
      }
    });

    db.ref("users/"+uid).on("value",snap=>{
      setUser({uid,...snap.val()});
    });

    // 🔥 LOAD ADMIN DATA
    db.ref("users").on("value",snap=>{
      if(snap.exists()){
        const data = snap.val();
        setUsers(Object.keys(data).map(k=>({id:k,...data[k]})));
      }
    });

    db.ref("deposits").on("value",snap=>{
      if(snap.exists()){
        const data = snap.val();
        setDeposits(Object.keys(data).map(k=>({id:k,...data[k]})));
      }
    });

    db.ref("withdraws").on("value",snap=>{
      if(snap.exists()){
        const data = snap.val();
        setWithdraws(Object.keys(data).map(k=>({id:k,...data[k]})));
      }
    });

  },[]);

  // 🔐 ADMIN LOGIN
  const loginAdmin = ()=>{
    if(uid === ADMIN_UID){
      setAdmin(true);
    } else {
      alert("Not admin");
    }
  };

  // 💰 APPROVE DEPOSIT
  const approveDeposit = (dep)=>{
    db.ref("users/"+dep.uid).transaction(u=>{
      if(u){
        u.depositBalance = (u.depositBalance||0) + dep.amount;
      }
      return u;
    });

    db.ref("deposits/"+dep.id).update({status:"approved"});
  };

  // ❌ REJECT DEPOSIT
  const rejectDeposit = (dep)=>{
    db.ref("deposits/"+dep.id).update({status:"rejected"});
  };

  // 🏦 APPROVE WITHDRAW
  const approveWithdraw = (w)=>{
    db.ref("withdraws/"+w.id).update({status:"paid"});
  };

  // ❌ REJECT WITHDRAW
  const rejectWithdraw = (w)=>{
    db.ref("users/"+w.uid).transaction(u=>{
      if(u){
        u.balance += w.amount;
      }
      return u;
    });

    db.ref("withdraws/"+w.id).update({status:"rejected"});
  };

  // 💸 REQUEST WITHDRAW
  const withdraw = ()=>{
    const amt = prompt("Enter amount");
    if(!amt) return;

    if(amt > user.balance) return alert("Insufficient");

    const id = "wd_"+Date.now();

    db.ref("withdraws/"+id).set({
      uid,
      amount:Number(amt),
      status:"pending"
    });

    db.ref("users/"+uid).update({
      balance:user.balance - amt
    });
  };

  if(!user) return <h2>Loading...</h2>;

  return (
    <div style={{padding:"15px"}}>

      <h2>Balance: ₦{user.balance}</h2>

      <button className="btn" onClick={withdraw}>Withdraw</button>
      <button className="btn" onClick={loginAdmin}>Admin Login</button>

      {/* 🔥 ADMIN PANEL */}
      {admin && (
        <div className="admin">

          <h2>ADMIN PANEL</h2>

          <h3>Users</h3>
          {users.map(u=>(
            <div key={u.id}>
              {u.id} - ₦{u.balance}
            </div>
          ))}

          <h3>Deposits</h3>
          {deposits.map(d=>(
            <div key={d.id}>
              {d.uid} - ₦{d.amount} - {d.status}
              {d.status==="pending" && (
                <>
                  <button className="btn" onClick={()=>approveDeposit(d)}>Approve</button>
                  <button className="btn" onClick={()=>rejectDeposit(d)}>Reject</button>
                </>
              )}
            </div>
          ))}

          <h3>Withdrawals</h3>
          {withdraws.map(w=>(
            <div key={w.id}>
              {w.uid} - ₦{w.amount} - {w.status}
              {w.status==="pending" && (
                <>
                  <button className="btn" onClick={()=>approveWithdraw(w)}>Pay</button>
                  <button className="btn" onClick={()=>rejectWithdraw(w)}>Reject</button>
                </>
              )}
            </div>
          ))}

        </div>
      )}

    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
  </html>
