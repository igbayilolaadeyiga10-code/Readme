<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PalazoCash</title>

<style>
:root{
  --blue:#2563eb;
  --blue2:#38bdf8;
  --dark:#0f172a;
  --muted:#718096;
  --bg:#f7f9fe;
  --white:#fff;
  --line:#e5eaf2;
  --soft:#eef5ff;
  --green:#16a34a;
  --red:#dc2626;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--dark);
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
}

/* =========================
   AUTH PAGES
========================= */

.auth-page{
  min-height:100vh;
  padding:55px 20px 30px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.auth-logo{
  width:78px;
  height:78px;
  border-radius:23px;
  background:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 10px 35px #2563eb18;
  margin-bottom:25px;
}

.auth-logo span{
  color:var(--blue);
  font-size:29px;
  font-weight:900;
  font-style:italic;
}

.auth-title{
  font-size:35px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:-1px;
  margin:0 0 9px;
  text-align:center;
}

.auth-sub{
  font-size:16px;
  color:var(--muted);
  margin:0 0 35px;
  text-align:center;
}

.form-card{
  width:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:28px;
  padding:25px;
  box-shadow:0 12px 35px #173b7a0b;
}

.label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin:0 0 8px;
}

.input{
  width:100%;
  height:55px;
  border:1px solid #e2e7ef;
  border-radius:15px;
  background:#fff;
  padding:0 15px;
  outline:none;
  font-size:15px;
  color:var(--dark);
  margin-bottom:17px;
}

.input:focus{
  border-color:#76a3ff;
  box-shadow:0 0 0 3px #2563eb12;
}

.btn{
  width:100%;
  height:55px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;
  font-weight:900;
  font-size:16px;
  box-shadow:0 8px 20px #2563eb25;
}

.btn:disabled{
  opacity:.5;
}

.btn.secondary{
  background:#f4f8ff;
  color:var(--blue);
  border:1px solid #dbe7ff;
  box-shadow:none;
}

.auth-foot{
  text-align:center;
  color:#8995a7;
  font-size:14px;
  margin-top:23px;
}

.link{
  color:var(--blue);
  font-weight:900;
  cursor:pointer;
}

.notice{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:15px;
}

/* =========================
   DASHBOARD HEADER
========================= */

.header{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 17px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:white;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:900;
}

.brand h1{
  font-size:17px;
  margin:0;
}

.brand small{
  font-size:10px;
  color:var(--muted);
}

.header-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--line);
  font-size:19px;
}

/* =========================
   DASHBOARD
========================= */

.main{
  padding:16px 16px 100px;
}

.activated{
  background:#ecfdf3;
  border:1px solid #a7f3d0;
  border-radius:18px;
  padding:15px;
  margin-bottom:16px;
  color:#166534;
}

.activated b{
  display:block;
  margin-bottom:5px;
}

.activated span{
  font-size:12px;
  color:#3d7a59;
}

.balance-card{
  background:linear-gradient(135deg,#1d4ed8,#38bdf8);
  color:#fff;
  border-radius:25px;
  padding:22px;
  margin-bottom:17px;
  box-shadow:0 15px 35px #2563eb28;
}

.balance-label{
  font-size:12px;
  opacity:.8;
}

.total{
  font-size:37px;
  font-weight:900;
  margin:8px 0 18px;
}

.wallets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.wallet{
  background:#ffffff1c;
  border:1px solid #ffffff25;
  border-radius:15px;
  padding:11px 9px;
}

.wallet small{
  display:block;
  font-size:10px;
  opacity:.8;
}

.wallet b{
  display:block;
  font-size:13px;
  margin-top:6px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.tile{
  border:1px solid var(--line);
  background:#fff;
  border-radius:19px;
  padding:15px 5px;
  text-align:center;
  box-shadow:0 7px 20px #173b7a07;
}

.tile-icon{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--soft);
  color:var(--blue);
  display:grid;
  place-items:center;
  margin:auto auto 9px;
  font-size:20px;
}

.tile b{
  display:block;
  font-size:12px;
}

.tile small{
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-top:4px;
}

.ad-box{
  margin-top:16px;
  background:linear-gradient(135deg,#dbeafe,#eff6ff);
  border:1px solid #bfdbfe;
  border-radius:20px;
  padding:17px;
  color:#1e40af;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.ad-box b{
  display:block;
  font-size:13px;
}

.ad-box span{
  font-size:10px;
  color:#64748b;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(500px,calc(100% - 20px));
  height:67px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  box-shadow:0 15px 35px #173b7a20;
}

.nav{
  border:0;
  background:none;
  color:#7c8798;
  font-size:9px;
  font-weight:800;
}

.nav.active{
  color:var(--blue);
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

/* =========================
   CONTENT CARDS
========================= */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  padding:17px;
  margin-bottom:14px;
}

.title{
  font-size:20px;
  font-weight:900;
  margin:7px 0 14px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf0f5;
}

.row:last-child{
  border-bottom:0;
}

.muted{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   WELCOME POPUP
========================= */

.popup-overlay{
  position:fixed;
  inset:0;
  background:#0f172a88;
  display:grid;
  place-items:end center;
  padding:14px;
  z-index:500;
}

.popup-box{
  width:min(500px,100%);
  background:#fff;
  border-radius:27px;
  padding:22px;
  box-shadow:0 20px 60px #0004;
  animation:popupIn .25s ease;
}

@keyframes popupIn{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.popup-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.popup-head h2{
  margin:0;
  font-size:24px;
}

.close{
  border:0;
  background:#eef2f7;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.group-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.group-btn{
  height:52px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  font-weight:900;
}

.telegram{
  color:#1684ff;
}

.whatsapp{
  color:#16a34a;
}

.dismiss{
  margin-top:10px;
}

/* =========================
   ADMIN
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0006;
  display:grid;
  place-items:center;
  padding:15px;
  z-index:1000;
}

.modal-box{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:25px;
  padding:20px;
}

.admin-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.admin-head h2{
  margin:0;
}

.section{
  font-size:10px;
  color:var(--blue);
  text-transform:uppercase;
  font-weight:900;
  margin:5px 0 10px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.stat{
  background:#eef5ff;
  border-radius:14px;
  padding:12px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.stat b{
  display:block;
  color:var(--blue);
  font-size:16px;
  margin-top:4px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  background:#0f172a;
  color:#fff;
  padding:11px 16px;
  border-radius:13px;
  font-size:12px;
  font-weight:800;
  z-index:2000;
  white-space:nowrap;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .auth-title{
    font-size:31px;
  }

  .form-card{
    padding:20px;
  }

  .wallets{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal hidden"></div>

<script>

/* =========================================================
   PALAZOCASH CONFIGURATION
========================================================= */

const DEFAULT_CONFIG={

  appName:"PalazoCash",

  currency:"₦",

  telegramGroup:
  "https://t.me/+zLx4JFnc7oA3Y2Rk",

  whatsappGroup:
  "https://whatsapp.com/channel/0029VbDSI8HAInPgtyDPQU18",

  welcomeMessage:
  "Join our official communities for updates, support and announcements.",

  referralReward:50,

  pointsPerNaira:10,

  adReward:10,

  minWithdrawal:100,

  adminPin:"2025",

  devPin:"5050"

};

let config={
  ...DEFAULT_CONFIG
};

let users=[];
let currentUser=null;

let screen="register";

let tab="home";

let adminTaps=0;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){

  return String(value??"").replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m];

    }
  );

}

function money(amount){

  return config.currency+
  Number(amount||0).toLocaleString(
    undefined,
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}

function toast(message){

  const box=document.createElement("div");

  box.className="toast";

  box.textContent=message;

  document.body.appendChild(box);

  setTimeout(
    ()=>box.remove(),
    2500
  );

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadData(){

  try{

    const savedConfig=
      JSON.parse(
        localStorage.getItem("palazo_config")||"null"
      );

    if(savedConfig){

      config={
        ...DEFAULT_CONFIG,
        ...savedConfig
      };

    }

    users=
      JSON.parse(
        localStorage.getItem("palazo_users")||"[]"
      );

    const logged=
      JSON.parse(
        localStorage.getItem("palazo_current_user")||"null"
      );

    if(logged){

      const found=
        users.find(
          u=>u.id===logged.id
        );

      if(found){

        currentUser=found;

        screen="dashboard";

      }

    }

  }catch(error){

    console.log(error);

  }

}

function saveData(){

  localStorage.setItem(
    "palazo_users",
    JSON.stringify(users)
  );

}

function saveConfig(){

  localStorage.setItem(
    "palazo_config",
    JSON.stringify(config)
  );

}

function saveLogin(){

  if(currentUser){

    localStorage.setItem(
      "palazo_current_user",
      JSON.stringify({
        id:currentUser.id
      })
    );

  }

}


/* =========================================================
   REGISTER
========================================================= */

function registerUser(){

  const username=
    $("regUsername").value.trim();

  const email=
    $("regEmail").value.trim();

  const phone=
    $("regPhone").value.trim();

  const password=
    $("regPassword").value;

  const referral=
    $("regReferral").value.trim();

  if(
    !username||
    !email||
    !phone||
    !password
  ){

    return toast(
      "Please complete all required fields."
    );

  }

  if(password.length<8){

    return toast(
      "Password must be at least 8 characters."
    );

  }

  const exists=
    users.some(
      u=>
        u.username.toLowerCase()===
        username.toLowerCase()
        ||
        u.email.toLowerCase()===
        email.toLowerCase()
    );

  if(exists){

    return toast(
      "Username or email already exists."
    );

  }

  const newUser={

    id:
      "user_"+Date.now()+"_"+Math.random()
      .toString(36)
      .slice(2,8),

    username:username,

    email:email,

    phone:phone,

    password:password,

    referralCode:referral,

    balance:0,

    taskWallet:0,

    depositWallet:0,

    affiliateWallet:0,

    referrals:0,

    createdAt:Date.now(),

    banned:false

  };

  users.push(newUser);

  saveData();

  toast(
    "Account created successfully. Please login."
  );

  screen="login";

  render();

}


/* =========================================================
   LOGIN
========================================================= */

function loginUser(){

  const identity=
    $("loginIdentity").value.trim();

  const password=
    $("loginPassword").value;

  if(!identity||!password){

    return toast(
      "Enter your username/email and password."
    );

  }

  const found=
    users.find(
      u=>
        (
          u.username.toLowerCase()===
          identity.toLowerCase()
          ||
          u.email.toLowerCase()===
          identity.toLowerCase()
        )
        &&
        u.password===password
    );

  if(!found){

    return toast(
      "Invalid username/email or password."
    );

  }

  if(found.banned){

    return toast(
      "Your account has been banned."
    );

  }

  currentUser=found;

  saveLogin();

  screen="dashboard";

  tab="home";

  render();

  /*
    Welcome popup appears after successful login.
  */

  setTimeout(
    openWelcomePopup,
    250
  );

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  currentUser=null;

  localStorage.removeItem(
    "palazo_current_user"
  );

  screen="login";

  render();

}


/* =========================================================
   AUTH NAVIGATION
========================================================= */

function showRegister(){

  screen="register";

  render();

}

function showLogin(){

  screen="login";

  render();

}


/* =========================================================
   REGISTER PAGE
========================================================= */

function registerPage(){

  $("app").innerHTML=`

    <div class="app">

      <div class="auth-page">

        <div class="auth-logo">
          <span>P</span>
        </div>

        <h1 class="auth-title">
          Create account
        </h1>

        <p class="auth-sub">
          Start earning in minutes. No KYC required.
        </p>

        <div class="form-card">

          <label class="label">
            Username
          </label>

          <input
            id="regUsername"
            class="input"
            placeholder="e.g. john_doe"
          >

          <label class="label">
            Email Address
          </label>

          <input
            id="regEmail"
            class="input"
            type="email"
            placeholder="name@example.com"
          >

          <label class="label">
            Phone Number
          </label>

          <input
            id="regPhone"
            class="input"
            type="tel"
            inputmode="tel"
            placeholder="08123456789"
          >

          <label class="label">
            Password
          </label>

          <input
            id="regPassword"
            class="input"
            type="password"
            placeholder="At least 8 characters"
          >

          <label class="label">
            Referral Code
            <span style="font-weight:500;color:#8a96a8">
              (Optional)
            </span>
          </label>

          <input
            id="regReferral"
            class="input"
            placeholder="Enter referral code"
          >

          <button
            class="btn"
            onclick="registerUser()"
          >
            Create Account →
          </button>

          <div class="notice">
            Free sign up • Your account is ready after registration.
          </div>

          <div class="auth-foot">

            Already have an account?

            <span
              class="link"
              onclick="showLogin()"
            >
              Login
            </span>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   LOGIN PAGE
========================================================= */

function loginPage(){

  $("app").innerHTML=`

    <div class="app">

      <div
        class="auth-page"
        style="padding-top:90px"
      >

        <div class="auth-logo">
          <span>P</span>
        </div>

        <h1 class="auth-title">
          Welcome back
        </h1>

        <p class="auth-sub">
          Sign in to continue earning
        </p>

        <div class="form-card">

          <label class="label">
            Username or Email
          </label>

          <input
            id="loginIdentity"
            class="input"
            placeholder="Enter username or email"
          >

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center
            "
          >

            <label class="label">
              Password
            </label>

            <span
              class="link"
              style="font-size:13px"
              onclick="toast('Please contact support to reset your password.')"
            >
              Forgot?
            </span>

          </div>

          <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Enter password"
          >

          <button
            class="btn"
            onclick="loginUser()"
          >
            Login →
          </button>

          <div class="auth-foot">

            Don't have an account?

            <span
              class="link"
              onclick="showRegister()"
            >
              Create one
            </span>

          </div>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   TILE
========================================================= */

function tile(icon,title,sub,target){

  return `

    <button
      class="tile"
      onclick="changeTab('${target}')"
    >

      <div class="tile-icon">
        ${icon}
      </div>

      <b>${title}</b>

      <small>${sub}</small>

    </button>

  `;

}


/* =========================================================
   BOTTOM NAV
========================================================= */

function nav(id,icon,name){

  return `

    <button
      class="nav ${tab===id?"active":""}"
      onclick="
        ${id==="home"
          ?"goHome()"
          :"changeTab('"+id+"')"
        }
      "
    >

      <span class="nav-icon">
        ${icon}
      </span>

      ${name}

    </button>

  `;

}


/* =========================================================
   CHANGE TAB
========================================================= */

function changeTab(newTab){

  tab=newTab;

  render();

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  tab="home";

  render(
