<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EarnHub Cyber - Clean UI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

:root {
    --bg: #ffffff;
    --card: #f9fafb;
    --text: #222;
    --green: #16a34a;
    --green-dark: #15803d;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    font-size: 14px;
}

/* cards */
.cyber-card {
    background: var(--card);
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 12px;
}

/* buttons */
.btn-action {
    background: var(--green);
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    border: none;
    width: 100%;
}

.btn-action:active {
    background: var(--green-dark);
}

/* input */
.input-cyber {
    background: white;
    border: 1px solid #d1d5db;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
}

/* headers */
h1,h2,h3 {
    color: var(--green);
    font-weight: 600;
}

/* status */
.status-approved {
    background: #dcfce7;
    color: #166534;
    padding: 4px 8px;
    border-radius: 6px;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
    padding: 4px 8px;
    border-radius: 6px;
}

.status-declined {
    background: #fee2e2;
    color: #991b1b;
    padding: 4px 8px;
    border-radius: 6px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const App = () => {
    const [balance, setBalance] = useState(120);

    return (
        <div className="max-w-md mx-auto p-4 space-y-4">

            <h1 className="text-xl">EarnHub Dashboard</h1>

            <div className="cyber-card">
                <p>Balance</p>
                <h2 className="text-lg">{balance} USDT</h2>
            </div>

            <div className="cyber-card space-y-2">
                <p>Submit Proof</p>
                <input className="input-cyber" placeholder="Enter proof..." />
                <button className="btn-action">Submit</button>
            </div>

            <div className="cyber-card">
                <p>Status:</p>
                <span className="status-approved">Approved</span>
            </div>

            <button className="btn-action">Withdraw</button>

        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
