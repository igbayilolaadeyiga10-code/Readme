<title>PALAZZO</title>
<style>
:root{
  --blue:#2563eb;--blue2:#38bdf8;--navy:#10213f;--ink:#14213d;--muted:#718096;
  --bg:#f6f9ff;--card:#fff;--line:#e7edf7;--green:#16a673;--red:#e53935;
  --purple:#8b5cf6;--orange:#f59e0b;--pink:#ec4899;--cyan:#06b6d4;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(1px);pointer-events:none;z-index:0}
body:before{width:190px;height:190px;background:rgba(56,189,248,.08);top:18%;left:-70px;animation:floatA 9s ease-in-out infinite}
body:after{width:240px;height:240px;background:rgba(37,99,235,.06);right:-100px;bottom:18%;animation:floatB 11s ease-in-out infinite}
@keyframes floatA{50%{transform:translate(45px,80px) scale(1.08)}}
@keyframes floatB{50%{transform:translate(-45px,-60px) scale(.92)}}
.hidden{display:none!important}
#app{min-height:100vh;position:relative;z-index:1}
.topbar{height:72px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;user-select:none}
.brand-logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#174ee8,#38bdf8);color:#fff;display:grid;place-items:center;font-weight:1000;box-shadow:0 8px 20px rgba(37,99,235,.22)}
.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.top-actions{display:flex;gap:8px}.circle{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;font-size:19px}
main{width:min(760px,100%);margin:auto;padding:18px 16px 105px}
.card{background:rgba(255,255,255,.97);border:1px solid rgba(224,232,244,.95);border-radius:24px;box-shadow:var(--shadow);padding:19px;margin-bottom:15px}
.hero{color:#fff;background:linear-gradient(135deg,#183fc1 0%,#2563eb 48%,#38bdf8 100%);border:0;overflow:hidden;position:relative}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero:before{width:170px;height:170px;right:-55px;top:-80px}.hero:after{width:110px;height:110px;left:-45px;bottom:-55px}
.label,.section{font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.hero .label{color:rgba(255,255,255,.78)}
.balance-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.balance-big{font-size:34px;line-height:1.05;margin:9px 0 16px;font-weight:950;letter-spacing:-1.4px;position:relative;z-index:1}
.eye{width:39px;height:39px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.balance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;position:relative;z-index:1}
.balance-box{padding:12px;border-radius:16px;background:rgba(255,255,255,.13);min-width:0}
.balance-box small{display:block;color:rgba(255,255,255,.74);font-size:10px}.balance-box b{display:block;font-size:15px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.action{border:1px solid var(--line);background:#fff;border-radius:19px;padding:14px 8px;min-height:105px;text-align:center;box-shadow:0 7px 20px rgba(15,23,42,.05);transition:transform .12s,box-shadow .12s}
.action:active,.btn:active,.nav-btn:active,.circle:active,.icon-btn:active{transform:scale(.96)}
.action .ico{width:46px;height:46px;border-radius:15px;margin:0 auto 8px;display:grid;place-items:center;font-size:22px;color:#fff}
.action b{display:block;font-size:12px}.action small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.blue{background:linear-gradient(135deg,#2563eb,#38bdf8)}.green{background:linear-gradient(135deg,#10b981,#34d399)}
.orange{background:linear-gradient(135deg,#f59e0b,#fb923c)}.purple{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.pink{background:linear-gradient(135deg,#db2777,#f472b6)}.cyan{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.red{background:linear-gradient(135deg,#dc2626,#fb7185)}
.ad-banner{background:linear-gradient(135deg,#0f3cae,#2563eb 55%,#38bdf8);color:#fff;border:0}
.ad-banner .ad-row{display:flex;align-items:center;gap:13px}.ad-icon{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:27px}
.ad-banner h2{margin:0;font-size:17px}.ad-banner p{margin:4px 0 0;color:rgba(255,255,255,.75);font-size:12px}
.btn{width:100%;border:0;border-radius:15px;padding:13px 15px;background:linear-gradient(135deg,#2450df,#27a9f3);color:#fff;font-weight:900;box-shadow:0 9px 18px rgba(37,99,235,.18);transition:transform .12s,filter .12s}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid #cfe0ff;box-shadow:none}.btn.danger{background:#e72b31}.btn.green-btn{background:linear-gradient(135deg,#0e9f6e,#34d399)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input,.select,.textarea{width:100%;border:1px solid #dfe6f0;background:#fbfdff;border-radius:14px;padding:13px 14px;outline:0;color:var(--ink);margin:6px 0 12px}
.input:focus,.select:focus,.textarea:focus{border-color:#75a5f7;box-shadow:0 0 0 4px rgba(37,99,235,.08)}
.fieldlabel{font-weight:850;font-size:13px;margin:4px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.muted{color:var(--muted)}.title{font-size:20px;margin:4px 0 15px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;background:#eef4ff;color:var(--blue)}
.pill.pending{background:#fff7df;color:#b77900}.pill.paid,.pill.approved{background:#e7faf2;color:#0f8b61}.pill.declined,.pill.rejected{background:#fff0f0;color:#d62f2f}
.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30;display:flex;justify-content:center}
.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{border:0;background:transparent;color:#738096;font-weight:800;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .12s}
.nav-btn span{font-size:22px;line-height:1}.nav-btn.active{color:var(--blue)}.nav-dot{width:5px;height:5px;background:var(--blue);border-radius:50%;margin-top:-1px}
.toast{position:fixed;left:50%;bottom:93px;transform:translateX(-50%);background:#12233e;color:#fff;border-radius:14px;padding:11px 15px;font-size:12px;font-weight:800;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(8,20,45,.48);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:80}
.modal-box{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.close{width:38px;height:38px;border:0;border-radius:50%;background:#f2f5f9;font-size:22px;color:#526174}
.loader{width:54px;height:54px;border-radius:50%;border:5px solid #dce8ff;border-top-color:#2563eb;animation:spin .8s linear infinite;margin:8px auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}.pay-card{background:linear-gradient(135deg,#eef5ff,#fff);border:1px dashed #8fb4f4;border-radius:18px;padding:15px}.code{font-size:23px;letter-spacing:2px;font-weight:950;color:#245fdb}
.profile-top{text-align:center;padding-top:28px}.avatar{width:108px;height:108px;margin:auto;border-radius:50%;background:linear-gradient(135deg,#eaf0ff,#dfe9ff);display:grid;place-items:center;font-size:52px;color:#5e7190;box-shadow:inset 0 0 0 8px #fff,0 12px 30px rgba(37,99,235,.10)}
.profile-name{font-size:22px;font-weight:950;margin:16px 0 3px}
.notice{border-radius:17px;padding:13px;background:#f3f7ff;border:1px solid #d9e7ff;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f7faff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;font-size:17px;margin-top:4px}
.option-list .row{padding:16px 0}.option-icon{width:42px;height:42px;border-radius:14px;color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.admin-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:10px}.admin-tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;color:var(--muted)}.admin-tab.active{background:#eaf2ff;color:var(--blue);border-color:#c7dcff}
.price-chip{border:1px solid #dbe6f6;border-radius:13px;padding:12px;background:#fbfdff;display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.sharp-icon{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 5px;border-radius:8px;background:#eaf2ff;color:#2563eb;font-size:9px;font-weight:950;letter-spacing:.2px;vertical-align:middle}
.logo-tap{touch-action:manipulation}
.ripple{position:fixed;width:8px;height:8px;border-radius:50%;background:rgba(37,99,235,.28);pointer-events:none;transform:translate(-50%,-50%);animation:ripple .45s ease-out forwards;z-index:200}
@keyframes ripple{to{width:85px;height:85px;opacity:0}}
@media(max-width:430px){
 main{padding:14px 12px 100px}.card{border-radius:21px;padding:16px}.balance-big{font-size:34px}.quick{gap:8px}.action{min-height:96px;padding:11px 5px}.action .ico{width:42px;height:42px}.brand b{font-size:18px}
}

.task-card{background:#fff;border:1px solid #e8edf5;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 7px 20px rgba(15,23,42,.05);position:relative;overflow:hidden}
.task-card.boosted{border-color:#f1d68a;box-shadow:0 8px 24px rgba(245,158,11,.10)}

function register(){
 const username=document.getElementById("regUser").value.trim().replace(/\s+/g,"_");
 const email=document.getElementById("regEmail").value.trim(),phone=document.getElementById("regPhone").value.trim(),password=document.getElementById("regPass").value,ref=document.getElementById("regRef").value.trim();
 if(username.length<3||!email||password.length<8)return toast("Complete all required fields");
 if(users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast("Username already exists");
 const u=ensureUser({username,email,phone,password,referralCode:username.toUpperCase(),referrerCode:ref});
 users.push(u);save("palazo_users",users);session={username};saveSession(session);
 // Track the referrer. The signup itself does not pay a cash commission; investment/earning commissions are credited later.
 if(ref){const parent=users.find(x=>String(x.referralCode||x.username).toLowerCase()===ref.toLowerCase()||x.username.toLowerCase()===ref.toLowerCase());if(parent){u.referrerUsername=parent.username;parent.referrals=(parent.referrals||0)+1;save("palazo_users",users)}}
 toast("Account created successfully");render();
}
function login(){
  try{
    const userEl=document.getElementById("loginUser");
    const passEl=document.getElementById("loginPass");
    if(!userEl||!passEl)return toast("Login form is unavailable. Please reload.");
    const key=String(userEl.value||"").trim().toLowerCase();
    const pass=String(passEl.value||"");
    if(!key||!pass)return toast("Enter your username/email and password");

    users=load("palazo_users",users).map(ensureUser);
    const u=users.find(x=>{
      const username=String(x.username||"").trim().toLowerCase();
      const email=String(x.email||"").trim().toLowerCase();
      return username===key || email===key;
    });

    if(!u)return toast("Account not found. Check your username/email.");
    if(String(u.password||"")!==pass)return toast("Incorrect password");
    if(u.banned)return toast("Your account has been banned");

    session={username:u.username};
    saveSession(session);
    render();
    setTimeout(showCommunityPopup,120);
  }catch(err){
    console.error("PALAZZO login error:",err);
    toast("Login error. Please refresh and try again.");
  }
}

function claimDaily(){
 const u=me(),today=new Date().toISOString().slice(0,10);
 if(u.checkinDate===today)return toast('You already claimed today');
 u.checkinDate=today;u.earning+=20;u.transactions=u.transactions||[];u.transactions.unshift({type:'Daily check-in',amount:20,balance:'Task Balance',status:'approved',date:now()});persistUser(u);renderApp();toast('+₦20 daily reward credited');
}

function adsWatchedToday(u){
 const today=new Date().toISOString().slice(0,10);
 if(u.adWatchDate!==today){u.adWatchDate=today;u.adWatchCount=0;persistUser(u)}
 return Number(u.adWatchCount||0);
}

function startTask(id){

function submitTask(id){
 const t=(cfg.tasks||[]).find(x=>x.id===id),file=document.getElementById('taskFile')?.files?.[0];
 if(!t||!file)return toast('Upload your task screenshot');
 const u=me(),sub={id:'sub_'+Date.now(),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),fileName:file.name,status:'pending',date:now(),proof:''};
 const reader=new FileReader();reader.onload=()=>{sub.proof=reader.result;u.taskSubmissions.unshift(sub);u.transactions.unshift({type:'Task submitted',amount:0,balance:'Task Balance',status:'pending',date:now()});persistUser(u);closeModal();toast('Task submitted for admin approval');renderApp()};reader.onerror=()=>toast('Could not read screenshot');reader.readAsDataURL(file);

 <div class="card"><h2 style="margin:0 0 10px;font-size:17px">Referred Users (${referrals.length})</h2>${referrals.length?referrals.map(x=>{const dep=(x.deposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0)+(x.assetDeposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0);const wd=(x.withdrawals||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0);return `<div class="row"><div><b>@${esc(x.username)}</b><div class="muted">Deposit ${money(dep)} • Withdrawal ${money(wd)}</div></div><span class="pill approved">ACTIVE</span></div>`}).join(''):'<p class="muted">No referrals yet</p>'}</div>`;

function teamDepositTotal(username){
 const children=users.filter(x=>x.referrerUsername===username); let total=0;
 for(const child of children){ total+=Number((child.assetDeposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0)); total+=Number((child.deposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0)); total+=teamDepositTotal(child.username); }
 return total;
}
function claimTeamBonus(i){
 const u=me(),m=(cfg.teamMilestones||[])[i];if(!m)return;const team=teamDepositTotal(u.username);u.claimedTeamMilestones=u.claimedTeamMilestones||[];if(team<Number(m.deposit)||u.claimedTeamMilestones.includes(i))return toast('Milestone not available');u.claimedTeamMilestones.push(i);u.assetBalance=Number(u.assetBalance||0)+Number(m.bonus);u.transactions.unshift({type:'Team milestone bonus',amount:Number(m.bonus),balance:'Asset Balance',status:'approved',date:now()});persistUser(u);renderApp();toast('Team bonus added to Asset Balance');}

function accrueInvestments(u){
 u.investments=u.investments||[];let changed=false;const today=new Date().toISOString().slice(0,10);
 for(const inv of u.investments){if(inv.status!=='active')continue;let last=inv.lastReturnDate||inv.startDate||today;let d=new Date(last+'T00:00:00');const end=new Date(today+'T00:00:00');let days=Math.floor((end-d)/86400000);if(days>0){const earned=days*Number(inv.daily||0);u.assetBalance=Number(u.assetBalance||0)+earned;inv.totalReturned=Number(inv.totalReturned||0)+earned;inv.lastReturnDate=today;u.transactions.unshift({type:'Investment daily return',amount:earned,balance:'Asset Balance',status:'approved',date:now()});changed=true}}
 if(changed)persistUser(u);return u;
}

function buyInvestment(id){
 const u=me();accrueInvestments(u);const p=(cfg.investmentPackages||[]).find(x=>x.id===id);if(!p)return;if(Number(u.assetBalance||0)<Number(p.amount))return toast('Insufficient Asset Balance');
 u.assetBalance-=Number(p.amount);u.investments=u.investments||[];const today=new Date().toISOString().slice(0,10);u.investments.unshift({id:'inv_'+Date.now(),packageId:p.id,name:p.name,amount:Number(p.amount),daily:Number(p.daily),startDate:today,lastReturnDate:today,totalReturned:0,status:'active'});u.transactions.unshift({type:'Investment purchased',amount:-Number(p.amount),balance:'Asset Balance',status:'approved',date:now()});
 // 25% investment commission to the direct referrer, credited to Asset Balance.
 if(u.referrerUsername){const parent=users.find(x=>x.username===u.referrerUsername);if(parent){const bonus=Number(p.amount)*Number(cfg.assetReferralCommission||25)/100;parent.assetBalance=Number(parent.assetBalance||0)+bonus;parent.transactions=parent.transactions||[];parent.transactions.unshift({type:'Referral investment bonus',amount:bonus,balance:'Asset Balance',status:'approved',date:now(),from:u.username});}}
 persistUser(u);save('palazo_users',users);renderApp();toast('Investment purchased successfully');
}

function adjustUserBalance(username,sign){const u=users.find(x=>x.username===username),field=document.getElementById('balType').value,n=Number(document.getElementById('balAmt').value||0);if(!u||n<=0)return toast('Enter a valid amount');if(sign<0&&Number(u[field]||0)<n)return toast('Insufficient balance');u[field]=Number(u[field]||0)+(sign*n);u.transactions=u.transactions||[];u.transactions.unshift({type:sign>0?'Admin balance credit':'Admin balance deduction',amount:sign*n,balance:field,status:'approved',date:now()});save('palazo_users',users);toast(sign>0?'Balance added':'Balance deducted');closeModal();adminPanel()}

function tasksAdmin(){

}
function addTask(){
 const app=document.getElementById('taskPlatform').value,cat=document.getElementById('taskType').value,desc=document.getElementById('ntDesc').value.trim(),reward=Number(document.getElementById('ntReward').value),slots=Math.floor(Number(document.getElementById('ntSlots').value)||0),link=document.getElementById('ntLink').value.trim();
 if(!app||!cat||reward<=0||slots<1||!link||!desc)return toast('Complete all task fields');
 cfg.tasks.push({id:'t_'+Date.now(),app,category:cat,description:desc,reward,slots,completed:0,boosted:false,link,icon:(PLATFORM_META[app]||PLATFORM_META.Other).icon});save('palazo_config',cfg);toast('Task added');adminPanel();
}
function editTask(id){
 const t=cfg.tasks.find(x=>x.id===id);if(!t)return;const app=t.app||'Telegram';
 openModal(`<div class="modal-head"><div><div class="section">Task Management</div><h2 style="margin:0">Edit Task</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="fieldlabel">Platform</div><input type="hidden" id="etApp" value="${esc(app)}">${platformChoices(app,'editTask')}<div class="fieldlabel">Task Type</div><select id="etCat" class="select">${(TASK_TYPES[app]||[t.category]).map(x=>`<option ${x===t.category?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="etDesc" class="textarea">${esc(t.description||'')}</textarea><div class="grid2"><div><div class="fieldlabel">Reward</div><input id="etReward" class="input" type="number" step="0.01" value="${Number(t.reward||0)}"></div><div><div class="fieldlabel">Total Slots</div><input id="etSlots" class="input" type="number" value="${Number(t.slots||0)}"></div></div><div class="fieldlabel">Task Link</div><input id="etLink" class="input" value="${esc(t.link||'')}"><button class="btn" onclick="saveTaskEdit('${esc(id)}')">Save Task</button>`);

function saveTaskEdit(id){const t=cfg.tasks.find(x=>x.id===id);if(!t)return;t.app=document.getElementById('etApp').value;t.category=document.getElementById('etCat').value;t.description=document.getElementById('etDesc').value.trim();t.reward=Number(document.getElementById('etReward').value)||0;t.slots=Math.floor(Number(document.getElementById('etSlots').value)||0);t.link=document.getElementById('etLink').value.trim();t.icon=(PLATFORM_META[t.app]||PLATFORM_META.Other).icon;if(!t.app||!t.category||t.reward<=0||t.slots<1||!t.link||!t.description)return toast('Complete all task fields');save('palazo_config',cfg);closeModal();toast('Task updated');adminPanel()}

function approveTask(username,id){const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id),t=cfg.tasks.find(x=>x.id===s?.taskId);if(!u||!s||s.status!=='pending')return;if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast('This task has no slots left');s.status='approved';u.earning+=Number(s.reward||0);u.transactions.unshift({type:'Task reward approved',amount:Number(s.reward||0),balance:'Task Balance',status:'approved',date:now()});if(t)t.completed=Number(t.completed||0)+1;save('palazo_users',users);save('palazo_config',cfg);toast('Task approved and reward credited');adminPanel()}

function approveDeposit(username,id){
 const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!u||!d)return;
 d.status="approved";u.deposit+=Number(d.amount);u.transactions.unshift({type:"Deposit approved",amount:Number(d.amount),balance:"Deposit Balance",status:"approved",date:now()});if(u.referrerUsername){const parent=users.find(x=>x.username===u.referrerUsername);if(parent){const bonus=Number(d.amount)*Number(cfg.depositReferralCommission||25)/100;parent.affiliate=Number(parent.affiliate||0)+bonus;parent.assetBalance=Number(parent.assetBalance||0)+bonus;parent.totalReferralDeposits=Number(parent.totalReferralDeposits||0)+Number(d.amount);parent.transactions=parent.transactions||[];parent.transactions.unshift({type:"Referral deposit commission",amount:bonus,balance:"Affiliate Balance",status:"approved",date:now(),from:u.username});parent.transactions.unshift({type:"Referral deposit asset bonus",amount:bonus,balance:"Asset Balance",status:"approved",date:now(),from:u.username});}}save("palazo_users",users);toast("Deposit approved");adminPanel()
}

function saveAdEdit(id){const a=cfg.ads.find(x=>x.id===id);if(!a)return;a.app=document.getElementById('eaApp').value;a.category=document.getElementById('eaCat').value;a.price=Number(document.getElementById('eaPrice').value)||0;a.icon=(PLATFORM_META[a.app]||PLATFORM_META.Other).icon;if(!a.app||!a.category||a.price<=0)return toast('Complete category fields');save('palazo_config',cfg);closeModal();toast('Ad category updated');adminPanel()}
function deleteAdCategory(id){if(!confirm('Delete this ad category?'))return;cfg.ads=cfg.ads.filter(x=>x.id!==id);save('palazo_config',cfg);toast('Ad category deleted');adminPanel()}
function approveAdOrder(username,id){const u=users.find(x=>x.username===username),o=(u?.adOrders||[]).find(x=>x.id===id);if(!u||!o||o.status!=='pending')return;if(Number(u.deposit||0)<Number(o.price||0))return toast('User has insufficient Deposit Balance');u.deposit-=Number(o.price||0);o.status='approved';o.approvedDate=now();u.transactions.unshift({type:'Ad campaign approved',amount:-Number(o.price||0),balance:'Deposit Balance',status:'approved',date:now()});save('palazo_users',users);toast('Campaign approved and Deposit Balance deducted');adminPanel()}
function rejectAdOrder(username,id){const u=users.find(x=>x.username===username),o=(u?.adOrders||[]).find(x=>x.id===id);if(!u||!o||o.status!=='pending')return;o.status='rejected';o.rejectedDate=now();u.transactions.unshift({type:'Ad campaign rejected',amount:0,balance:'Deposit Balance',status:'rejected',date:now()});save('palazo_users',users);toast('Campaign rejected');adminPanel()}
function settingsAdmin(){
 return `<div class="card"><div class="section">Ads</div><div class="fieldlabel">Direct ad link</div><input id="setAdLink" class="input" value="${esc(cfg.adsDirectLink||'https://omg10.com/4/11681882')}"><div class="grid2"><div><div class="fieldlabel">Reward per ad</div><input id="setAdReward" class="input" type="number" value="${Number(cfg.adReward||10)}"></div><div><div class="fieldlabel">Daily ad limit</div><input id="setAdLimit" class="input" type="number" value="${Number(cfg.adDailyLimit||20)}"></div></div></div>
 <div class="card"><div class="section">Withdrawals</div><div class="grid2"><label class="notice"><input id="setTaskOpen" type="checkbox" ${cfg.taskWithdrawalOpen?"checked":""}> Task Open</label><label class="notice"><input id="setAffOpen" type="checkbox" ${cfg.affiliateWithdrawalOpen?"checked":""}> Affiliate Open</label><label class="notice"><input id="setAssetOpen" type="checkbox" ${cfg.assetWithdrawalOpen?"checked":""}> Asset Open</label><div><div class="fieldlabel">Task Minimum</div><input id="setTaskMin" class="input" type="number" value="${cfg.taskMinWithdrawal}"></div><div><div class="fieldlabel">Affiliate Minimum</div><input id="setAffMin" class="input" type="number" value="${cfg.affiliateMinWithdrawal}"></div><div><div class="fieldlabel">Asset Minimum</div><input id="setAssetMin" class="input" type="number" value="${cfg.assetMinWithdrawal}"></div></div></div>
 <div class="card"><div class="section">Referral</div><div class="fieldlabel">Reward per successful referral</div><input id="setRef" class="input" type="number" value="${cfg.referralReward}"><p class="muted" style="font-size:11px">No activation payment is required.</p></div>
 <div class="card"><div class="section">Deposits</div><div class="fieldlabel">Minimum deposit</div><input id="setMinDep" class="input" type="number" value="${cfg.minDeposit}"><div class="fieldlabel">Deposit presets (comma separated)</div><input id="setPresets" class="input" value="${(cfg.depositPresets||[]).join(",")}"></div>
 <div class="card"><div class="section">Payment Details</div><div class="fieldlabel">Bank Name</div><input id="setBank" class="input" value="${esc(cfg.paymentBank)}"><div class="fieldlabel">Account Number</div><input id="setAcc" class="input" value="${esc(cfg.paymentAccount)}"><div class="fieldlabel">Account Name</div><input id="setName" class="input" value="${esc(cfg.paymentName)}"></div>
 <div class="card"><div class="section">Asset Deposit Payment</div><div class="fieldlabel">Bank Name</div><input id="setAssetBank" class="input" value="${esc(cfg.assetPaymentBank)}"><div class="fieldlabel">Account Number</div><input id="setAssetAcc" class="input" value="${esc(cfg.assetPaymentAccount)}"><div class="fieldlabel">Account Name</div><input id="setAssetName" class="input" value="${esc(cfg.assetPaymentName)}"></div>
 <div class="card"><div class="section">Investment Referral Commission (%)</div><input id="setAssetRef" class="input" type="number" value="${Number(cfg.assetReferralCommission||25)}"></div>
 <div class="card"><div class="section">Site</div><div class="fieldlabel">Site Name</div><input id="setSite" class="input" value="${esc(cfg.siteName)}"></div>
 <button class="btn" onclick="saveAdminSettings()">Save Settings</button>`;
}
function saveAdminSettings(){
 cfg.taskWithdrawalOpen=document.getElementById("setTaskOpen").checked;cfg.affiliateWithdrawalOpen=document.getElementById("setAffOpen").checked;cfg.assetWithdrawalOpen=document.getElementById("setAssetOpen").checked;cfg.taskMinWithdrawal=Number(document.getElementById("setTaskMin").value)||500;cfg.affiliateMinWithdrawal=Number(document.getElementById("setAffMin").value)||1000;cfg.assetMinWithdrawal=Number(document.getElementById("setAssetMin").value)||100;
 cfg.referralReward=Number(document.getElementById("setRef").value)||40;
 cfg.adReward=Number(document.getElementById("setAdReward").value)||10;
 cfg.adDailyLimit=Number(document.getElementById("setAdLimit").value)||20;
 cfg.adsDirectLink=document.getElementById("setAdLink").value.trim()||"https://omg10.com/4/11681882";
 cfg.minDeposit=Number(document.getElementById("setMinDep").value)||500;
 cfg.depositPresets=document.getElementById("setPresets").value.split(",").map(Number).filter(Boolean);
 cfg.paymentBank=document.getElementById("setBank").value.trim();
 cfg.paymentAccount=document.getElementById("setAcc").value.trim();
 cfg.paymentName=document.getElementById("setName").value.trim();
 cfg.assetPaymentBank=document.getElementById("setAssetBank").value.trim()||DEFAULT.assetPaymentBank;cfg.assetPaymentAccount=document.getElementById("setAssetAcc").value.trim()||DEFAULT.assetPaymentAccount;cfg.assetPaymentName=document.getElementById("setAssetName").value.trim()||DEFAULT.assetPaymentName;cfg.assetReferralCommission=Number(document.getElementById("setAssetRef").value)||25;
 cfg.siteName=document.getElementById("setSite").value.trim()||"Palazo Cash";
 save("palazo_config",cfg);toast("Admin settings saved");adminPanel()
}

// Touch feedback: every interactive control gets a small visual ripple.
document.addEventListener("pointerdown",e=>{
 const el=e.target.closest("button,.action,.circle,.nav-btn,.admin-tab");
 if(!el)return;const r=document.createElement("span");r.className="ripple";r.style.left=e.clientX+"px";r.style.top=e.clientY+"px";document.body.appendChild(r);setTimeout(()=>r.remove(),500);
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
