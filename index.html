<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeVest</title>
<style>
body{font-family:Arial;margin:0;background:#f3f3f3;}
.header{background:red;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold;}
.card{background:#fff;margin:15px;padding:15px;border-radius:10px;box-shadow:0 0 5px rgba(0,0,0,0.1);}
.btn{background:red;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-size:16px;margin-top:10px;}
input,select{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc;}
.nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;}
.nav div{font-size:14px;}
.big{font-size:20px;font-weight:bold;}
</style>
</head>

<body>

<div class="header">PrimeVest</div>

<div id="app"></div>

<div class="nav">
<div onclick="show('home')">Home</div>
<div onclick="show('products')">Products</div>
<div onclick="show('team')">Team</div>
<div onclick="show('profile')">Profile</div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user")) || null;

function save(){ localStorage.setItem("user", JSON.stringify(user)); }

function show(page){
if(!user && page!="login" && page!="register"){
page="login";
}

if(page=="login"){
app.innerHTML=`
<div class="card">
<h2>Login</h2>
<input id="u" placeholder="Username">
<input id="p" placeholder="Password" type="password">
<button class="btn" onclick="login()">Login</button>
<p onclick="show('register')">Create account</p>
</div>`;
}

if(page=="register"){
app.innerHTML=`
<div class="card">
<h2>Register</h2>
<input id="phone" placeholder="Phone">
<input id="user" placeholder="Username">
<input id="name" placeholder="Full Name">
<input id="pass" placeholder="Password" type="password">
<button class="btn" onclick="register()">Register</button>
</div>`;
}

if(page=="home"){
app.innerHTML=`
<div class="card">
<div class="big">Balance: ₦${user.balance}</div>
<button class="btn" onclick="show('deposit')">Deposit</button>
<button class="btn" onclick="show('withdraw')">Withdraw</button>
<button class="btn" onclick="show('gift')">Gift Code</button>
</div>`;
}

if(page=="products"){
app.innerHTML=`
<div class="card">
<h3>Products</h3>
<div>Plan 1 - ₦5,000</div>
<button class="btn" onclick="buy()">Add to Portfolio</button>
</div>`;
}

if(page=="deposit"){
app.innerHTML=`
<div class="card">
<h3>Deposit</h3>
<input placeholder="Enter amount">
<button class="btn">Deposit Now</button>
</div>`;
}

if(page=="withdraw"){
app.innerHTML=`
<div class="card">
<h3>Withdraw</h3>
<input placeholder="Amount">
<button class="btn">Withdraw</button>
</div>`;
}

if(page=="gift"){
app.innerHTML=`
<div class="card">
<h3>Gift Code</h3>
<input id="code" placeholder="Enter code">
<button class="btn" onclick="redeem()">Redeem</button>
</div>`;
}

if(page=="team"){
app.innerHTML=`
<div class="card">
<h3>Referral</h3>
<p>Code: ${user.ref}</p>
<p>Link: ${location.href}?ref=${user.ref}</p>
</div>`;
}

if(page=="profile"){
app.innerHTML=`
<div class="card">
<h3>Profile</h3>
<button class="btn" onclick="show('bank')">Bank Details</button>
<button class="btn" onclick="show('transactions')">Transactions</button>
</div>`;
}

if(page=="bank"){
app.innerHTML=`
<div class="card">
<h3>Bank</h3>
<input placeholder="Account Number">
<input placeholder="Bank Name">
<input placeholder="Account Name">
<button class="btn">Save</button>
</div>`;
}

if(page=="transactions"){
app.innerHTML=`
<div class="card">
<h3>Transactions</h3>
<p>No transactions</p>
</div>`;
}

}

function register(){
user={
username:user.value,
password:pass.value,
balance:0,
ref:Math.random().toString(36).substring(2,10)
};
save();
show('home');
}

function login(){
if(u.value==user.username && p.value==user.password){
show('home');
}else{
alert("Wrong login");
}
}

function buy(){
alert("Product added (demo)");
}

function redeem(){
if(code.value=="FREE100"){
user.balance+=100;
save();
alert("₦100 added");
}
}

show('login');
</script>

</body>
</html>
