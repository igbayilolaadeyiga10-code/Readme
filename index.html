function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadSession(){
  try{return JSON.parse(sessionStorage.getItem("palazo_session"))||null}catch(e){return null}
}
function saveSession(v){
  try{
    if(v) sessionStorage.setItem("palazo_session",JSON.stringify(v));
    else sessionStorage.removeItem("palazo_session");
  }catch(e){}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return "₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function now(){return new Date().toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"})}
function toast(m){const x=document.createElement("div");x.className="toast";x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function me(){return users.find(u=>u.username===session?.username)||null}
function persistUser(u){users=users.map(x=>x.username===u.username?u:x);save("palazo_users",users);session={username:u.username};saveSession(session)}
function ensureUser(u){
  const base={username:u.username,email:u.email||"",phone:u.phone||"",password:u.password||"",created:"Aug 2026",
    earning:0,affiliate:0,deposit:0,adBalance:0,assetBalance:100,referrals:0,bank:null,avatar:"",notifications:[],transactions:[],deposits:[],assetDeposits:[],adOrders:[],taskSubmissions:[],investments:[],claimedTeamMilestones:[],totalReferralDeposits:0,totalReferralWithdrawals:0};
  return Object.assign(base,u,{taskSubmissions:Array.isArray(u.taskSubmissions)?u.taskSubmissions:[],assetDeposits:Array.isArray(u.assetDeposits)?u.assetDeposits:[],investments:Array.isArray(u.investments)?u.investments:[],claimedTeamMilestones:Array.isArray(u.claimedTeamMilestones)?u.claimedTeamMilestones:[]})
}
users=users.map(ensureUser);
function render(){ if(!session||!me()){renderAuth("login");return} if(me().banned){document.getElementById("app").innerHTML=`<div class="card" style="margin:30px 15px;text-align:center"><h2>Account Banned</h2><p class="muted">Your account has been restricted by the administrator.</p><button class="btn" onclick="logout()">Logout</button></div>`;return} renderApp() }

function referralCodeFromUrl(){
 const params=new URLSearchParams(window.location.search||'');
 const direct=(params.get('ref')||params.get('referral')||params.get('referralCode')||'').trim();

function register(){
 const username=document.getElementById("regUser").value.trim().replace(/\s+/g,"_");
 const email=document.getElementById("regEmail").value.trim(),phone=document.getElementById("regPhone").value.trim(),password=document.getElementById("regPass").value,ref=document.getElementById("regRef").value.trim();
 if(username.length<3||!email||password.length<8)return toast("Complete all required fields");
 if(users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast("Username already exists");
 const u=ensureUser({username,email,phone,password,referralCode:username.toUpperCase(),referrerCode:ref});
 users.push(u);save("palazo_users",users);session={username};saveSession(session);
 // Track the referrer. The signup itself does not pay a cash commission; investment/earning commissions are credited later.
 if(ref){const parent=users.find(x=>String(x.referralCode||x.username).toLowerCase()===ref.toLowerCase()||x.username.toLowerCase()===ref.toLowerCase());if(parent){u.referrerUsername=parent.username;parent.referrals=(parent.referrals||0)+1;save("palazo_users",users)}}
 toast("Account created successfully");render();
}
function login(){
  try{
    const userEl=document.getElementById("loginUser");
    const passEl=document.getElementById("loginPass");
    if(!userEl||!passEl)return toast("Login form is unavailable. Please reload.");
    const key=String(userEl.value||"").trim().toLowerCase();
    const pass=String(passEl.value||"");
    if(!key||!pass)return toast("Enter your username/email and password");

    users=load("palazo_users",users).map(ensureUser);
    const u=users.find(x=>{
      const username=String(x.username||"").trim().toLowerCase();
      const email=String(x.email||"").trim().toLowerCase();
      return username===key || email===key;
    });

    if(!u)return toast("Account not found. Check your username/email.");
    if(String(u.password||"")!==pass)return toast("Incorrect password");
    if(u.banned)return toast("Your account has been banned");

    session={username:u.username};
    saveSession(session);
    render();
    setTimeout(showCommunityPopup,120);
  }catch(err){
    console.error("PALAZZO login error:",err);
    toast("Login error. Please refresh and try again.");
  }
}
function logout(){session=null;saveSession(null);renderAuth("login")}

function startTask(id){
 const t=(cfg.tasks||[]).find(x=>x.id===id); if(!t)return;
 const u=me(), previous=(u.taskSubmissions||[]).find(s=>s.taskId===id);
 if(previous){
   const label=previous.status==='pending'?'pending approval':previous.status==='approved'?'already approved':'rejected';
   return toast('You can perform this task only once — status: '+label);
 }
 openModal(`<div class="modal-head"><div><div class="section">${esc(t.app)}</div><h2 style="margin:0">${esc(t.category)}</h2></div><button class="close" onclick="closeModal()">×</button></div>

 <button class="btn secondary" style="margin-top:10px" onclick="window.open('${esc(t.link||'https://t.me/')}','_blank')">Open Task Link ↗</button>
 <div class="fieldlabel" style="margin-top:14px">Upload task screenshot</div><input id="taskFile" class="input" type="file" accept="image/*">

}
function submitTask(id){
 const t=(cfg.tasks||[]).find(x=>x.id===id),file=document.getElementById('taskFile')?.files?.[0];
 if(!t||!file)return toast('Upload your task screenshot');
 const u=me();
 if((u.taskSubmissions||[]).some(s=>s.taskId===id))return toast('You can perform this task only once');
 const sub={id:'sub_'+Date.now(),taskId:t.id,app:t.app,category:t.category,reward:Number(t.reward||0),fileName:file.name,status:'pending',date:now(),proof:''};
 const reader=new FileReader();reader.onload=()=>{sub.proof=reader.result;u.taskSubmissions.unshift(sub);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:sub.id,type:'Task Submission',amount:0,balance:'Task Balance',status:'pending',date:now()});addNotification(u,'Task submitted','Your '+t.category+' task is pending admin review.','pending');persistUser(u);closeModal();toast('Task submitted — waiting for approval');renderApp()};reader.onerror=()=>toast('Could not read screenshot');reader.readAsDataURL(file);
}

function teamDepositTotal(username){
 const children=users.filter(x=>x.referrerUsername===username); let total=0;
 for(const child of children){ total+=Number((child.assetDeposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0)); total+=Number((child.deposits||[]).filter(d=>d.status==='approved').reduce((a,d)=>a+Number(d.amount||0),0)); total+=teamDepositTotal(child.username); }
 return total;
}
function claimTeamBonus(i){

function accrueInvestments(u){
 u.investments=u.investments||[];let changed=false;const today=new Date().toISOString().slice(0,10);
 for(const inv of u.investments){if(inv.status!=='active')continue;let last=inv.lastReturnDate||inv.startDate||today;let d=new Date(last+'T00:00:00');const end=new Date(today+'T00:00:00');let days=Math.floor((end-d)/86400000);if(days>0){const earned=days*Number(inv.daily||0);u.assetBalance=Number(u.assetBalance||0)+earned;inv.totalReturned=Number(inv.totalReturned||0)+earned;inv.lastReturnDate=today;u.transactions.unshift({type:'Investment daily return',amount:earned,balance:'Asset Balance',status:'approved',date:now()});changed=true}}
 if(changed)persistUser(u);return u;
}

function paidDeposit(n,code,kind='ads'){

function submitDeposit(n,code,kind='ads'){
 const name=document.getElementById('depName')?.value.trim(),file=document.getElementById('depFile')?.files?.[0];if(!name||!file)return toast('Enter account name and upload screenshot');
 const u=me(),d={id:'dep_'+Date.now(),amount:Number(n),accountName:name,narration:code,kind,fileName:file.name,status:'pending',date:now(),proof:''};
 const reader=new FileReader();reader.onload=()=>{d.proof=reader.result;u.deposits=u.deposits||[];u.deposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:kind==='ads'?'Ads Deposit':'Deposit Request',amount:Number(n),balance:kind==='ads'?'Ads Balance':'Ads Balance',status:'pending',date:now()});addNotification(u,kind==='ads'?'Ads Deposit submitted':'Deposit submitted','Your '+money(n)+' '+(kind==='ads'?'Ads':'deposit')+' is pending admin review.','pending');persistUser(u);closeModal();go('deposit');toast('Deposit submitted for admin review')};reader.onerror=()=>toast('Could not read screenshot');reader.readAsDataURL(file);
}

function submitAssetDeposit(n){const name=document.getElementById('assetDepName')?.value.trim(),file=document.getElementById('assetDepFile')?.files?.[0];if(!name||!file)return toast('Enter deposit name and screenshot');const u=me(),d={id:'adep_'+Date.now(),amount:Number(n),accountName:name,fileName:file.name,status:'pending',date:now(),proof:''};const reader=new FileReader();reader.onload=()=>{d.proof=reader.result;u.assetDeposits=u.assetDeposits||[];u.assetDeposits.unshift(d);u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:d.id,type:'Asset Deposit',amount:Number(n),balance:'Asset Balance',status:'pending',date:now()});addNotification(u,'Asset Deposit submitted','Your '+money(n)+' Asset Deposit is pending admin review.','pending');persistUser(u);closeModal();go('deposit');toast('Asset deposit submitted for admin review')};reader.onerror=()=>toast('Could not read screenshot');reader.readAsDataURL(file)}

function withdrawType(type){ selectWithdrawWallet(type); }
function updateWithdrawalAmount(balance,min){
 const input=document.getElementById('wdAmount');
 const warning=document.getElementById('wdBalanceWarning');
 const btn=document.getElementById('wdSubmitBtn');
 if(!input)return;
 const amount=Number(input.value||0);
 const insufficient=amount>balance;
 const belowMin=amount>0 && amount<min;
 if(warning){
   warning.textContent=insufficient?'Not enough balance to withdraw this amount.':(belowMin?'Amount is below the minimum withdrawal amount.':'');
   warning.classList.toggle('show',insufficient||belowMin);
 }
 if(btn)btn.classList.toggle('withdraw-submit-disabled',insufficient||belowMin||amount<=0);
 const sum=document.getElementById('wdSummaryAmount');
 if(sum)sum.textContent=money(amount);
}
function submitWithdrawalType(type){
 const u=me(),n=Number(document.getElementById('wdAmount')?.value||0),active=(u.investments||[]).filter(x=>x.status==='active').length;
 const open=type==='task'?cfg.taskWithdrawalOpen:type==='affiliate'?cfg.affiliateWithdrawalOpen:cfg.assetWithdrawalOpen,min=type==='task'?Number(cfg.taskMinWithdrawal||500):type==='affiliate'?Number(cfg.affiliateMinWithdrawal||500):Number(cfg.assetMinWithdrawal||500),field=type==='task'?'earning':type==='affiliate'?'affiliate':'assetBalance';
 const balance=Number(u[field]||0);
 if(type==='asset' && active<1)return toast('Purchase at least 1 product before withdrawing from Asset Wallet');
 if(!open)return toast('Withdrawal is closed');
 if(!u.bank)return toast('Add bank details first');
 if(balance<min)return toast('Not enough balance to withdraw');
 if(!n)return toast('Enter an amount to withdraw');
 if(n>balance)return toast('Not enough balance to withdraw');
 if(n<min)return toast('Amount is below the minimum withdrawal amount');
 u[field]=Number(u[field]||0)-n;u.withdrawals=u.withdrawals||[];const id='wd_'+Date.now();u.withdrawals.unshift({id,type,amount:n,bank:u.bank,status:'pending',date:now()});u.transactions=u.transactions||[];u.transactions.unshift({id:'tx_'+Date.now(),requestId:id,type:type.charAt(0).toUpperCase()+type.slice(1)+' Withdrawal',amount:-n,balance:type==='task'?'Task Balance':type==='affiliate'?'Affiliate Balance':'Asset Balance',status:'pending',date:now()});addNotification(u,'Withdrawal submitted','Your '+money(n)+' '+type+' withdrawal is pending admin review.','pending');persistUser(u);go('withdraw');toast('Withdrawal request submitted');
}

 if(file){const reader=new FileReader();reader.onload=()=>{u.avatar=reader.result;persistUser(u);closeModal();renderApp();toast('Profile photo updated')};reader.onerror=()=>toast('Could not read image');reader.readAsDataURL(file);}else{persistUser(u);closeModal();renderApp();toast('Profile saved');}

function tapAdmin(){
 adminTaps++;clearTimeout(adminTimer);adminTimer=setTimeout(()=>adminTaps=0,5000);
 if(adminTaps>=10){adminTaps=0;adminPanel()}
}
function adminPanel(){
 let page="overview";
 const tabs=["overview","users","tasks","deposits","asset deposits","withdrawals","ads","settings"];
 const screen=document.getElementById("adminScreen");
 if(!screen)return;
 screen.classList.add("open"); screen.setAttribute("aria-hidden","false");
 document.body.style.overflow="hidden";
 const renderAdmin=()=>{
  const ulist=users; let content="";
  if(page==="overview")content=`<div class="stats"><div class="stat"><small>USERS</small><b>${ulist.length}</b></div><div class="stat"><small>PENDING DEPOSITS</small><b>${ulist.reduce((a,u)=>a+(u.deposits||[]).filter(d=>d.status==="pending").length,0)}</b></div><div class="stat"><small>PENDING ASSET DEPOSITS</small><b>${ulist.reduce((a,u)=>a+(u.assetDeposits||[]).filter(d=>d.status==="pending").length,0)}</b></div><div class="stat"><small>PENDING WITHDRAWALS</small><b>${ulist.reduce((a,u)=>a+(u.withdrawals||[]).filter(d=>d.status==="pending").length,0)}</b></div></div><div class="stats" style="margin-top:9px"><div class="stat"><small>TASKS</small><b>${cfg.tasks.length}</b></div><div class="stat"><small>TASK SLOTS LEFT</small><b>${cfg.tasks.reduce((a,t)=>a+Math.max(0,Number(t.slots||0)-Number(t.completed||0)),0)}</b></div><div class="stat"><small>PENDING AD ORDERS</small><b>${ulist.reduce((a,u)=>a+(u.adOrders||[]).filter(o=>o.status==='pending').length,0)}</b></div></div><div class="card"><div class="section">Current payment setup</div><div class="notice" style="margin-bottom:10px">User funding now separates <b>Ads Balance</b> from <b>Asset Balance</b>.</div><div class="row"><span>Bank</span><b>${esc(cfg.paymentBank)}</b></div><div class="row"><span>Account</span><b>${esc(cfg.paymentAccount)}</b></div><div class="row"><span>Min deposit</span><b>${money(cfg.minDeposit)}</b></div><div class="row"><span>Referral reward</span><b>₦${cfg.referralReward}</b></div></div>`;
  if(page==="users")content=usersAdmin();
  if(page==="tasks")content=tasksAdmin();
  if(page==="deposits")content=depositAdmin();
  if(page==="asset deposits")content=assetDepositAdmin();if(page==="withdrawals")content=withdrawalAdmin();
  if(page==="ads")content=adsAdmin();
  if(page==="settings")content=settingsAdmin();
  screen.innerHTML=`<div class="admin-shell"><div class="admin-top"><div><h2>Palazzo Admin Panel</h2><small>Control Center</small></div><button class="admin-close" aria-label="Exit admin panel" onclick="closeAdminPanel()">×</button></div><div class="admin-body"><div class="admin-tabs">${tabs.map(x=>`<button class="admin-tab ${page===x?"active":""}" onclick="adminPage('${x}')">${x}</button>`).join("")}</div>${content}</div></div>`;
 };
 window.adminPage=(p)=>{page=p;renderAdmin()};
 window.adminRefresh=renderAdmin;
 renderAdmin();
}

function toggleBan(username){const u=users.find(x=>x.username===username);if(!u)return;u.banned=!u.banned;save('palazo_users',users);toast(u.banned?'User banned':'User unbanned');adminPanel()}
function manageUser(username){const u=users.find(x=>x.username===username);if(!u)return;openModal(`<div class="modal-head"><div><div class="section">User Management</div><h2 style="margin:0">@${esc(u.username)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">Task: ${money(u.earning||0)} • Affiliate: ${money(u.affiliate||0)} • Deposit: ${money(u.deposit||0)} • Asset: ${money(u.assetBalance||0)}</div><div class="fieldlabel" style="margin-top:12px">Wallet</div><select id="balType" class="select"><option value="earning">Task Balance</option><option value="affiliate">Affiliate Balance</option><option value="deposit">Legacy Deposit Balance</option><option value="assetBalance">Asset Balance</option><option value="adBalance">Ads Balance</option></select><div class="fieldlabel">Amount</div><input id="balAmt" class="input" type="number" placeholder="Amount"><div class="grid2"><button class="btn green-btn" onclick="adjustUserBalance('${esc(u.username)}',1)">Add Balance</button><button class="btn danger" onclick="adjustUserBalance('${esc(u.username)}',-1)">Deduct Balance</button></div>`)}
function adjustUserBalance(username,sign){const u=users.find(x=>x.username===username),field=document.getElementById('balType').value,n=Number(document.getElementById('balAmt').value||0);if(!u||n<=0)return toast('Enter a valid amount');if(sign<0&&Number(u[field]||0)<n)return toast('Insufficient balance');u[field]=Number(u[field]||0)+(sign*n);u.transactions=u.transactions||[];u.transactions.unshift({type:sign>0?'Admin balance credit':'Admin balance deduction',amount:sign*n,balance:field,status:'approved',date:now()});save('palazo_users',users);toast(sign>0?'Balance added':'Balance deducted');closeModal();adminPanel()}


function depositAdmin(){
 const rows=users.flatMap(u=>(u.deposits||[]).map(d=>({u,d}))).sort((a,b)=>new Date(b.d.date||0)-new Date(a.d.date||0));
 const pending=rows.filter(x=>x.d.status==='pending');
 const html=pending.map(({u,d})=>`<div class="admin-order"><div><b>@${esc(u.username)}</b><div class="muted">${money(d.amount)} • ${esc(d.date||'')}<br>Type: ${esc(d.kind==='ads'?'Ads Deposit':'Legacy Deposit')}<br>Account name: ${esc(d.accountName||'Not provided')}<br>Narration: ${esc(d.code||d.narration||'')}</div></div><div class="order-actions">${d.proof?`<button class="btn secondary" onclick="viewDepositProof('${esc(u.username)}','${esc(d.id)}')">View Screenshot</button>`:''}<button class="btn green-btn" onclick="approveDeposit('${esc(u.username)}','${esc(d.id)}')">✓ Approve & Credit</button><button class="btn danger" onclick="rejectDeposit('${esc(u.username)}','${esc(d.id)}')">✕ Reject</button></div></div>`).join('')||'<div class="empty">No pending deposits.</div>';
 const history=rows.slice(0,40).map(({u,d})=>`<div class="admin-order"><div><b>@${esc(u.username)} • ${money(d.amount)}</b><div class="muted">${esc(d.date||'')} • ${esc(d.accountName||'')}</div></div><span class="pill ${esc(d.status||'pending')}">${esc((d.status||'pending').toUpperCase())}</span></div>`).join('')||'<div class="empty">No deposit history.</div>';
 return `<div class="card"><div class="section">Pending Deposits</div><p class="muted">Review user deposits before crediting Deposit Balance.</p>${html}</div><div class="card"><div class="section">Deposit History</div>${history}</div>`;
}
function viewDepositProof(username,id){
 const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id); if(!d?.proof)return toast('Screenshot unavailable');
 openModal(`<div class="modal-head"><div><div class="section">Deposit Proof</div><h2 style="margin:0">Payment Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${d.proof}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px" alt="Deposit screenshot">`);
}
function approveDeposit(username,id){
 const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id); if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');
 d.status='approved';d.approvedDate=now();const amount=Number(d.amount||0);const kind=d.kind||'ads';if(kind==='ads'){u.adBalance=Number(u.adBalance||0)+amount;}else{u.deposit=Number(u.deposit||0)+amount;}u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',amount,kind==='ads'?'Ads Deposit Approved':'Deposit Approved');addNotification(u,kind==='ads'?'Ads Deposit Approved':'Deposit Approved',money(amount)+' was added to '+(kind==='ads'?'Ads Balance':'Deposit Balance')+'.','approved');
 const parent=u.referrerUsername?users.find(x=>x.username===u.referrerUsername):null;
 if(parent&&!d.referralCommissionPaid){const pct=Number(cfg.depositReferralCommission||25);const bonus=Number(d.amount||0)*pct/100;parent.affiliate=Number(parent.affiliate||0)+bonus;parent.totalReferralDeposits=Number(parent.totalReferralDeposits||0)+Number(d.amount||0);parent.transactions=parent.transactions||[];parent.transactions.unshift({type:'Referral deposit commission',amount:bonus,balance:'Affiliate Balance',status:'approved',date:now(),from:u.username});d.referralCommissionPaid=true;}
 save('palazo_users',users);toast('Deposit approved and credited');adminPanel();
}
function rejectDeposit(username,id){const u=users.find(x=>x.username===username),d=(u?.deposits||[]).find(x=>x.id===id);if(!u||!d||d.status!=='pending')return toast('Deposit is no longer pending');d.status='rejected';d.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected');addNotification(u,d.kind==='ads'?'Ads Deposit Rejected':'Deposit Rejected','Your '+money(d.amount||0)+' deposit was rejected by admin.','rejected');save('palazo_users',users);toast('Deposit rejected — status updated immediately');adminPanel();}

function tasksAdmin(){
 const taskList=cfg.tasks.map(t=>{const m=PLATFORM_META[t.app]||PLATFORM_META.Other;const left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));return `<div class="price-chip"><div style="display:flex;gap:9px;align-items:center"><div class="platform-logo ${m.cls}">${esc(m.icon)}</div><div><b>${esc(t.app)} • ${esc(t.category)}</b><div class="muted">Reward ${money(t.reward)} • ${Number(t.completed||0)} completed • ${left} slots left</div></div></div><div style="display:flex;gap:5px"><button class="btn secondary" style="width:auto;padding:8px" onclick="editTask('${esc(t.id)}')">Edit</button><button class="btn danger" style="width:auto;padding:8px" onclick="deleteTask('${esc(t.id)}')">Delete</button></div></div>`}).join('')||'<p class="muted">No tasks.</p>';
 const first=Object.keys(TASK_TYPES)[0];
 return `<div class="card"><div class="section">Task Management</div><p class="muted">Create platform-specific tasks with logos, instructions, reward, slots and links. Admin can edit or delete them anytime.</p>${taskList}</div>
 <div class="card"><div class="section">Add Task</div><div class="fieldlabel">Platform</div><input type="hidden" id="taskPlatform" value="${first}">${platformChoices(first,'task')}<div class="fieldlabel">Task Type</div><select id="taskType" class="select">${TASK_TYPES[first].map(x=>`<option>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="ntDesc" class="textarea" placeholder="Tell users exactly what to do and what proof to submit"></textarea><div class="grid2"><div><div class="fieldlabel">Reward (₦)</div><input id="ntReward" class="input" type="number" min="0.01" step="0.01" placeholder="0.50"></div><div><div class="fieldlabel">Total Slots</div><input id="ntSlots" class="input" type="number" min="1" placeholder="1000"></div></div><div class="fieldlabel">Task Link</div><input id="ntLink" class="input" placeholder="https://..."><button class="btn" onclick="addTask()">Add Task</button></div>
 <div class="card"><div class="section">Pending User Submissions</div>${users.flatMap(u=>(u.taskSubmissions||[]).filter(s=>s.status==='pending').map(s=>({u,s}))).map(({u,s})=>`<div class="row"><div><b>@${esc(u.username)} • ${esc(s.category)}</b><div class="muted">Reward ${money(s.reward)} • ${esc(s.fileName)}<br>${esc(s.date)}</div>${s.proof?`<button class="btn secondary" style="width:auto;margin-top:7px;padding:7px 10px" onclick="viewProof('${esc(u.username)}','${esc(s.id)}')">View Screenshot</button>`:''}</div><div style="display:flex;gap:5px"><button class="btn green-btn" style="width:auto;padding:8px" onclick="approveTask('${esc(u.username)}','${esc(s.id)}')">Approve</button><button class="btn danger" style="width:auto;padding:8px" onclick="rejectTask('${esc(u.username)}','${esc(s.id)}')">Reject</button></div></div>`).join('')||'<p class="muted">No pending task submissions.</p>'}</div>`;
}
function addTask(){
 const app=document.getElementById('taskPlatform').value,cat=document.getElementById('taskType').value,desc=document.getElementById('ntDesc').value.trim(),reward=Number(document.getElementById('ntReward').value),slots=Math.floor(Number(document.getElementById('ntSlots').value)||0),link=document.getElementById('ntLink').value.trim();
 if(!app||!cat||reward<=0||slots<1||!link||!desc)return toast('Complete all task fields');
 cfg.tasks.push({id:'t_'+Date.now(),app,category:cat,description:desc,reward,slots,completed:0,boosted:false,link,icon:(PLATFORM_META[app]||PLATFORM_META.Other).icon});save('palazo_config',cfg);toast('Task added');adminPanel();
}
function editTask(id){
 const t=cfg.tasks.find(x=>x.id===id);if(!t)return;const app=t.app||'Telegram';
 openModal(`<div class="modal-head"><div><div class="section">Task Management</div><h2 style="margin:0">Edit Task</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="fieldlabel">Platform</div><input type="hidden" id="etApp" value="${esc(app)}">${platformChoices(app,'editTask')}<div class="fieldlabel">Task Type</div><select id="etCat" class="select">${(TASK_TYPES[app]||[t.category]).map(x=>`<option ${x===t.category?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="etDesc" class="textarea">${esc(t.description||'')}</textarea><div class="grid2"><div><div class="fieldlabel">Reward</div><input id="etReward" class="input" type="number" step="0.01" value="${Number(t.reward||0)}"></div><div><div class="fieldlabel">Total Slots</div><input id="etSlots" class="input" type="number" value="${Number(t.slots||0)}"></div></div><div class="fieldlabel">Task Link</div><input id="etLink" class="input" value="${esc(t.link||'')}"><button class="btn" onclick="saveTaskEdit('${esc(id)}')">Save Task</button>`);
}
function saveTaskEdit(id){const t=cfg.tasks.find(x=>x.id===id);if(!t)return;t.app=document.getElementById('etApp').value;t.category=document.getElementById('etCat').value;t.description=document.getElementById('etDesc').value.trim();t.reward=Number(document.getElementById('etReward').value)||0;t.slots=Math.floor(Number(document.getElementById('etSlots').value)||0);t.link=document.getElementById('etLink').value.trim();t.icon=(PLATFORM_META[t.app]||PLATFORM_META.Other).icon;if(!t.app||!t.category||t.reward<=0||t.slots<1||!t.link||!t.description)return toast('Complete all task fields');save('palazo_config',cfg);closeModal();toast('Task updated');adminPanel()}
function deleteTask(id){if(!confirm('Delete this task?'))return;cfg.tasks=cfg.tasks.filter(x=>x.id!==id);save('palazo_config',cfg);toast('Task deleted');adminPanel()}
function viewProof(username,id){
 const u=users.find(x=>x.username===username),sub=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!sub?.proof)return toast('Screenshot unavailable');
 openModal(`<div class="modal-head"><div><div class="section">Task Proof</div><h2 style="margin:0">Screenshot</h2></div><button class="close" onclick="closeModal()">×</button></div><img src="${sub.proof}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:16px;border:1px solid #e5eaf2" alt="Task screenshot">`);
}
function approveTask(username,id){
 const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id),t=cfg.tasks.find(x=>x.id===s?.taskId);
 if(!u||!s||s.status!=="pending")return toast("This submission is no longer pending");
 if(t&&Number(t.completed||0)>=Number(t.slots||0))return toast("This task has no slots left");
 const reward=Number(s.reward||0);s.status="approved";s.approvedDate=now();u.earning=Number(u.earning||0)+reward;
 if(!updateRequestTransaction(u,s.id,'approved',reward,'Task Approved'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Approved',amount:reward,balance:'Task Balance',status:'approved',date:now()});
 addNotification(u,'Task Approved','Your '+s.category+' task was approved and '+money(reward)+' was added to Task Balance.','approved');
 if(t)t.completed=Number(t.completed||0)+1;
 if(u.referrerUsername&&!u.referralTaskRewarded){const parent=users.find(x=>x.username===u.referrerUsername);if(parent){const bonus=Number(cfg.referralReward||40);parent.affiliate=Number(parent.affiliate||0)+bonus;parent.transactions=parent.transactions||[];parent.transactions.unshift({id:'tx_'+Date.now(),type:'Referral task reward',amount:bonus,balance:'Affiliate Balance',status:'approved',date:now(),from:u.username});addNotification(parent,'Referral Reward','You received '+money(bonus)+' for your downline’s first approved task.','approved');u.referralTaskRewarded=true;}}
 save("palazo_users",users);save("palazo_config",cfg);toast("Task approved — status updated immediately");adminPanel();
}
function rejectTask(username,id){
 const u=users.find(x=>x.username===username),s=(u?.taskSubmissions||[]).find(x=>x.id===id);if(!u||!s||s.status!=="pending")return toast("This submission is no longer pending");
 s.status="rejected";s.rejectedDate=now();if(!updateRequestTransaction(u,s.id,'rejected',0,'Task Rejected'))u.transactions.unshift({id:'tx_'+Date.now(),requestId:s.id,type:'Task Rejected',amount:0,balance:'Task Balance',status:'rejected',date:now()});addNotification(u,'Task Rejected','Your '+s.category+' task submission was rejected by admin.','rejected');save("palazo_users",users);toast("Task rejected — status updated immediately");adminPanel();
}

function tasksAdmin(){
 const taskList=cfg.tasks.map(t=>{const m=PLATFORM_META[t.app]||PLATFORM_META.Other;const left=Math.max(0,Number(t.slots||0)-Number(t.completed||0));return `<div class="price-chip"><div style="display:flex;gap:9px;align-items:center"><div class="platform-logo ${m.cls}">${esc(m.icon)}</div><div><b>${esc(t.app)} • ${esc(t.category)}</b><div class="muted">Reward ${money(t.reward)} • ${Number(t.completed||0)} completed • ${left} slots left</div></div></div><div style="display:flex;gap:5px"><button class="btn secondary" style="width:auto;padding:8px" onclick="editTask('${esc(t.id)}')">Edit</button><button class="btn danger" style="width:auto;padding:8px" onclick="deleteTask('${esc(t.id)}')">Delete</button></div></div>`}).join('')||'<p class="muted">No tasks.</p>';

 const first=Object.keys(TASK_TYPES)[0];
 return `<div class="card"><div class="section">Task Management</div><p class="muted">Create tasks, review user submissions and approve or reject rewards.</p>${taskList}</div>

 <div class="card"><div class="section">Submission History</div>${allRows}</div>
 <div class="card"><div class="section">Add Task</div><div class="fieldlabel">Platform</div><input type="hidden" id="taskPlatform" value="${first}">${platformChoices(first,'task')}<div class="fieldlabel">Task Type</div><select id="taskType" class="select">${TASK_TYPES[first].map(x=>`<option>${esc(x)}</option>`).join('')}</select><div class="fieldlabel">Task Instruction</div><textarea id="ntDesc" class="textarea" placeholder="Tell users exactly what to do and what proof to submit"></textarea><div class="grid2"><div><div class="fieldlabel">Reward (₦)</div><input id="ntReward" class="input" type="number" min="0.01" step="0.01" placeholder="10"></div><div><div class="fieldlabel">Total Slots</div><input id="ntSlots" class="input" type="number" min="1" placeholder="1000"></div></div><div class="fieldlabel">Task Link</div><input id="ntLink" class="input" placeholder="https://..."><button class="btn" onclick="addTask()">Add Task</button></div>`;

function withdrawalAdmin(){
 const rows=users.flatMap(u=>(u.withdrawals||[]).map(w=>({u,w}))).sort((a,b)=>new Date(b.w.date||0)-new Date(a.w.date||0));const pending=rows.filter(x=>x.w.status==='pending');
 const html=pending.map(({u,w})=>`<div class="admin-order"><div><b>@${esc(u.username)} • ${esc(w.type||'withdrawal')}</b><div class="muted">${money(w.amount)} • ${esc(w.date||'')}<br>${esc(w.bank?.bank||'Bank')} • ${esc(w.bank?.account||'')}</div></div><div class="order-actions"><button class="btn green-btn" onclick="approveWithdrawal('${esc(u.username)}','${esc(w.id)}')">✓ Approve</button><button class="btn danger" onclick="rejectWithdrawal('${esc(u.username)}','${esc(w.id)}')">✕ Reject & Refund</button></div></div>`).join('')||'<div class="empty">No pending withdrawals.</div>';
 const history=rows.slice(0,40).map(({u,w})=>`<div class="admin-order"><div><b>@${esc(u.username)} • ${money(w.amount)}</b><div class="muted">${esc(w.type||'withdrawal')} • ${esc(w.date||'')}</div></div><span class="pill ${esc(w.status||'pending')}">${esc((w.status||'pending').toUpperCase())}</span></div>`).join('')||'<div class="empty">No withdrawal history.</div>';
 return `<div class="card"><div class="section">Pending Withdrawals</div><p class="muted">Approve or reject user withdrawal requests. Rejected requests are automatically refunded to the original wallet.</p>${html}</div><div class="card"><div class="section">Withdrawal History</div>${history}</div>`;

function approveWithdrawal(username,id){const u=users.find(x=>x.username===username),w=(u?.withdrawals||[]).find(x=>x.id===id);if(!u||!w||w.status!=='pending')return toast('Withdrawal is no longer pending');w.status='approved';w.approvedDate=now();updateRequestTransaction(u,id,'approved',-Number(w.amount||0),(w.type||'Withdrawal')+' Withdrawal Approved');addNotification(u,'Withdrawal Approved',money(w.amount||0)+' withdrawal was approved by admin.','approved');save('palazo_users',users);toast('Withdrawal approved — status updated immediately');adminPanel();}

function addAdCategory(){
 const app=document.getElementById("newApp").value,cat=document.getElementById("newCat").value.trim(),price=Number(document.getElementById("newPrice").value);
 if(!app||!cat||price<=0)return toast("Complete platform, category and price");
 cfg.ads=cfg.ads||[];cfg.ads.push({id:"ad_"+Date.now(),app,category:cat,price,icon:(PLATFORM_META[app]||PLATFORM_META.Other).icon});
 save("palazo_config",cfg);toast("Custom ad category added");adminPanel();
}
function deleteAdCategory(id){if(!confirm('Delete this ad category?'))return;cfg.ads=(cfg.ads||[]).filter(x=>x.id!==id);save('palazo_config',cfg);toast('Ad category deleted');adminPanel();}
function editAdCategory(id){

function approveAdOrder(username,id){const u=users.find(x=>x.username===username),o=(u?.adOrders||[]).find(x=>x.id===id);if(!u||!o||o.status!=='pending')return toast('Ad campaign is no longer pending');const cost=Number(o.price||0);if(Number(u.adBalance||0)<cost)return toast('User no longer has enough Ads Balance');u.adBalance=Number(u.adBalance||0)-cost;o.status='approved';o.approvedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'approved',-cost,'Ad Campaign Approved');addNotification(u,'Ad Campaign Approved',money(cost)+' was deducted from Ads Balance and the campaign was approved.','approved');save('palazo_users',users);toast('Ad campaign approved and Ads Balance deducted');adminPanel();}
function rejectAdOrder(username,id){const u=users.find(x=>x.username===username),o=(u?.adOrders||[]).find(x=>x.id===id);if(!u||!o||o.status!=='pending')return toast('Ad campaign is no longer pending');o.status='rejected';o.rejectedDate=now();u.transactions=u.transactions||[];updateRequestTransaction(u,id,'rejected',0,'Ad Campaign Rejected');addNotification(u,'Ad Campaign Rejected','Your '+money(o.price||0)+' ad campaign was rejected by admin. No Ads Balance was deducted.','rejected');save('palazo_users',users);toast('Ad campaign rejected — status updated immediately');adminPanel();}

function adjustUserBalance(username,sign){
 const u=users.find(x=>x.username===username),select=document.getElementById("balType"),field=select?.value,n=Number(document.getElementById("balAmt")?.value||0);
 if(!u||!field||n<=0)return toast("Enter a valid amount");

 const labels={earning:"Task Balance",affiliate:"Affiliate Balance",assetBalance:"Asset Balance",adBalance:"Ads Balance"};
 u[field]=Number(u[field]||0)+(sign*n);
 u.transactions=u.transactions||[];
 u.transactions.unshift({type:sign>0?"Admin balance credit":"Admin balance deduction",amount:sign*n,balance:labels[field],status:"approved",date:now()});
 save("palazo_users",users);toast((sign>0?"Added ":"Deducted ")+money(n)+" from "+labels[field]);closeModal();adminPanel();
}

function renderAuth(mode){
 const refFromUrl=referralCodeFromUrl();
 document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:22px 16px;position:relative;z-index:1"><div style="width:min(430px,100%)"><div class="center" style="margin-bottom:18px"><div class="brand-logo" style="margin:auto;width:76px;height:76px;border-radius:23px"><img src="${PALAZZO_LOGO}" alt="Palazo Cash logo"></div><h1 style="margin:12px 0 4px;font-size:26px;font-weight:950;color:var(--navy)">${mode==='login'?'Welcome back':'Create your account'}</h1><p class="muted" style="margin:0;font-size:11px">${mode==='login'?'Sign in to continue to Palazo Cash':'Register free, then continue to the login page.'}</p></div><div class="card"><div class="announce" style="margin-bottom:16px"><div class="announce-icon">${PIcon('shield',17)}</div><div><b>Secure account access</b><span>Your balance and rewards stay behind your login.</span></div></div>${mode==='login'?`<form id="loginForm" onsubmit="event.preventDefault();login();"><div class="fieldlabel">Username or Email <span class="required">*</span></div><input id="loginUser" class="input" autocomplete="username" placeholder="Enter username or email" required><div class="fieldlabel">Password <span class="required">*</span></div><input id="loginPass" class="input" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="submit" id="loginBtn" class="btn">Login ${PIcon('arrow',14)}</button></form><div class="center muted" style="margin-top:16px;font-size:11px">New to Palazo Cash? <b style="color:#9b7800;cursor:pointer" onclick="renderAuth('register')">Create an account</b></div>`:`<form id="registerForm" onsubmit="event.preventDefault();register();"><div class="fieldlabel">Username <span class="required">*</span></div><input id="regUser" class="input" autocomplete="username" placeholder="e.g. arausi" required><div class="fieldlabel">Email Address <span class="required">*</span></div><input id="regEmail" class="input" type="email" autocomplete="email" placeholder="name@example.com" required><div class="fieldlabel">Phone Number <span class="required">*</span></div><input id="regPhone" class="input" autocomplete="tel" placeholder="08012345678" required><div class="fieldlabel">Password <span class="required">*</span></div><input id="regPass" class="input" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><div class="fieldlabel">Invitation Code <span class="muted">(Optional)</span></div><input id="regRef" class="input" value="${esc(refFromUrl)}" placeholder="Enter invitation code" ${refFromUrl?'readonly style="background:#f1f5f9;cursor:not-allowed"':''}><button type="submit" class="btn">Create Account ${PIcon('arrow',14)}</button></form><p class="muted center" style="font-size:9px;margin:12px 0 0">After registration you will be taken directly to the login page.</p><div class="center muted" style="margin-top:16px;font-size:11px">Already registered? <b style="color:#9b7800;cursor:pointer" onclick="renderAuth('login')">Login</b></div>`}</div></div></div>`;
}
function register(){
 const username=document.getElementById('regUser')?.value.trim().replace(/\s+/g,'_'),email=document.getElementById('regEmail')?.value.trim(),phone=document.getElementById('regPhone')?.value.trim(),password=document.getElementById('regPass')?.value,ref=document.getElementById('regRef')?.value.trim();
 if(!username||username.length<3||!email||!phone||!password||password.length<8)return toast('Complete all required fields');
 if(users.some(u=>String(u.username).toLowerCase()===username.toLowerCase()))return toast('Username already exists');
 const u=ensureUser({username,email,phone,password,referralCode:username.toUpperCase(),referrerCode:ref});
 if(ref){const parent=users.find(x=>String(x.referralCode||x.username).toLowerCase()===ref.toLowerCase()||String(x.username).toLowerCase()===ref.toLowerCase());if(parent){u.referrerUsername=parent.username;parent.referrals=Number(parent.referrals||0)+1;}}
 users.push(u);save('palazo_users',users);save('palazo_config',cfg);try{localStorage.removeItem('palazo_referral_code')}catch(e){}session=null;saveSession(null);toast('Registration successful. Please login.');setTimeout(()=>renderAuth('login'),350);
}

// Palazzo splash screen: isolated from the app so it cannot block startup.
(function(){
 const splash=document.createElement("div"); splash.id="palazzoSplash";
 splash.innerHTML=`<div class="splash-logo">P</div><div class="splash-name">PALAZZO</div><div class="splash-track"><i></i></div><div class="splash-label">LOADING</div>`;
 document.body.appendChild(splash);
 setTimeout(()=>{splash.classList.add("done");setTimeout(()=>splash.remove(),350)},900);
})();

// Safe startup for static hosting. Never redirect or depend on a route.
try {
  const ref = (typeof referralCodeFromUrl === 'function') ? referralCodeFromUrl() : '';
  if (ref && typeof renderAuth === 'function') {
    try { session = null; saveSession(null); } catch(e) {}
    renderAuth('register');
  } else if (session && typeof me === 'function' && me() && typeof renderApp === 'function') {
    renderApp();
  } else if (typeof renderAuth === 'function') {
    renderAuth('login');
  }
} catch (e) {
  console.error('Palazzo startup error:', e);
  const app=document.getElementById('app');
  if(app && typeof renderAuth==='function') renderAuth('login');
}
</script>
<script id="palazzo-safe-action-loader">(function(){function show(){var e=document.getElementById('palazzoActionLoader');if(!e){e=document.createElement('div');e.id='palazzoActionLoader';e.innerHTML='<div class="palazzo-ring"></div>';document.body.appendChild(e)}e.classList.add('palazzo-action-show');clearTimeout(window.__palazzoTimer);window.__palazzoTimer=setTimeout(function(){e.classList.remove('palazzo-action-show')},2000)}document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('button,[role="button"]');if(b&&!b.disabled&&b.dataset.noLoader!=='true')show()},true)})();</script></body>
</html>
