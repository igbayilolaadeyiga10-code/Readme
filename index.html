                                <div key={t.id} className="card p-3 space-y-2 text-[9px] font-bold">
                                    <div className="flex justify-between items-center">
                                        <span className="flex items-center gap-2 min-w-0"><PlatformIcon platform={t.platform}/><span className="min-w-0">{t.title}<small className="block text-[7px] text-[#f2c84b]">+{t.reward} {settings.currency || 'USDT'} • {t.platform || 'Telegram'}</small><small className="block text-[7px] text-[#7a8494] truncate max-w-[210px]">{t.link || 'No task link set'}</small></span></span>
                                        <div className="flex gap-2">
                                            <button onClick={async () => {
                                                const title = prompt('Task title', t.title); if(title===null) return;
                                                const reward = prompt('Reward', t.reward); if(reward===null) return;
                                                const description = prompt('Description', t.description || ''); if(description===null) return;
                                                const link = prompt('Task link / URL', t.link || ''); if(link===null) return;
                                                const platform = prompt('Platform (Telegram/WhatsApp/Facebook/Twitter/YouTube)', t.platform || 'Telegram'); if(platform===null) return;
                                                await db.ref(`tasks/${t.id}`).update({title, reward:Number(reward), description, link:link.trim(), platform});
                                                showToast('Task updated','✓');
                                            }} className="text-[#f2c84b] uppercase text-[7px]">Edit</button>
                                            <button onClick={() => { if(confirm('Delete this task?')) db.ref(`tasks/${t.id}`).remove(); }} className="text-red-500 uppercase text-[7px]">Delete</button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={save} className="btn-primary h-11 italic">SAVE SETTINGS</button>
                    </div>
                </div>
            );
        };

        const PinModal = ({ title, onConfirm, onCancel }) => {
            const [pin, setPin] = useState('');
            return (
                <div className="fixed inset-0 bg-[#fffaf0]/80 backdrop-blur-md z-[3000] flex items-center justify-center p-6">
                    <div className="card w-full max-w-[240px] p-5 space-y-3">
                        <div className="text-center">
                            <h3 className="text-sm font-black uppercase italic">{title}</h3>
                            <p className="text-[8px] text-[#6f7888] uppercase font-bold mt-1">Auth Required</p>
                        </div>
                        <input type="password" className="input-field text-center text-lg tracking-[0.8em] h-12" placeholder="****" maxLength={6} value={pin} autoFocus onChange={e => setPin(e.target.value)} />
                        <div className="flex gap-2">
                            <button onClick={onCancel} className="flex-1 py-2.5 bg-[#263247]/5 rounded-lg font-bold text-[9px] uppercase">Cancel</button>
                            <button onClick={() => onConfirm(pin)} className="btn-primary flex-1">Enter</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
