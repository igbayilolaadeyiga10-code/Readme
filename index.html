<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeVest</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.title{
  font-size:22px;
  font-weight:bold;
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:15px;
  background:#ff0000;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  margin-top:10px;
}

.hidden{display:none;}

.balance{
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:420px;
  display:flex;
  background:#fff;
  border-top:1px solid #ccc;
}

.nav button{
  flex:1;
  background:none;
  color:black;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<!-- REGISTER -->
<div id="register">
<div class="card">
<div class="title">Create Account</div>

<input id="r_user" placeholder="Username">
<input id="r_pass" placeholder="Password">
<input id="r_ref" placeholder="Referral Code">

<button onclick="register()">Register</button>
<p onclick="showLogin()">Login</p>
</div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden">
<div class="card">
<div class="title">Login</div>

<input id="l_user" placeholder="Username">
<input id="l_pass" placeholder="Password">

<button onclick="login()">Login</button>
<p onclick="showRegister()">Register</p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div id="home">
<div class="card">
<div class="title">PrimeVest</div>
<div class="balance">₦<span id="bal">0</span></div>
</div>

<div class="card">
<button onclick="showPage('deposit')">Deposit</button>
<button onclick="showPage('withdraw')">Withdraw</button>
<button onclick="showPage('products')">Products</button>
<button onclick="showPage('gift')">Gift Code</button>
</div>
</div>

<!-- DEPOSIT -->
<div id="deposit" class="hidden">
<div class="card">
<div class="title">Deposit</div>
<input id="depAmount" placeholder="Amount">
<button onclick="doDeposit()">Deposit Now</button>
</div>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="hidden">
<div class="card">
<div class="title">Withdraw</div>
<input id="withAmount" placeholder="Amount">
<button onclick="doWithdraw()">Withdraw</button>
</div>
</div>

<!-- PRODUCTS -->
<div id="products" class="hidden">
<div class="card">
<div class="title">Investment Plans</div>
<button onclick="buy(5000)">Buy ₦5,000 Plan (+₦500 daily)</button>
<button onclick="buy(10000)">Buy ₦10,000 Plan (+₦1000 daily)</button>
<button onclick="buy(50000)">Buy ₦50,000 Plan (+₦5000 daily)</button>
</div>
</div>

<!-- GIFT -->
<div id="gift" class="hidden">
<div class="card">
<div class="title">Gift Code</div>
<input id="giftCode" placeholder="Enter Code">
<button onclick="redeem()">Redeem</button>
</div>
</div>

<!-- REFERRAL -->
<div id="ref" class="hidden">
<div class="card">
<div class="title">Referral</div>
<input id="refLink" readonly>
</div>
</div>

<!-- TRANSACTIONS -->
<div id="txPage" class="hidden">
<div class="card">
<div class="title">Transactions</div>
<ul id="tx"></ul>
</div>
</div>

</div>

</div>

<!-- NAV -->
<div class="nav hidden" id="nav">
<button onclick="nav('home')">Home</button>
<button onclick="nav('products')">Products</button>
<button onclick="nav('ref')">Share</button>
<button onclick="nav('txPage')">Profile</button>
</div>

<script>

let currentUser=null;

function saveUsers(u){
localStorage.setItem("users", JSON.stringify(u));
}

function getUsers(){
return JSON.parse(localStorage.getItem("users")||"{}");
}

function register(){
let u=getUsers();
let user=r_user.value;

if(u[user]) return alert("User exists");

u[user]={
password:r_pass.value,
balance:0,
ref:Math.random().toString(36).substr(2,8),
tx:[]
};

saveUsers(u);
alert("Registered");
showLogin();
}

function login(){
let u=getUsers();
let user=l_user.value;

if(!u[user] || u[user].password!=l_pass.value){
alert("Wrong login");
return;
}

currentUser=user;

document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("nav").classList.remove("hidden");

updateUI();
}

function updateUI(){
let u=getUsers();
bal.innerText=u[currentUser].balance;

refLink.value=location.href+"?ref="+u[currentUser].ref;

let list="";
u[currentUser].tx.forEach(t=>{
list+="<li>"+t+"</li>";
});
tx.innerHTML=list;
}

function doDeposit(){
let u=getUsers();
let amt=parseInt(depAmount.value);

u[currentUser].balance+=amt;
u[currentUser].tx.push("Deposit ₦"+amt);

saveUsers(u);
updateUI();
}

function doWithdraw(){
let u=getUsers();
let amt=parseInt(withAmount.value);

if(u[currentUser].balance<amt) return alert("Low balance");

u[currentUser].balance-=amt;
u[currentUser].tx.push("Withdraw ₦"+amt);

saveUsers(u);
updateUI();
}

function buy(price){
let u=getUsers();

if(u[currentUser].balance<price) return alert("No money");

u[currentUser].balance-=price;
u[currentUser].tx.push("Bought plan ₦"+price);

saveUsers(u);
updateUI();
}

function redeem(){
if(giftCode.value=="FREE100"){
let u=getUsers();
u[currentUser].balance+=100;
u[currentUser].tx.push("Gift ₦100");
saveUsers(u);
updateUI();
}
}

function nav(page){
showPage(page);
}

function showPage(p){
["home","deposit","withdraw","products","gift","ref","txPage"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});
document.getElementById(p).classList.remove("hidden");
}

function showLogin(){
register.classList.add("hidden");
login.classList.remove("hidden");
}

function showRegister(){
login.classList.add("hidden");
register.classList.remove("hidden");
}

</script>

</body>
</html>
