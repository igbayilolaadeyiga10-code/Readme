<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Ad & Earn</title>

<script
    src="https://libtl.com/sdk.js"
    data-zone="11136660"
    data-sdk="show_11136660">
</script>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding-top:80px;
}

.container{
    max-width:350px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
    border:none;
    padding:14px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

#watchBtn{
    background:#2196F3;
    color:white;
}

#claimBtn{
    background:#4CAF50;
    color:white;
    display:none;
    margin-top:15px;
}

#status{
    margin-top:15px;
    color:#666;
}
</style>

</head>

<body>

<div class="container">

<h2>💰 Watch Ad & Earn</h2>

<p>Reward: $0.01 USDT</p>

<button id="watchBtn">
📺 Watch Ad
</button>

<button id="claimBtn">
💰 Claim Reward
</button>

<div id="status">
Click the button above to watch an ad.
</div>

</div>

<script>

document.getElementById("watchBtn").onclick = function(){

    if(typeof show_11136660 !== "function"){
        document.getElementById("status").innerHTML =
        "❌ Ad SDK failed to load.";
        return;
    }

    document.getElementById("status").innerHTML =
    "⏳ Loading advertisement...";

    try{

        show_11136660();

        setTimeout(function(){

            document.getElementById("claimBtn").style.display = "inline-block";

            document.getElementById("status").innerHTML =
            "✅ Ad viewed. You can now claim your reward.";

        }, 20000);

    }catch(e){

        document.getElementById("status").innerHTML =
        "❌ Failed to open advertisement.";

        console.log(e);
    }
};

document.getElementById("claimBtn").onclick = function(){

    document.getElementById("status").innerHTML =
    "🎉 Reward claimed successfully!";

    /*
    Example backend call:

    fetch('/claim', {
        method:'POST'
    });
    */

};

</script>

</body>
</html>
