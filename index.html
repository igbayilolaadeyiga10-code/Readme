<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnHub</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:white;color:#065f46;}
.card{background:#f0fdf4;border:1px solid #22c55e;border-radius:14px;padding:16px;margin-bottom:12px;transition:0.2s;}
.card:hover{transform:scale(1.02);}
.btn{background:linear-gradient(45deg,#16a34a,#22c55e);color:white;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:6px;border:none;}
.input{width:100%;padding:10px;border:1px solid #22c55e;border-radius:10px;margin-bottom:10px;}
.navbar{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;border-top:1px solid #22c55e;background:white;padding:14px;}
.active{color:#22c55e;font-weight:bold;}
.tapbtn{animation:pulse 1.5s infinite;}
.taskTabs{display:flex;justify-content:space-around;margin-bottom:12px;font-weight:bold;}
.taskTab{cursor:pointer;padding:6px 12px;}
.taskActive{color:#22c55e;border-bottom:2px solid #22c55e;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  useEffect(() => { if(tg){tg.ready(); tg.expand();} }, []);

  // --- USER STATE ---
  const [user, setUser] = useState(JSON.parse(localStorage.getItem("user")||"null"));
  const [tab, setTab] = useState("home");
  const [taskTab, setTaskTab] = useState("telegram");
  const [admin, setAdmin] = useState(false);
  const [tap, setTap] = useState(0);

  // --- POINTS / WALLET ---
  const [points, setPoints] = useState(parseInt(localStorage.getItem("points")||0));
  const [tasks, setTasks] = useState(JSON.parse(localStorage.getItem("tasks")||"[]"));
  const [completedTasks, setCompletedTasks] = useState(JSON.parse(localStorage.getItem("completedTasks")||"[]"));
  const [withdraws, setWithdraws] = useState(JSON.parse(localStorage.getItem("withdraws")||"[]"));
  const [walletType, setWalletType] = useState(localStorage.getItem("walletType")||"");
  const [walletNumber, setWalletNumber] = useState(localStorage.getItem("walletNumber")||"");
  const [walletName, setWalletName] = useState(localStorage.getItem("walletName")||"");
  const [minWithdraw, setMinWithdraw] = useState(parseInt(localStorage.getItem("minWithdraw")||1000));
  const [maxWithdraw, setMaxWithdraw] = useState(parseInt(localStorage.getItem("maxWithdraw")||20000));

  const BOT_USERNAME = "NairaHopeBot";
  const REF_BONUS = 100;

  // --- SAVE POINTS ---
  function savePoints(p){
    setPoints(p);
    localStorage.setItem("points",p);
  }

  // --- ADMIN TAP ---
  function logoTap(){
    let newTap=tap+1;
    setTap(newTap);
    if(newTap>=20){ setAdmin(true); setTap(0); }
  }

  // --- REFERRAL ---
  const urlParams = new URLSearchParams(window.location.search);
  const refParam = urlParams.get("ref"); // ?ref=USER_ID

  useEffect(()=>{
    if(user && refParam && refParam !== user.id && !localStorage.getItem("refClaimed")){
      let newBalance = points + REF_BONUS;
      savePoints(newBalance);
      localStorage.setItem("refClaimed",true);
      alert("🎉 Referral bonus ₦100 added!");
    }
  }, [user]);

  const refLink = `${window.location.origin}?ref=${user?.id}`;

  // --- REGISTER / LOGIN ---
  function register() {
    let username = prompt("Enter a username:");
    if(!username) return;
    const newUser = { id: Date.now().toString(), username };
    setUser(newUser);
    localStorage.setItem("user", JSON.stringify(newUser));
    alert("Registered successfully!");
  }

  function login() {
    let username = prompt("Enter your username:");
    let storedUser = JSON.parse(localStorage.getItem("user"));
    if(storedUser && storedUser.username === username){
      setUser(storedUser);
      alert("Login successful!");
    } else alert("User not found!");
  }

  // --- TASK FUNCTIONS ---
  function openTask(task){
    if(completedTasks.includes(task.id)){ alert("Task already completed"); return; }
    window.open(task.link,"_blank");
    alert("Complete task... reward in 5 seconds");
    setTimeout(()=>{
      let newBalance = points + task.reward;
      savePoints(newBalance);
      const updatedCompleted = [...completedTasks, task.id];
      setCompletedTasks(updatedCompleted);
      localStorage.setItem("completedTasks", JSON.stringify(updatedCompleted));
      alert("Task completed! +₦"+task.reward);
    },5000);
  }

  function addTask(type){
    let title = prompt(type + " Task Title");
    let link = prompt(type + " Link");
    let reward = parseInt(prompt("Reward"));
    if(!title || !link || !reward) return;
    const newTask = { id: Date.now(), title, link, reward, type:type.toLowerCase() };
    const updated = [...tasks,newTask];
    setTasks(updated);
    localStorage.setItem("tasks", JSON.stringify(updated));
  }

  // --- WITHDRAW ---
  function withdraw(){
    const amount = parseInt(prompt("Enter withdraw amount"));
    if(!walletType||!walletNumber||!walletName){ alert("Set wallet first"); return; }
    if(points<amount){ alert("Not enough balance"); return; }
    if(amount<minWithdraw){ alert("Minimum withdraw "+minWithdraw); return; }
    if(amount>maxWithdraw){ alert("Maximum withdraw "+maxWithdraw); return; }
    savePoints(points-amount);
    const w = { id:Date.now(), amount, walletType, walletNumber, walletName, status:"Pending" };
    const updatedWithdraws = [...withdraws,w];
    setWithdraws(updatedWithdraws);
    localStorage.setItem("withdraws", JSON.stringify(updatedWithdraws));
    alert("Withdraw request sent!");
  }

  // --- MAIN RENDER ---
  if(!user){
    return (
      <div className="p-4">
        <h2 className="text-2xl font-bold text-green-600 mb-4">Welcome to EarnHub</h2>
        <button className="btn" onClick={register}>Register</button>
        <button className="btn mt-2" onClick={login}>Login</button>
      </div>
    );
  }

  // --- ADMIN PANEL ---
  if(admin){
    return(
      <div className="p-4">
        <h2 className="text-xl font-bold text-green-600 mb-3">Admin Panel</h2>
        <div className="card">
          <button className="btn" onClick={()=>addTask("Telegram")}>Add Telegram Task</button>
          <button className="btn" onClick={()=>addTask("WhatsApp")}>Add WhatsApp Task</button>
          <h3
