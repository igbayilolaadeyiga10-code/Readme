<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASYPAY</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#f5f5f5;
}

/* Auth */
.auth-container {
  max-width:400px;
  margin:50px auto;
  padding:20px;
  background:white;
  border-radius:10px;
}

input,button {
  width:100%;
  padding:10px;
  margin:8px 0;
}

.btn {
  background:#6f42c1;
  color:white;
  border:none;
}

.hidden { display:none; }

/* Dashboard */
.dashboard {
  padding:20px;
}

.card {
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

/* Sidebar */
.sidebar {
  position:fixed;
  left:-200px;
  top:0;
  width:200px;
  height:100%;
  background:#222;
  color:white;
  padding:20px;
  transition:0.3s;
}
.sidebar.active { left:0; }

.hamburger {
  position:fixed;
  top:10px;
  left:10px;
  font-size:24px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div id="sidebar" class="sidebar">
  <p onclick="showDashboard()">🏠 Dashboard</p>
  <p onclick="showWithdraw()">💸 Withdraw</p>
  <p onclick="logout()">🚪 Logout</p>
</div>

<!-- AUTH -->
<div id="auth" class="auth-container">
  <h2>Register</h2>
  <input id="regUser" placeholder="Username">
  <input id="regPass" placeholder="Password">
  <input id="ref" placeholder="Referral (optional)">
  <button class="btn" onclick="register()">Sign Up</button>

  <h3>Login</h3>
  <input id="logUser" placeholder="Username">
  <input id="logPass" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">
  <h2>Welcome <span id="userName"></span></h2>

  <div class="card">
    Balance: ₦<span id="balance">0</span>
  </div>

  <div class="card">
    Daily Bonus: ₦50  
    <button onclick="claimBonus()">Claim</button>
  </div>

  <div class="card">
    Referral Link:
    <input id="refLink" readonly>
    <button onclick="copyRef()">Copy</button>
  </div>

  <button onclick="earn()">+ Earn ₦100</button>
</div>

<!-- WITHDRAW -->
<div id="withdrawPage" class="hidden">
  <h2>Withdraw</h2>
  <p>Balance: ₦<span id="wbal"></span></p>
  <input id="amount" placeholder="Amount">
  <button onclick="withdraw()">Withdraw</button>
</div>

<script>

// ===== STORAGE =====
let user = null;
let users = JSON.parse(localStorage.getItem("users")) || {};

// ===== REGISTER =====
function register(){
  let u = regUser.value;
  let p = regPass.value;
  let r = ref.value;

  if(users[u]){
    alert("User exists");
    return;
  }

  users[u] = {
    password:p,
    balance:0,
    ref:r,
    bonusDate:null
  };

  localStorage.setItem("users", JSON.stringify(users));
  alert("Registered!");
}

// ===== LOGIN =====
function login(){
  let u = logUser.value;
  let p = logPass.value;

  if(users[u] && users[u].password === p){
    user = u;
    startApp();
  } else {
    alert("Invalid");
  }
}

// ===== START APP =====
function startApp(){
  auth.classList.add("hidden");
  dashboard.classList.remove("hidden");

  userName.textContent = user;
  updateUI();

  // referral link
  refLink.value = location.href + "?ref=" + user;
}

// ===== UPDATE UI =====
function updateUI(){
  balance.textContent = users[user].balance;
  wbal.textContent = users[user].balance;
}

// ===== EARN =====
function earn(){
  users[user].balance += 100;
  save();
}

// ===== BONUS =====
function claimBonus(){
  let today = new Date().toDateString();

  if(users[user].bonusDate === today){
    alert("Already claimed today");
    return;
  }

  users[user].balance += 50;
  users[user].bonusDate = today;

  save();
}

// ===== WITHDRAW =====
function withdraw(){
  let amt = parseInt(amount.value);

  if(amt > users[user].balance){
    alert("Insufficient");
    return;
  }

  users[user].balance -= amt;
  save();

  alert("Withdrawal successful");
}

// ===== SAVE =====
function save(){
  localStorage.setItem("users", JSON.stringify(users));
  updateUI();
}

// ===== UI =====
function toggleMenu(){
  sidebar.classList.toggle("active");
}

function showWithdraw(){
  dashboard.classList.add("hidden");
  withdrawPage.classList.remove("hidden");
}

function showDashboard(){
  withdrawPage.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

function logout(){
  location.reload();
}

// ===== COPY =====
function copyRef(){
  navigator.clipboard.writeText(refLink.value);
  alert("Copied!");
}

</script>

</body>
</html>
