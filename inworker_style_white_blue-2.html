<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueEarn — Worker Dashboard</title>
<style>
:root{
  --blue:#2454e8;--blue2:#38aaf5;--bg:#f6f8fc;--text:#101a31;--muted:#758198;
  --line:#e6eaf2;--card:#fff;--success:#17a673;--danger:#dc3f56;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}
.header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:21px;color:#25324b}
.main{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:15px;box-shadow:0 8px 28px rgba(32,61,120,.06)}
.hero{background:linear-gradient(135deg,#233fd2,#2687ee 58%,#3bb2f4);color:#fff;border:0;padding:21px}.hero .label{opacity:.82;font-size:12px}.hero h1{font-size:34px;margin:5px 0}.hero p{margin:0;opacity:.82;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:11px}.stat small{display:block;opacity:.78;font-size:9px}.stat b{display:block;font-size:15px;margin-top:3px}
.title{font-size:21px;margin:4px 0 14px}.muted{color:var(--muted);font-size:12px;line-height:1.5}.section{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:900;color:#4263b8;margin-bottom:10px}
.ad{border:1px solid #d8e6ff;background:linear-gradient(145deg,#f4f8ff,#fff);text-align:center}.adicon{width:68px;height:68px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-size:27px}
.ad h2{font-size:20px;margin:6px 0}.ad p{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:13px;padding:13px 15px;width:100%;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 8px 18px rgba(36,84,232,.18)}
.btn:disabled{opacity:.55}.btn.secondary{background:#edf3ff;color:#2852bf;box-shadow:none;border:1px solid #d7e4ff}.btn.danger{background:#fff0f2;color:#be2941;box-shadow:none;border:1px solid #ffd0d7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.action{padding:15px 8px;border:1px solid var(--line);background:#fff;border-radius:17px;text-align:center}.action .ico{font-size:24px;margin-bottom:6px}.action b{font-size:11px}.action small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.input{width:100%;padding:14px;border:1px solid #dfe5ef;border-radius:13px;background:#fbfcff;outline:none;margin:5px 0 10px}.input:focus{border-color:#79a6ff;box-shadow:0 0 0 3px #edf3ff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.row:last-child{border-bottom:0}.pill{padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900}.paid{background:#e9fbf4;color:#10805b}.pending{background:#fff5e8;color:#b66a00}.declined{background:#fff0f2;color:#bf2942}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 24px));height:72px;background:#fff;border:1px solid var(--line);border-radius:0;display:flex;align-items:center;justify-content:space-around;box-shadow:0 14px 38px rgba(22,38,76,.14);z-index:20}.tab{border:0;background:none;color:#8994a8;font-size:9px;font-weight:800}.tab span{display:block;font-size:21px;margin-bottom:2px}.tab.active{color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(9,20,42,.48);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(420px,100%);background:#fff;border-radius:23px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.hidden{display:none}
.auth{min-height:100vh;display:flex;justify-content:center;background:linear-gradient(180deg,#f7f9fe,#eef4ff);padding:35px 20px}.authbox{width:min(430px,100%);margin:auto}.authlogo{width:78px;height:78px;border-radius:23px;background:#fff;box-shadow:0 10px 30px rgba(37,84,232,.12);display:grid;place-items:center;margin:0 auto 28px;color:var(--blue);font-size:27px;font-weight:900}.auth h1{text-align:center;font-size:34px;margin:0 0 7px}.authsub{text-align:center;color:var(--muted);margin:0 0 30px}.authcard{background:#fff;border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:0 10px 35px rgba(33,63,120,.07)}.fieldlabel{font-size:12px;font-weight:800;margin:0 0 7px}.switch{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.link{color:var(--blue);font-weight:800;cursor:pointer}.terms{font-size:9px;color:var(--muted);text-align:center;margin-top:13px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#12203d;color:#fff;padding:11px 15px;border-radius:12px;font-size:11px;font-weight:800;z-index:200}
@media(max-width:390px){.main{padding:13px}.hero h1{font-size:30px}.stats{gap:6px}.stat{padding:9px}.header{padding:0 13px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="overlay hidden"></div>
<script>
const KEY="blueearn_demo_user";
let state=JSON.parse(localStorage.getItem(KEY)||"null");
let page="home";

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return "₦"+Number(n||0).toLocaleString("en-NG",{maximumFractionDigits:2})}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function auth(mode="login"){
 document.getElementById("root").innerHTML=`<div class="auth"><div class="authbox">
   <div class="authlogo">iN</div>
   <h1>${mode==="login"?"Welcome back":"Create account"}</h1>
   <p class="authsub">${mode==="login"?"Sign in to continue earning":"Start earning in minutes. No KYC required."}</p>
   <div class="authcard">
    ${mode==="register"?`
      <div class="fieldlabel">Username</div><input id="username" class="input" placeholder="e.g. john_doe">
      <div class="fieldlabel">Email Address</div><input id="email" class="input" type="email" placeholder="name@example.com">
      <div class="fieldlabel">Phone Number</div><input id="phone" class="input" inputmode="tel" placeholder="08123456789">
      <div class="fieldlabel">Password</div><input id="password" class="input" type="password" placeholder="At least 8 characters">
      <div class="fieldlabel">Referral Code <span style="color:#8a94a7;font-weight:500">(Optional)</span></div>
      <input id="ref" class="input" value="${esc(new URLSearchParams(location.search).get("ref")||"")}">
      <button class="btn" onclick="register()">Create Account →</button>
      <p class="terms">Free sign up • Activation and withdrawals can be connected to your backend later.</p>
      <div class="switch">Already have an account? <span class="link" onclick="auth('login')">Login</span></div>
    `:`
      <div class="fieldlabel">Username or Email</div><input id="loginid" class="input" placeholder="Enter username or email">
      <div class="fieldlabel" style="display:flex;justify-content:space-between">Password <span class="link">Forgot?</span></div>
      <input id="loginpass" class="input" type="password" placeholder="••••••••">
      <button class="btn" onclick="login()">Login →</button>
      <div class="switch">Don't have an account? <span class="link" onclick="auth('register')">Create one</span></div>
    `}
   </div>
 </div></div>`;
}

function register(){
 const username=document.getElementById("username").value.trim(), email=document.getElementById("email").value.trim();
 const phone=document.getElementById("phone").value.trim(), password=document.getElementById("password").value;
 if(!username||!email||!phone||password.length<8)return toast("Please complete all fields");
 state={username,email,phone,password,points:0,cash:0,referrals:0,ads:0,withdrawals:[]};save();dashboard();toast("Account created");
}
function login(){
 if(!document.getElementById("loginid").value.trim()||!document.getElementById("loginpass").value)return toast("Enter your login details");
 if(!state){return toast("No demo account found. Create one first")}
 dashboard();toast("Welcome back");
}
function logout(){state=null;localStorage.removeItem(KEY);auth("login")}

let brandClicks=0, brandTimer=null;
function adminBrandTap(){
 brandClicks++;
 clearTimeout(brandTimer);
 brandTimer=setTimeout(()=>brandClicks=0,5000);
 if(brandClicks>=10){
   brandClicks=0;
   openAdmin();
 } else {
   // Silent until the 10th tap, matching the requested hidden admin trigger.
 }
}
function openAdmin(){
 const modal=document.getElementById("modal");
 modal.classList.remove("hidden");
 modal.innerHTML=`<div class="modal" style="max-height:92vh;overflow:auto">
   <div style="display:flex;justify-content:space-between;align-items:center">
     <div><div class="section">Control Center</div><h2 style="margin:0">Admin Panel</h2></div>
     <button class="iconbtn" onclick="closeModal()">×</button>
   </div>
   <div class="stats" style="margin-top:18px">
     <div class="stat" style="background:#f0f5ff;color:#14234a"><small>Total Users</small><b>1</b></div>
     <div class="stat" style="background:#f0f5ff;color:#14234a"><small>Pending</small><b>${state.withdrawals.filter(x=>x.status!=="paid").length}</b></div>
     <div class="stat" style="background:#f0f5ff;color:#14234a"><small>Ads Watched</small><b>${state.ads}</b></div>
   </div>
   <div class="card" style="margin-top:15px">
     <div class="section">User Balance Management</div>
     <input id="adminAmount" class="input" type="number" placeholder="Amount">
     <div class="grid2">
       <button class="btn" onclick="adminBalance(1)">+ Add Cash</button>
       <button class="btn secondary" onclick="adminBalance(-1)">− Remove Cash</button>
     </div>
   </div>
   <div class="card">
     <div class="section">Referral & Rewards</div>
     <div class="row"><span>Referral bonus</span><b>₦500 / activation</b></div>
     <div class="row"><span>Ad reward</span><b>10 Points</b></div>
     <div class="row"><span>Minimum withdrawal</span><b>₦100</b></div>
   </div>
   <div class="card">
     <div class="section">Withdrawal Requests</div>
     ${state.withdrawals.length ? state.withdrawals.slice().reverse().map((w,i)=>`
       <div class="row">
         <div><b>${money(w.amount)}</b><div class="muted">${esc(w.bank)} • ${esc(w.account)}</div></div>
         <span class="pill pending">PENDING</span>
       </div>`).join("") : '<p class="muted">No withdrawal requests.</p>'}
   </div>
   <div class="grid2">
     <button class="btn secondary" onclick="toast('Settings saved');closeModal()">Save Settings</button>
     <button class="btn danger" onclick="closeModal()">Close</button>
   </div>
 </div>`;
}
function adminBalance(sign){
 const amount=Number(document.getElementById("adminAmount")?.value||0);
 if(!amount)return toast("Enter an amount");
 state.cash=Math.max(0,state.cash+(sign*amount));save();renderPage();openAdmin();toast(sign>0?"Cash added":"Cash removed");
}

function header(){
 return `<header class="header"><div class="brand" onclick="adminBrandTap()" title="Admin"><div class="logo">iN</div><div><b>iN Worker</b><small>@${esc(state.username)}</small></div></div><div style="display:flex;gap:8px"><button class="iconbtn" onclick="toast('Menu opened')">☰</button><button class="iconbtn" onclick="toast('No new notifications')">♧</button></div></header>`;
}
function nav(){
 const items=[["home","⌂","Home"],["tasks","☷","Tasks"],["refer","♧","Refer"],["wallet","▣","Wallet"],["profile","●","Profile"]];
 return `<nav class="bottom">${items.map(x=>`<button class="tab ${page===x[0]?"active":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`;
}
function dashboard(){
 document.getElementById("root").innerHTML=`<div class="app">${header()}<main class="main" id="main"></main>${nav()}</div>`;
 renderPage();
 setTimeout(welcomePopup,450);
}
function go(p){page=p;renderPage()}
function renderPage(){
 const m=document.getElementById("main"); if(!m)return;
 if(page==="home")m.innerHTML=home();
 if(page==="tasks")m.innerHTML=tasks();
 if(page==="refer")m.innerHTML=refer();
 if(page==="wallet")m.innerHTML=wallet();
 if(page==="profile")m.innerHTML=profile();
}
function home(){
 return `<div class="card" style="background:#eafaf3;border-color:#bfe9d5;padding:17px 18px">
   <div style="display:flex;gap:13px;align-items:center">
     <div style="width:44px;height:44px;border-radius:50%;background:#16a673;display:grid;place-items:center;color:#fff;font-size:23px">✓</div>
     <div><b style="color:#13845f;font-size:17px">Account Activated</b><div class="muted" style="font-size:12px">All features unlocked — tasks, withdrawals & referral bonuses enabled.</div></div>
   </div>
 </div>
 <div class="card hero"><div class="label">Total balance</div><h1>${money(state.cash)}</h1><p>Available earnings</p>
   <div class="stats">
     <div class="stat"><small>Task Wallet</small><b>${money(state.cash)}</b></div>
     <div class="stat"><small>Deposit Wallet</small><b>₦0.00</b></div>
     <div class="stat"><small>Affiliate Wallet</small><b>₦${(state.referrals*500).toLocaleString("en-NG")}.00</b></div>
   </div>
 </div>
 <div class="card"><div class="grid2">
   <button class="action" onclick="go('tasks')"><div class="ico">☷</div><b>Tasks</b><small>Earn now</small></button>
   <button class="action" onclick="go('refer')"><div class="ico">♧</div><b>Refer</b><small>Get ₦500</small></button>
   <button class="action" onclick="go('wallet')"><div class="ico">▣</div><b>Wallet</b><small>Manage</small></button>
   <button class="action" onclick="go('profile')"><div class="ico">●</div><b>Profile</b><small>You</small></button>
   <button class="action" onclick="toast('Funding can be connected to your payment gateway')"><div class="ico">＋</div><b>Fund</b><small>Top up</small></button>
   <button class="action" onclick="toast('Data purchase feature ready for backend')"><div class="ico">▥</div><b>Data</b><small>Buy</small></button>
   <button class="action" onclick="toast('Airtime feature ready for backend')"><div class="ico">▯</div><b>Airtime</b><small>Top-up</small></button>
   <button class="action" onclick="go('wallet')"><div class="ico">⇩</div><b>Withdraw</b><small>Cash out</small></button>
 </div></div>
 <div class="card ad"><div class="adicon">▶</div><h2>Watch Ads & Earn</h2><p>Complete a short ad-viewing session and receive points.</p><button id="watch" class="btn" onclick="watchAd()">WATCH AD +10 POINTS</button><p>Reward is credited after the timer completes.</p></div>`;
}
function watchAd(){
 const b=document.getElementById("watch");if(!b)return;b.disabled=true;let n=5;b.textContent=`WATCHING AD... ${n}s`;
 const t=setInterval(()=>{n--;if(n>0)b.textContent=`WATCHING AD... ${n}s`;else{clearInterval(t);state.points+=10;state.ads++;save();toast("Ad completed! +10 Points");renderPage()}},1000);
}
function tasks(){
 return `<h2 class="title">Tasks</h2><div class="card"><div class="section">Available Task</div><div class="row"><div><b>Daily engagement task</b><div class="muted">Complete the task instructions and submit for review.</div></div><b style="color:#2454e8">+50 P</b></div><button class="btn" style="margin-top:13px" onclick="toast('Task submitted for review')">SUBMIT TASK</button></div>
 <div class="card ad"><div class="adicon">▶</div><h2>Watch Ads</h2><p>Earn 10 points per completed ad.</p><button class="btn" onclick="watchAd()">WATCH AD +10</button></div>`;
}
function refer(){
 const code="3456679E";
 const link=location.href.split("?")[0]+"?ref="+code;
 const earned=state.referrals*500;
 return `<h2 class="title">Refer & Earn</h2>
 <div class="card hero"><div class="label" style="font-size:13px;letter-spacing:.5px">AFFILIATE EARNINGS</div><h1>${money(earned)}</h1>
   <div style="margin-top:17px;background:rgba(255,255,255,.15);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🎁 &nbsp;Referral Bonus</span><b>₦500.00 / activation</b></div>
 </div>
 <div class="card"><h2 style="margin:0 0 17px;font-size:20px">Your Invitation Link</h2>
   <div class="section">Your Referral Code</div>
   <div style="border:1px dashed #78a0dc;border-radius:13px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px">
     <b style="font-size:24px;color:#3270d9;letter-spacing:1px">${code}</b>
     <button class="btn secondary" style="width:auto;white-space:nowrap" onclick="navigator.clipboard?.writeText('${code}');toast('Code copied')">▣ Copy Code</button>
   </div>
   <div class="section" style="margin-top:18px">Direct Link</div>
   <div style="background:#f8faff;border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;align-items:center;gap:7px">
     <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:12px">${esc(link)}</div>
     <button class="btn" style="width:auto;white-space:nowrap" onclick="navigator.clipboard?.writeText('${link}');toast('Link copied')">▣ Copy Link</button>
   </div>
   <div class="grid2" style="margin-top:13px">
     <button class="btn secondary" style="color:#1eb56e;border-color:#80dfb2" onclick="toast('WhatsApp sharing opened')">◉ WhatsApp</button>
     <button class="btn secondary" style="color:#1582c9;border-color:#76c2e6" onclick="toast('Telegram sharing opened')">➤ Telegram</button>
   </div>
   <p class="muted" style="text-align:center;margin:13px 4px 0">Note: Bonus is credited automatically once your referred user activates their account.</p>
 </div>
 <div class="card"><div class="grid2" style="text-align:center">
   <div><small style="color:#78859a;font-weight:800">TOTAL INVITED</small><div style="font-size:28px;font-weight:900;margin-top:6px">0</div></div>
   <div><small style="color:#78859a;font-weight:800">ACTIVATED</small><div style="font-size:28px;font-weight:900;color:#17a673;margin-top:6px">${state.referrals}</div></div>
 </div></div>
 <div class="card"><h2 style="margin:0 0 8px;font-size:18px">Your Referrals (${state.referrals})</h2><p class="muted">Your activated referrals will appear here.</p></div>`;
}
function wallet(){
 return `<h2 class="title">Wallet</h2><div class="card hero"><div class="label">Withdrawable Cash</div><h1>${money(state.cash)}</h1><p>Fast payout to your Nigerian bank account.</p></div>
 <div class="card"><div class="section">Request Withdrawal</div><input id="amount" class="input" type="number" placeholder="Amount">
 <input id="bank" class="input" placeholder="Bank Name"><input id="account" class="input" inputmode="numeric" maxlength="10" placeholder="10-Digit Account Number">
 <button class="btn" onclick="withdraw()">REQUEST WITHDRAWAL</button></div>
 <div class="card"><div class="section">Recent Withdrawals</div>${state.withdrawals.length?state.withdrawals.slice(-5).reverse().map(w=>`<div class="row"><div><b>${money(w.amount)}</b><div class="muted">${esc(w.bank)} • ${esc(w.account)}</div></div><span class="pill pending">PENDING</span></div>`).join(""):'<p class="muted">No withdrawals yet.</p>'}</div>`;
}
function withdraw(){
 const amount=Number(document.getElementById("amount").value),bank=document.getElementById("bank").value.trim(),account=document.getElementById("account").value.trim();
 if(!amount||amount<100||amount>state.cash||!bank||!/^\d{10}$/.test(account))return toast("Check amount, bank and account number");
 state.cash-=amount;state.withdrawals.push({amount,bank,account});save();toast("Withdrawal request submitted");renderPage();
}
function profile(){
 return `<h2 class="title">Profile</h2>
 <div class="card" style="text-align:center;padding-top:28px">
   <div style="position:relative;width:120px;margin:auto">
     <div style="width:120px;height:120px;border-radius:50%;background:#eef0ff;display:grid;place-items:center;font-size:58px;color:#68778d">●</div>
     <div style="position:absolute;right:-1px;bottom:1px;width:36px;height:36px;border-radius:50%;background:#2c6fe9;color:#fff;display:grid;place-items:center;border:4px solid #fff">▣</div>
   </div>
   <h1 style="font-size:29px;margin:25px 0 5px">@${esc(state.username)}</h1>
   <div class="muted" style="font-size:14px">Member since Aug 2026</div>
 </div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0;font-size:19px">♟ &nbsp;Profile Details</h2><span>⌄</span></div>
   <div class="fieldlabel">Email</div><input id="profileEmail" class="input" value="${esc(state.email)}">
   <div class="fieldlabel">Phone</div><input id="profilePhone" class="input" value="${esc(state.phone)}">
   <button class="btn" onclick="state.email=document.getElementById('profileEmail').value;state.phone=document.getElementById('profilePhone').value;save();toast('Profile saved')">Save changes</button>
   <p class="muted" style="text-align:center">Username can't be changed — it's tied to your account.</p>
 </div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">🔒 &nbsp;Security & Password</h2><span>⌄</span></div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">☷ &nbsp;Options & Preferences</h2></div></div>
 <button class="btn danger" style="font-size:16px;background:#e52b2f;color:#fff" onclick="logout()">⇥ &nbsp; Logout</button>`;
}
function welcomePopup(){
 const modal=document.getElementById("modal");if(!modal||!state)return;
 modal.classList.remove("hidden");modal.innerHTML=`<div class="modal"><div style="font-size:42px;text-align:center">👋</div><h2 style="text-align:center;margin:8px 0">Welcome back</h2><p class="muted" style="text-align:center">Complete tasks, watch ads and manage your earnings from your dashboard.</p><div class="grid2" style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">Later</button><button class="btn" onclick="closeModal()">Got it</button></div></div>`;
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
